<script id="kb-data" type="application/json">{"mode":"technical","repo":"Career OS","title":"Career OS","subtitle":"Architecture, stack, conventions, integrations and risks. An evidence-based reference for engineers.","audience":"For engineering teams","date":"2026-10-02","version":"47be31a","docs":[{"id":"readme","title":"Career OS — Knowledge Base","md":"\n# Career OS — Knowledge Base\n\nAn evidence-based reference for engineers working on **Career OS** — a self-hosted, provider-agnostic Personal AI Career Operating System. Built from the repository at revision `47be31a` (2026-10-02).\n\n## Executive summary\n\nCareer OS is a single-user-by-default, multi-user-ready **pnpm + Turborepo monorepo** (~91k lines of TypeScript across 4 apps and 13 packages). A Next.js 16 web app and a NestJS 10 API sit in front of **Postgres (system of record), Redis (queues), Qdrant (vectors), and MinIO (files)**; BullMQ workers do asynchronous ingestion/sync; an Electron + Playwright agent runs job-site discovery on the user's own machine. The AI layer is a `packages/ai` provider abstraction whose only shipped adapter is DeepSeek; every LLM call is meant to pass a sensitivity gate, produce schema-validated output, be grounded in the Postgres evidence graph, and be audit-logged.\n\nThe product's non-negotiable invariants (`AGENTS.md` §3): evidence (not LLM claims) is truth; generated content may only rephrase verified facts; every outbound action needs approval + audit; server-side scraping of LinkedIn/Indeed/Naukri/Glassdoor is prohibited; every job flows through one ingestion pipeline; and data carries sensitivity labels.\n\n**Maturity:** alpha, pre-v0.1. Every phase P0-P6 is \"In progress\" with named shipped slices and named deferrals (`plan/PLAN.md`). The web surface is owned by a parallel workstream (see `CHANGELOG.md` Notes). Treat unchecked items in `plan/*.md` as not-done.\n\n## Documents\n\n| Document | What it answers |\n|----------|-----------------|\n| [STACK.md](STACK.md) | Languages, runtimes, frameworks, dependency reality checks, commands, env |\n| [STRUCTURE.md](STRUCTURE.md) | Directory map, entry points, module boundaries, naming rules, workspace graph |\n| [ARCHITECTURE.md](ARCHITECTURE.md) | Style, system flow, layer responsibilities, patterns, risks, diagrams |\n| [CONVENTIONS.md](CONVENTIONS.md) | Naming, formatting/lint, imports, errors/logging, testing rules |\n| [INTEGRATIONS.md](INTEGRATIONS.md) | External APIs, data stores, secrets, reliability, observability, deployment |\n| [TESTING.md](TESTING.md) | Frameworks, layout, scope matrix, mocking, CI gates, gaps |\n| [CONCERNS.md](CONCERNS.md) | Prioritised risks, debt, security, performance, churn, and `[ASK USER]` items |\n| [PUBLIC_OVERVIEW.md](PUBLIC_OVERVIEW.md) | Plain-language product overview for a general audience |\n\n## How to use this knowledge base\n\n- **New to the repo?** Read this page, then `ARCHITECTURE.md`, then `STRUCTURE.md`. Keep `AGENTS.md` and `plan/PLAN.md` open beside it — they are the team's own durable spec and status board.\n- **About to change code?** Check `CONVENTIONS.md` and `TESTING.md` first; both cite the binding source files.\n- **Touching integrations or secrets?** Read `INTEGRATIONS.md` §3-4 and the matching item in `plan/security.md`.\n- **Triage or planning?** Start from `CONCERNS.md`; its top-risks table and `[ASK USER]` list are the shortest path to open questions.\n- **Evidence convention:** every non-trivial claim cites a committed file path. `[TODO]` = not determinable from the repo; `[ASK USER]` = requires team intent.\n\n## System overview\n\n```mermaid\nflowchart LR\n    subgraph Users\n        U[\"User / browser\"]\n        D[\"Desktop agent\"]\n    end\n    subgraph Core[\"Career OS (self-hosted)\"]\n        W[\"Next.js web\"]\n        A[\"NestJS api\"]\n        K[\"BullMQ workers\"]\n        subgraph Data[\"Postgres · Redis · Qdrant · MinIO\"]\n            P[(\"System of record\")]\n        end\n        S[\"Squid egress otion helpers | `packages/ui/src/motion.ts` does not exist | `packages/ui/src/index.ts` |\n| Dev commands | `pnpm check`, `pnpm seed:dev`, `pnpm erd`, `pnpm eval:ai`, `pnpm test:visual`, `pnpm fixtures:record`, `pnpm ai:probe` | Not all present in root `package.json` | `docs/dev-setup.md` vs `package.json` |\n| Analytics guard | Web ships a no-analytics test | Referenced `apps/web/src/no-analytics-sdk.test.ts` is absent | `scripts/__tests__/no-analytics-in-web.test.ts`, `plan/PENDING_2026-10-02.md` |\n\n## Coverage and confidence\n\n- **Built from:** committed source at `47be31a`, config, the team's own specs, and a full file scan (`docs/codebase/.codebase-scan.txt`).\n- **Not verified by running:** the stack was **not** booted (no `.env`, no Docker run). Behavioural claims come from the team's tests and docs, cited inline.\n- **Diagrams:** three Mermaid diagrams (system overview here, component + data-flow in `ARCHITECTURE.md`, workspace graph in `STRUCTURE.md`, deployment + auth sequence in `INTEGRATIONS.md`). Validate rendering before print.\n\n## Open questions\n\nSee the numbered `[ASK USER]` list at the end of [CONCERNS.md](CONCERNS.md) — the most consequential are the OSS/license decision, the TLS/reverse-proxy story, the real embedding model, and workspace version convergence.\n"},{"id":"stack","title":"Technology Stack","md":"\n# Technology Stack\n\nCareer OS is a self-hosted, provider-agnostic Personal AI Career Operating System. It is a pnpm/Turborepo monorepo written almost entirely in TypeScript, with a Next.js web app, a NestJS API, BullMQ workers, and an Electron desktop agent.\n\n> Evidence for every row below is a committed manifest, config, or source file. `[TODO]` marks unknowable facts; `[ASK USER]` marks intent-dependent ones.\n\n## Core Sections (Required)\n\n### 1) Runtime Summary\n\n| Area | Value | Evidence |\n|------|-------|----------|\n| Primary language | TypeScript (`.ts`/`.tsx`; 746 source files; ~91k LOC) | `docs/codebase/.codebase-scan.txt` (CODE METRICS); `tsconfig.base.json` |\n| Runtime + version | Node.js >= 20 (see `.nvmrc`; root `engines.node`) | `package.json:6-8`, `.nvmrc` |\n| Package manager | pnpm 9.12.0 (workspaces) | `package.json:5`, `pnpm-workspace.yaml:1-3` |\n| Module/build system | Turborepo 2 (`turbo run build/typecheck/lint`), per-workspace `tsc`/`nest build`/`next build` | `turbo.json:1-21`, `package.json:11-14` |\n| Module format | ESM-ish `module: ESNext` + `moduleResolution: Bundler`; API compiled by Nest CLI, worker run with `tsx` | `tsconfig.base.json:4-5`, `apps/worker/package.json:6` |\n| Workspace layout | `apps/*` + `packages/*` (4 apps, 13 packages) | `pnpm-workspace.yaml:1-3` |\n\n### 2) Production Frameworks and Dependencies\n\n| Dependency | Version | Role in system | Evidence |\n|------------|---------|----------------|----------|\n| Next.js | 16.3.6 (pinned) | Web app, App Router, middleware | `apps/web/package.json` |\n| React | ^19.3.0 | Web + UI component runtime | `apps/web/package.json` |\n| NestJS (`@nestjs/common`/`core`) | ^10.4.4 | HTTP API, modules, DI, WebSockets gateway | `apps/api/package.json` |\n| `@nestjs/platform-express` | ^10.4.22 | Express HTTP adapter (raw body for Slack HMAC) | `apps/api/package.json`, `apps/api/src/main.ts:88` |\n| `@nestjs/platform-socket.io` + `socket.io` | ^10.4.4 / ^4.8.1 | Desktop-agent WSS pairing/task channel | `apps/api/package.json`, `apps/api/src/modules/agent/agent.gateway.ts` |\n| Prisma + `@prisma/client` | ^6.19.3 | ORM + migrations (55 models, 0 enums, 38 migrations) | `apps/api/package.json`, `apps/api/prisma/schema.prisma` |\n| PostgreSQL | 16-alpine (digest-pinned) | System of record | `infra/docker/docker-compose.yml` |\n| Redis + BullMQ | redis:7-alpine / `bullmq ^5.13.0` | Queues, cache, rate-limit store | `infra/docker/docker-compose.yml`, `apps/worker/package.json` |\n| Qdrant client | `@qdrant/js-client-rest ^1.12.0` | Vector store for semantic content | `packages/embeddings/package.json` |\n| MinIO client | `minio ^8.0.2` | Object storage (resumes, artifacts, screenshots) | `apps/api/package.json`, `apps/api/src/common/storage.service.ts` |\n| `argon2` | ^0.41.1 | Argon2id password hashing | `packages/auth/package.json:13` |\n| `iron-session` | ^8.0.3 | Sealed session cookie (`__Host-*`, AES-256-GCM) | `apps/api/package.json`, `packages/auth/src/session.ts` |\n| `@simplewebauthn/server` | ^11 | Passkey / WebAuthn MFA | `apps/api/package.json` |\n| `helmet` | ^8.0.0 | Security headers + CSP nonce | `apps/api/src/main.ts:5,13-80` |\n| `@nestjs/throttler` + `@nest-lab/throttler-storage-redis` | ^6.4.0 / ^1.2.0 | Redis-backed rate limiting | `apps/api/package.json`, `apps/api/src/modules/auth/auth.module.ts:21-31` |\n| `zod` | ^3.23.8 | Trust-boundary validation (HTTP + LLM structured output) | `packages/shared/package.json`, `apps/api/src/common/pipes/zod-validation.pipe.ts` |\n| `pino` + `nestjs-pino` | ^9.5.0 / ^4.1.0 | Structured JSON logging | `apps/api/package.json`, `plan/observability.md` |\n| `prom-client` | ^15.1.3 | Prometheus metrics on `/metrics` | `apps/api/package.json`, `apps/api/src/common/metrics/` |\n| `@slack/web-api` | ^7.11.0 | Slack daily-assistant integration | `apps/api/package.json` |\n| `googleapis` + `google-auth-library` | ^144.0.0 / ^9.15.0 | Gmail OAuth, watch, push ingest | `apps/api/package.json` |\n| `@octokit/rest` | ^21.1.0 | GitHub repo sync in workers | `apps/worker/package.json` |\n| `@react-pdf/renderer` + `docx` | ^4.9.0 / ^9.5.1 | Resume/cover-letter PDF + DOCX rendering | `packages/resume-render/package.json` |\n| `electron` + `electron-updater` + `playwright-core` + `keytar` | ^31.3.1 / ^6.3.9 / ^1.47.2 / ^7.9.0 | Desktop companion agent | `apps/desktop/package.json` |\n| `cheerio` | ^1.0.0 | Email-alert HTML parsing | `packages/email-parsers/package.json` |\n\n**Notable production choices and reality checks**\n\n- **Only one LLM adapter ships today:** `packages/ai/src/providers/deepseek.ts`. The `AIProvider` abstraction and `ProviderRegistry` exist, but no OpenAI/Anthropic/Ollama adapter exists in the tree. DeepSeek is chat-only (structured output yes, streaming/tools/embeddings no). See `packages/ai/src/provider.ts`, `packages/ai/src/registry.ts`, `packages/ai/src/providers/`.\n- **Embeddings are a placeholder:** `packages/embeddings/src/local.ts` returns a SHA-256-seeded, L2-normalised 384-d vector, not the `bge-small-en` / `@xenova/transformers` model promised in `AGENTS.md` §4 and `plan/PLAN.md`. No transformers dependency exists. See `CONCERNS.md`.\n- **No `@nestjs/swagger` dependency exists**, despite `AGENTS.md` §6 requiring decorators and `/api/docs`; `docs/dev-setup.md:46` still points users at `http://localhost:3001/api/docs`.\n\n### 3) Development Toolchain\n\n| Tool | Purpose | Evidence |\n|------|---------|----------|\n| Turborepo 2.11.2 | Task orchestration + cache | `package.json`, `turbo.json` |\n| TypeScript 5.9.3 (^5.6.3) | Strict compilation (`strict`, `exactOptionalPropertyTypes`, `noUncheckedIndexedAccess`) | `tsconfig.base.json` |\n| Prettier 3.9.8 + `prettier-plugin-tailwindcss` | Formatting | `.prettierrc` |\n| ESLint 8 (`next lint` in web; root `.eslintrc.cjs` is a reference config) | Lint: no `console.log`, no raw `provider.chat(`, literal `data-testid` | `.eslintrc.cjs`, `apps/web/package.json` |\n| Vitest 5 | Unit + integration runner | `vitest.config.ts`, `package.json` |\n| Testcontainers 10.28 | Real Postgres/Redis/Qdrant/MinIO for integration tests | `packages/testing/package.json`, `packages/testing/src/index.ts` |\n| Playwright 1.63 | E2E, a11y, visual | `apps/web/playwright.config.ts`, `apps/web/e2e/` |\n| `fast-check` 4.10 | Property-based tests | `package.json`, `packages/testing/src/index.ts` |\n| `msw` 2.15 | External HTTP mocks (unit) | `packages/testing/src/index.ts` |\n| `@axe-core/playwright` 4.10 | WCAG 2.1 AA checks | `apps/web/package.json` |\n| lefthook | Pre-commit gitleaks + typecheck + lint | `lefthook.yml`, `package.json:10` |\n| ESLint (dormant root chain) | Cross-cutting rules; requires workspaces to opt in | `.eslintrc.cjs:10-18` |\n\n### 4) Key Commands\n\n```bash\npnpm install                       # install all workspace deps\npnpm docker:up                     # build shared pkgs + start full compose stack\npnpm migrate                       # prisma migrate deploy\npnpm dev                           # turbo run dev --parallel (api + web + worker)\npnpm build                         # turbo run build\npnpm typecheck                     # turbo run typecheck\npnpm lint                          # turbo run lint\npnpm test                          # vitest run (unit + integration)\npnpm test:unit                     # excludes integration + e2e\npnpm test:integration              # vitest run integration.test\npnpm test:e2e                      # @careeros/web Playwright\npnpm test:evals                    # @careeros/ai LLM evals (EVAL_MOCK=1 default)\nmake help                          # shortcut help (Makefile)\n```\n\n### 5) Environment and Config\n\n- **Config sources:** `.env` (copied from `.env.example`), `apps/api/prisma/schema.prisma`, `apps/web/next.config.mjs`, `apps/web/tailwind.config.ts`, `infra/docker/docker-compose.yml`, per-workspace `tsconfig.json`, `packages/ui/src/tokens.css`.\n- **Required env vars** (from `.env.example`): `POSTGRES_USER`, `POSTGRES_DB`, `POSTGRES_PASSWORD`, `DATABASE_URL`, `REDIS_URL`, `QDRANT_URL`, `MINIO_ROOT_USER`, `MINIO_ROOT_PASSWORD`, `MINIO_BUCKET`, `ENCRYPTION_KEY`, `SESSION_SECRET`, `API_PORT`, `WEB_PORT`, `WEB_URL`, `API_URL`, `TRUSTED_ORIGINS`, `SESSION_TTL_HOURS`. Optional/gated: `DEEPSEEK_API_KEY`, `LOG_LEVEL`, `LOG_DEBUG`, `NEXT_TELEMETRY_DISABLED`.\n- **Boot-time enforcement:** `apps/api/src/startup-check.ts` refuses to start on missing/weak `ENCRYPTION_KEY`, `SESSION_SECRET`, or datastore credentials (<24 bytes or known-weak). Compose interpolates `${VAR:?...}` so a missing password aborts the stack.\n- **Deployment/runtime constraints:** Docker Compose on a VPS; api/worker reach the internet only through an allowlisting Squid proxy; datastores on an `internal: true` network; api container runs `read_only`, `cap_drop: ALL`, `no-new-privileges`. `[TODO]` TLS/reverse-proxy (nginx) is planned but no `infra/nginx/` directory exists in the tree.\n\n### 6) Evidence\n\n- `package.json`, `pnpm-workspace.yaml`, `pnpm-lock.yaml`, `turbo.json`, `tsconfig.base.json`, `.nvmrc`\n- `apps/*/package.json`, `packages/*/package.json`\n- `.env.example`, `infra/docker/docker-compose.yml`, `apps/api/src/startup-check.ts`\n- `docs/codebase/.codebase-scan.txt` (DIRECTORY TREE, STACK DETECTION, CODE METRICS)\n\n## Extended Sections\n\n### Docker base images (digest-pinned)\n\n`infra/docker/docker-compose.yml`: `postgres:*`, `redis:*`, `qdrant/qdrant:v1.12.4`, `bitnamilegacy/minio`, `ubuntu/squid:6.10`, plus locally built `api`/`worker`/`web` images. `scripts/verify-image-pins.sh` fails CI if a floating tag is reintroduced (security spec item 10).\n\n### Shared-package dependency graph (production deps only)\n\n`@careeros/shared` (zod) is the base; `@careeros/ai`, `@careeros/job-pipeline`, `@careeros/email-parsers`, `@careeros/browser-agent` depend on it; `@careeros/embeddings` (Qdrant) and `@careeros/resume-render` (React-PDF/docx) are leaf capabilities; `@careeros/messaging`, `@careeros/secrets`, `@careeros/auth`, `@careeros/sandbox`, `@careeros/ui`, `@careeros/testing` are independent. `apps/api` and `apps/worker` compose all of the above. See `STRUCTURE.md` for the diagram.\n"},{"id":"structure","title":"Codebase Structure","md":"\n# Codebase Structure\n\nCareer OS is a pnpm + Turborepo monorepo with four applications and thirteen shared packages. There is no path-alias indirection: cross-workspace imports use the `@careeros/*` package names declared in each `package.json`; within a workspace imports are relative.\n\n## Core Sections (Required)\n\n### 1) Top-Level Map\n\n| Path | Purpose | Evidence |\n|------|---------|----------|\n| `apps/web/` | Next.js 16 App Router user app (47 pages): setup wizard, dashboard, arena, market, jobs, settings | `apps/web/src/app/**/page.tsx`; `apps/web/package.json` |\n| `apps/api/` | NestJS HTTP API: 38 feature modules, Prisma data layer, WebSockets gateway, seed data | `apps/api/src/app.module.ts:14-124`; `apps/api/src/modules/` |\n| `apps/worker/` | BullMQ workers on Redis (sync, embedding, retention, market snapshot, Gmail watch, selector health, corpus refresh) | `apps/worker/src/main.ts`; `apps/worker/src/*.worker.ts` |\n| `apps/desktop/` | Electron desktop companion agent (Playwright + user's Chrome, WSS pairing) | `apps/desktop/src/main.ts`; `apps/desktop/package.json` |\n| `packages/ai/` | `AIProvider` abstraction, DeepSeek adapter, versioned prompts, grounding/injection/sensitivity, evals | `packages/ai/src/` |\n| `packages/shared/` | Zod schemas, constants, knowledge rules, queues, retry, redact, git-analysis, SSRF guard | `packages/shared/src/` |\n| `packages/job-pipeline/` | Source-agnostic job ingestion funnel (adapters + stages) | `packages/job-pipeline/src/` |\n| `packages/embeddings/` | Qdrant store wrapper + local (placeholder) embedder | `packages/embeddings/src/` |\n| `packages/auth/` | Argon2id hashing + sealed session cookie helpers | `packages/auth/src/` |\n| `packages/secrets/` | AES-256-GCM field encryption + master-key validation | `packages/secrets/src/` |\n| `packages/browser-agent/` | Agent task contract, YAML allowlist, pacing, kill-switch, selector health | `packages/browser-agent/src/` |\n| `packages/email-parsers/` | LinkedIn/Indeed/Naukri alert-HTML parsers | `packages/email-parsers/src/` |\n| `packages/resume-render/` | PDF/DOCX resume + cover-letter rendering and templates | `packages/resume-render/src/` |\n| `packages/sandbox/` | Docker-per-run code execution with resource/kill limits | `packages/sandbox/src/` |\n| `packages/messaging/` | Transport-free `Channel` interface (Slack/Web/WhatsApp/Discord) | `packages/messaging/src/` |\n| `packages/ui/` | Design-system primitives, tokens, layout | `packages/ui/src/` |\n| `packages/testing/` | Testcontainers harness, MSW handlers, axe, arbitraries | `packages/testing/src/index.ts` |\n| `infra/` | Docker Compose, Postgres init, Squid config, Slack manifest | `infra/docker/`, `infra/postgres/`, `infra/slack/` |\n| `plan/` | Living implementation plan, per-phase checklists, cross-cutting specs (security, ai-safety, testing, observability, release) | `plan/PLAN.md` and siblings |\n| `docs/` | Operator docs + authoritative product blueprint (`.docx`) | `docs/architecture.md`, `docs/*.docx` |\n| `careeros-screens/` | 60+ static HTML wireframes (information architecture only, not final design) | `careeros-screens/index.html` |\n| `scripts/` | Backup/restore, verification gates, browser-agent probes, smoke tests | `scripts/` |\n| `.github/workflows/` | 9 CI/CD workflows | `.github/workflows/` |\n| `AGENTS.md` | Durable agent/dev rules for the repo | `AGENTS.md` |\n\n### 2) Entry Points\n\n- **Main runtime entry (API):** `apps/api/src/main.ts` — boots after `startup-check.ts`, registers global `LockoutExceptionFilter`, helmet security middleware, Swagger-less OpenAPI `[TODO]`.\n- **Web entry:** `apps/web/src/app/layout.tsx` + `apps/web/src/middleware.ts` (setup-state gate).\n- **Worker entry:** `apps/worker/src/main.ts` — pino + Prisma + heartbeat + Qdrant + seed skills + register workers.\n- **Desktop entry:** `apps/desktop/src/main.ts` (Electron main process, tray + pairing window).\n- **Secondary entry points:** NestJS `AgentGateway` (`apps/api/src/modules/agent/agent.gateway.ts`); scheduled BullMQ repeatables registered in `apps/worker/src/main.ts`; `scripts/backup.sh` / `restore.sh`.\n- **How entry is selected:** root `package.json` scripts drive `turbo run dev`; each workspace declares its own `dev`/`start`; API production start runs `prisma migrate deploy` first (`apps/api/package.json:11`).\n\n### 3) Module Boundaries\n\n| Boundary | What belongs here | What must not be here |\n|----------|-------------------|------------------------|\n| `apps/web` | UI, routing, browser fetch wrapper, middleware gate | Direct imports of adapter/provider packages; server secrets |\n| `apps/api` | HTTP/WS controllers, domain services, Prisma access, guards | Long-running batch jobs (those go to worker); provider SDK calls outside `packages/ai` |\n| `apps/worker` | BullMQ processors, scheduled jobs, external sync | HTTP request handling |\n| `apps/desktop` | Local Playwright execution, keychain, WSS client, OS integration | Server-side business logic; server scraping |\n| `packages/*` | Reusable capability with a stable interface | Feature-specific controller/service logic (belongs in `apps/api`) |\n| `packages/ai` | Provider abstraction, prompts, grounding/safety | Direct DB access (agents write through domain services) |\n\nRule from `AGENTS.md` §5: never import an adapter from `apps/web` directly; go through a stable `packages/` interface. Domain logic lives in `apps/api` NestJS modules.\n\n### 4) Naming and Organization Rules\n\n- **File naming:** `kebab-case` for multi-word files (`zod-validation.pipe.ts`, `agent.jwt-strategy.ts`, `market-snapshot.worker.ts`); React components are `PascalCase.tsx` (`SkillTree.tsx`, `ApprovalQueue.tsx`); hooks/utilities are `camelCase.ts` (`useDrafts.ts`, `api-client.ts`).\n- **Directory organization:** `apps/api` is module/feature-based (`modules/<feature>/<feature>.controller.ts|service.ts|module.ts`); `apps/web` is route-based under `src/app` and feature-based under `src/components/<feature>/`; `packages` are capability-based with a barrel `src/index.ts`.\n- **Bootstrap file inside modules:** modules consistently use `<feature>.module.ts` + `<feature>.controller.ts` + `<feature>.service.ts`, and colocate `<name>.test.ts`.\n- **Import aliases:** no custom `paths` alias in `tsconfig.base.json`; `@careeros/*` is the workspace package name; intra-workspace imports are relative (`../..`).\n- **Barrel policy:** every package exposes a single `src/index.ts`; `@careeros/shared` additionally exposes subpath exports (`./schemas`, `./constants`, `./redact`, `./retry`, `./net`). `./net` is deliberately excluded from the barrel (`packages/shared/src/index.ts:18-19`).\n\n### 5) Evidence\n\n- `apps/api/src/app.module.ts`, `apps/api/src/main.ts`, `apps/api/src/modules/`\n- `apps/web/src/app/`, `apps/web/src/components/`, `packages/ui/src/index.ts`\n- `pnpm-workspace.yaml`, `turbo.json`, `packages/*/package.json`, `docs/codebase/.codebase-scan.txt` (DIRECTORY TREE)\n\n## Extended Sections\n\n### Workspace dependency diagram\n\n```mermaid\nflowchart TB\n    subgraph apps[\"Applications\"]\n        WEB[\"apps/web<br/>Next.js 16\"]\n        API[\"apps/api<br/>NestJS 10\"]\n        WORKER[\"apps/worker<br/>BullMQ\"]\n        DESKTOP[\"apps/desktop<br/>Electron\"]\n    end\n\n    subgraph pkgs[\"Shared packages\"]\n        SHARED[\"@careeros/shared\"]\n        AI[\"@careeros/ai\"]\n        EMB[\"@careeros/embeddings\"]\n        PIPE[\"@careeros/job-pipeline\"]\n        BROWSER[\"@careeros/browser-agent\"]\n        EMAIL[\"@careeros/email-parsers\"]\n        RENDER[\"@careeros/resume-render\"]\n        SANDBOX[\"@careeros/sandbox\"]\n        AUTH[\"@careeros/auth\"]\n        SECRETS[\"@careeros/secrets\"]\n        MSG[\"@careeros/messaging\"]\n        UI[\"@careeros/ui\"]\n        TESTING[\"@careeros/testing\"]\n    end\n\n    WEB --> SHARED\n    WEB --> UI\n    API --> SHARED\n    API --> AI\n    API --> AUTH\n    API --> SECRETS\n    API --> EMB\n    API --> PIPE\n    API --> RENDER\n    API --> SANDBOX\n    API --> MSG\n    WORKER --> SHARED\n    WORKER --> EMB\n    WORKER --> SECRETS\n    WORKER --> BROWSER\n    DESKTOP --> BROWSER\n\n    AI --> SHARED\n    PIPE --> SHARED\n    BROWSER --> SHARED\n    EMAIL --> SHARED\n\n    AUTH -. independent .-> AUTH\n    SECRETS -. independent .-> SECRETS\n    UI -. standalone .-> UI\n    RENDER -. standalone .-> RENDER\n    SANDBOX -. standalone .-> SANDBOX\n    EMB --> QDRANT[(\"Qdrant\")]\n    API --> STORES[(\"Postgres · Redis · MinIO\")]\n    WORKER --> STORES\n```\n\n### Generated vs source boundaries\n\n- Do not document or edit generated output: `dist/`, `.next/`, `apps/*/dist`, `packages/*/dist`, `prisma/generated/`, coverage. `.gitignore` and `.eslintrc.cjs:29-38` both exclude them.\n- `apps/api/prisma/migrations/` **is** committed source (38 migration directories) and must be treated as reviewable code (`AGENTS.md` §6).\n- The product blueprint `docs/*.docx` is the authoritative *product* spec; `docs/architecture.md` is the maintained integration narrative.\n\n### Empty / not-yet-created paths referenced by config\n\n`[TODO]` Several paths are referenced by scripts, CI, or docs but do not exist in the tree: `infra/nginx/`, `infra/docker/docker-compose.host-dev.yml`, `scripts/dev-host.sh`, `scripts/seed-test.ts`, `packages/ui/src/motion.ts` (re-exported by `packages/ui/src/index.ts`). See `CONCERNS.md`.\n"},{"id":"architecture","title":"Architecture","md":"\n# Architecture\n\nCareer OS is a layered, modular monolith plus async workers and a local desktop agent. Postgres is the source of truth; LLMs never are (`AGENTS.md` §1, `docs/architecture.md` §9).\n\n## Core Sections (Required)\n\n### 1) Architectural Style\n\n- **Primary style:** layered + feature-modular monolith (`apps/api` NestJS modules over a Prisma data layer), with an event/queue side-car (`apps/worker` + BullMQ) and an out-of-process agent (`apps/desktop`).\n- **Why this classification (evidence):** `apps/api/src/app.module.ts:14-124` registers 38 feature modules plus infra modules (`PrismaModule`, `StorageModule`, `QueueModule`, `SensitivityGateModule`, `MetricsModule`); each module owns controller + service + Prisma access. `apps/worker/src/main.ts` boots independent queue consumers. `packages/*` hold capability interfaces consumed by both.\n- **Primary constraints (evidence):**\n  1. **Evidence over claims** — Postgres evidence graph is authoritative; LLMs interpret only (`AGENTS.md` §1, §11).\n  2. **Privacy/egress control** — server scraping of LinkedIn/Indeed/Naukri/Glassdoor is prohibited; only partner APIs, the user's own agent session, or parsed email alerts (`AGENTS.md` §3.4, §15).\n  3. **Approval + audit for outbound actions** — nothing sends without an approval-queue item and an append-only audit row (`AGENTS.md` §3.3, `apps/api/src/modules/approvals/`).\n\n### 2) System Flow\n\n```text\nBrowser (Next.js) → middleware setup-gate → /api HTTP (NestJS controllers)\n  → domain service (modules/*) → packages/* capability (ai, job-pipeline, secrets…)\n  → Postgres / Qdrant / Redis / MinIO  → response\nAsync: API enqueues BullMQ job → apps/worker processor → external API\n  → Postgres evidence/pipeline rows → (optionally) WSS push back to browser\n```\n\nConcretely, a GitHub connect (`docs/architecture.md` §4.2): web `POST /integrations/github/select` → API enqueues `github.sync` → worker lists repos via Octokit → evidence rows → KnowledgeAggregator updates `candidate_skill_state` and appends `skill_state_event` → dashboard reads `/me/skills`.\n\nAn LLM call (`docs/architecture.md` §5.3): build versioned prompt → sensitivity gate → provider registry → `chatStructured<T>({schema})` → Zod validation (one retry) → `llm_calls` audit row → optional fact-check gate before rendering.\n\n### 3) Layer/Module Responsibilities\n\n| Layer or module | Owns | Must not own | Evidence |\n|-----------------|------|--------------|----------|\n| `apps/web` | Routing, middleware gate, feature components, browser fetch/CSRF | Adapter imports, server secrets | `apps/web/src/middleware.ts`, `apps/web/src/lib/api-client.ts` |\n| `apps/api/modules/*` | HTTP/WS endpoints, domain rules, state machines, Prisma access | Provider SDK calls, long batch jobs | `apps/api/src/modules/` |\n| `apps/api/common` | Guards, pipes, filters, storage, metrics, redaction | Feature domain logic | `apps/api/src/common/` |\n| `apps/worker` | Queue processors, cron jobs, external sync | HTTP handling | `apps/worker/src/*.worker.ts`, `main.ts` |\n| `apps/desktop` | Local Playwright, keychain, WSS, OS integration | Server business logic, server-side scraping | `apps/desktop/src/main.ts`, `task-runner.ts` |\n| `packages/ai` | Provider abstraction, prompts, grounding, injection/sensitivity | DB writes | `packages/ai/src/provider.ts`, `providers/deepseek.ts` |\n| `packages/job-pipeline` | Source-agnostic ingestion stages + adapters | Persistence (caller writes) | `packages/job-pipeline/src/stages/`, `adapters/` |\n| `packages/shared` | Zod schemas, constants, knowledge rules, retry, redact, SSRF guard | Feature-specific logic | `packages/shared/src/` |\n\n### 4) Reused Patterns\n\n| Pattern | Where found | Why it exists |\n|---------|-------------|---------------|\n| Provider/Adapter (Strategy) | `packages/ai/src/provider.ts` + `registry.ts`; `packages/job-pipeline/src/adapters/`; `packages/embeddings/src/qdrant.ts` | Swap LLM/job source without touching domain code |\n| Registry (explicit, no FS scan) | `ProviderRegistry`, prompt registry `packages/ai/src/prompts/index.ts`, adapter registry | Predictable boot; unknown ID = hard fail |\n| Repository/Service via DI | All `apps/api/src/modules/*.service.ts` + PrismaService | Keep invariant enforcement in one layer |\n| State machine | `apps/api/src/modules/approvals/state-machine.ts`; `packages/shared/src/applications.ts` (`canTransition`) | Guard irreversible transitions |\n| Queue + idempotent job IDs | `apps/worker/src/main.ts`, `packages/shared/src/queues.ts` | Reliable async; no double-processing |\n| Zod at trust boundaries | `apps/api/src/common/pipes/zod-validation.pipe.ts`; every prompt schema | Validate every request + LLM response |\n| Grounded generation | `packages/ai/src/grounded.ts` + `grounded/gate.ts`; fact-check in `resume-variants` | Every generated claim binds to a `fact_id` |\n| Untrusted-content isolation | `packages/ai/src/wrap.ts` + `injection-scan.ts` | Structural prompt-injection defence |\n| Field-level encryption via middleware | `apps/api/src/prisma/prisma.service.ts:28-116` | Encrypt PII at rest transparently |\n| Guard/decorator | `RequireAdminGuard`, `@RateLimitAuth()`, `AgentJwtGuard` | Cross-cutting auth/limits |\n\n### 5) Known Architectural Risks\n\n- **Multi-user not enforced by default.** Most modules call `SessionService.requireUserId`, but there is no global session guard; global `AppConfig` writes are explicitly blocked when a second user exists (`UsageService.assertSingleUserForGlobalConfig`, `plan/security.md` item 1). A missed `requireUserId` could expose data before multi-tenant work lands. See `CONCERNS.md`.\n- **Schema is string-typed, not enum-enforced.** 55 Prisma models, 0 `enum` blocks — states are `String` with documented unions (`Application.state`, `Evidence.kind`, `NormalizedJob.state`). Invalid states are only prevented by app code.\n- **Placeholder embedding + single LLM provider** mean semantic search and provider-agnosticism are not yet real (`packages/embeddings/src/local.ts`, `packages/ai/src/providers/`).\n- **Two Prisma major versions across workspaces** (`@prisma/client ^6.19.3` in api vs `^5.20.0` in worker) risk schema/client drift.\n- **N+1 / pagination ceiling** already identified by the team: `plan/PLAN.md:69` parks N+1 in `JobsService.sync` and a match-score pagination pool ceiling as debt.\n- **Deferred phase slices** (see `plan/DEFERRED.md`) mean several documented flows are partial; `[TODO]` surfaces referenced in docs may not exist.\n\n### 6) Evidence\n\n- `docs/architecture.md` (system topology, golden paths, data lifecycles, failure modes)\n- `AGENTS.md` §1-§14, `plan/PLAN.md` (locked decisions, status board)\n- `apps/api/src/main.ts`, `apps/api/src/app.module.ts`, `apps/api/src/modules/`\n- `apps/worker/src/main.ts`, `packages/ai/src/{provider,registry,grounded,wrap}.ts`\n- `apps/api/prisma/schema.prisma`\n\n## Extended Sections\n\n### Component / deployment architecture\n\n```mermaid\nflowchart TB\n    subgraph client[\"Clients\"]\n        Browser[\"User browser\"]\n        Agent[\"Desktop agent (Electron + Playwright + Chrome)\"]\n    end\n\n    subgraph vps[\"Self-hosted host (Docker Compose)\"]\n        Web[\"web (Next.js :3000)\"]\n        API[\"api (NestJS :3001)\"]\n        Worker[\"worker (BullMQ)\"]\n        subgraph data[\"Private network (internal: true)\"]\n            PG[(\"Postgres\")]\n            Redis[(\"Redis\")]\n            Qdrant[(\"Qdrant\")]\n            MinIO[(\"MinIO\")]\n        end\n        Squid[\"squid egress proxy (allowlist)\"]\n    end\n\n    subgraph ext[\"External (operator-configured)\"]\n        DeepSeek[\"DeepSeek API\"]\n        GitHub[\"GitHub / GitLab\"]\n        ATS[\"Ashby / Greenhouse\"]\n        Agg[\"Adzuna / Remotive / Arbeitnow\"]\n        Slack[\"Slack\"]\n        Gmail[\"Gmail + Pub/Sub\"]\n    end\n\n    Browser -->|HTTP| Web --> API\n    Agent <-.WSS pairing.-> API\n    API --> PG\n    API --> Redis\n    API --> Qdrant\n    API --> MinIO\n    Worker --> PG\n    Worker --> Redis\n    Worker --> Qdrant\n    API --> Squid\n    Worker --> Squid\n    Squid --> DeepSeek\n    Squid --> GitHub\n    Squid --> ATS\n    Squid --> Agg\n    API -. webhooks .-> Slack\n    Slack -. events .-> API\n    Gmail -. push .-> API\n```\n\n### Data flow: job ingestion to match (source-agnostic)\n\n```mermaid\nsequenceDiagram\n    participant Sched as Scheduler (BullMQ)\n    participant Adapter as Job adapters (Ashby/Adzuna/…)\n    participant Pipeline as packages/job-pipeline\n    participant LLM as DeepSeek (grounded skill extract)\n    participant DB as Postgres\n    participant User as User (web)\n\n    Sched->>Adapter: hourly ingest tick\n    Adapter->>Pipeline: RawJob[]\n    Pipeline->>DB: insert jobs_raw (append-only)\n    Pipeline->>Pipeline: normalize → dedupe → cross-source dedupe → freshness\n    Pipeline->>LLM: skill extract (wrapUntrusted + schema)\n    LLM-->>Pipeline: {skill_ids[], evidence_refs}\n    Pipeline->>Pipeline: verify (trust order) → relevance → match\n    Pipeline->>DB: upsert NormalizedJob + JobRejectLog on reject\n    User->>DB: GET /jobs → match list with gap report\n```\n\n### Failure modes / degraded behaviour\n\nThe repo documents its degradation posture in `docs/architecture.md` §8: DeepSeek circuit-breaker to fallback provider; Postgres down → 503 + retry loop; Qdrant down → text fallback; Redis down → in-memory rate limit; agent offline → tasks held 7 days; LLM budget exceeded → 429 with reset time; injection detected → auto-action skipped. The observability contract adds `/health` (dependency checks, 5s cache) and `/metrics` (`plan/observability.md`).\n"},{"id":"conventions","title":"Coding Conventions","md":"\n# Coding Conventions\n\nConventions below are stated in `AGENTS.md`, `CONTRIBUTING.md`, and enforced (or partially enforced) by config in the repo. Where a rule is aspirational rather than enforced, that is called out explicitly.\n\n## Core Sections (Required)\n\n### 1) Naming Rules\n\n| Item | Rule | Example | Evidence |\n|------|------|---------|----------|\n| Files (non-React) | kebab-case (dot-separated \"type\" suffix for Nest components) | `zod-validation.pipe.ts`, `market-snapshot.worker.ts`, `assert-public-url.ts` | `apps/api/src/common/pipes/zod-validation.pipe.ts`; `apps/worker/src/market-snapshot.worker.ts` |\n| React components | PascalCase `.tsx`, one component per file | `SkillTree.tsx`, `ApprovalQueue.tsx` | `apps/web/src/components/skills/SkillTree.tsx` |\n| Hooks / utilities | camelCase | `useDrafts.ts`, `api-client.ts`, `chart-geometry.ts` | `packages/ui/src/useDrafts.ts`; `apps/web/src/lib/api-client.ts` |\n| Functions/methods | camelCase, verb-first | `syncSkillState`, `encryptField`, `matchScoreForJob` | `apps/worker/src/aggregator.ts`; `packages/secrets/src/field.ts`; `packages/shared/src/match.ts` |\n| Types/interfaces | PascalCase; Zod schemas suffixed `Schema` | `NormalizedJob`, `SkillExtractSchema` | `packages/shared/src/schemas/index.ts` |\n| Constants | UPPER_SNAKE_CASE | `QUEUE_GITHUB`, `EMBED_DIM`, `SENSITIVITY_LEVELS` | `packages/shared/src/queues.ts`, `packages/embeddings/src/local.ts` |\n| Env vars | UPPER_SNAKE_CASE | `ENCRYPTION_KEY`, `TRUSTED_ORIGINS` | `.env.example` |\n| DB tables/columns | snake_case in `@@map`/`@map`; Prisma models PascalCase | `candidate_skill_state`, `job_reject_log` | `apps/api/prisma/schema.prisma` |\n| Migrations | descriptive snake_case name (never a date alone) | `add_evidence_source_column` | `AGENTS.md` §6; `apps/api/prisma/migrations/` |\n\n### 2) Formatting and Linting\n\n- **Formatter:** Prettier 3 configured in `.prettierrc` — `semi: true`, `singleQuote: true`, `trailingComma: \"all\"`, `printWidth: 100`, `tabWidth: 2`, `arrowParens: \"always\"`, plugin `prettier-plugin-tailwindcss`. Run with `pnpm format`.\n- **Linter:** Two layers. `apps/web` uses `next lint` (`eslint-config-next`). A **root `.eslintrc.cjs` is a reference config that is not installed and not active** until a workspace adds ESLint + `extends: [\"../../.eslintrc.cjs\"]` (`.eslintrc.cjs:10-18`).\n- **Most relevant enforced rules (root chain, when adopted):**\n  1. `no-console: error` in production code (allow `warn`/`error`; tests/scripts/seeds exempt) — observability spec.\n  2. `no-restricted-syntax` on `CallExpression[callee.property.name='chat']` — raw `provider.chat()` is forbidden outside `packages/ai`; use `chatStructured()` with a Zod schema per `plan/ai-safety.md` item 2.\n  3. `data-testid` must be a string literal, never an interpolated expression — per `plan/testing.md`.\n- **TypeScript strictness (enforced by `tsconfig.base.json`):** `strict`, `noImplicitAny`, `strictNullChecks`, `exactOptionalPropertyTypes`, `noUncheckedIndexedAccess`, `noImplicitOverride`. `any` is disallowed unless justified inline.\n- **Commands:** `pnpm lint` (turbo), `pnpm typecheck` (turbo), `pnpm format`.\n- **Pre-commit:** `lefthook.yml` runs gitleaks (best-effort), workspace typecheck, and per-workspace lint on staged TS. Binary must be on PATH; hooks degrade gracefully.\n\n### 3) Import and Module Conventions\n\n- **Cross-workspace imports** use the `@careeros/*` package name (declared `workspace:*`); there are **no path aliases** in `tsconfig.base.json`, so imports like `@/foo` do not exist.\n- **Intra-workspace imports** are relative. NestJS modules import sibling files by relative path (`./session.service`).\n- **Barrel policy:** each package exposes `src/index.ts`. `@careeros/shared` also exposes explicit subpaths — `./schemas`, `./constants`, `./redact`, `./retry`, `./net` (`packages/shared/package.json` exports). `./net` is intentionally excluded from the barrel (`packages/shared/src/index.ts:18-19`).\n- **Adapter rule:** never import an adapter from `apps/web` directly — go through a stable interface in `packages/` (`AGENTS.md` §5).\n- **Reuse before rewrite:** check `packages/ui`, `packages/shared`, shadcn, lucide, stdlib first (`AGENTS.md` §6).\n\n### 4) Error and Logging Conventions\n\n- **Error strategy by layer:** NestJS services throw typed domain errors; global `LockoutExceptionFilter` maps `LockoutError` to HTTP 429 with `Retry-After` (`apps/api/src/common/filters/lockout.filter.ts`, registered `apps/api/src/main.ts:91`). Zod schemas validate at every trust boundary via `ZodValidationPipe`. `packages/sandbox` deliberately never throws — failures return `status: 'crash'`.\n- **Logging:** all application logging goes through `pino` (JSON in prod, `pino-pretty` in dev). `console.log` is forbidden in application code (root lint rule; observability spec). Required stable context keys: `user_id`, `request_id`, `agent_role`, `prompt_id`, `prompt_hash`, `provider`, `model`, `job_id`, `duration_ms` (`plan/observability.md` §Logging).\n- **Redaction:** `packages/shared/src/redact.ts` runs before log writes and Sentry `beforeSend`; redacts `Authorization`, `Cookie`, `api_key`, `token`, `password`, `refresh_token`, `client_secret`, AWS-style keys.\n- **Retry/backoff:** all external calls go through `packages/shared/retry.ts` — exponential with full jitter, base 500ms, factor 2, max 30s, 3 attempts; `429` respects `Retry-After`; non-429 `4xx` fails fast; circuit breaker at 5 consecutive failures per (provider, endpoint) (`AGENTS.md` §6).\n- **Timezone:** all timestamps stored UTC (`timestamptz`); user timezone in `user_prefs.timezone`; render with `Intl.DateTimeFormat(user.timezone)` client-side; never format server-side (`AGENTS.md` §6).\n\n### 5) Testing Conventions\n\n- **Test file naming/location:** unit tests are colocated `foo.ts` + `foo.test.ts`; integration tests are `*.integration.test.ts`; e2e are `*.spec.ts` under `apps/web/e2e/`; LLM evals are `packages/ai/src/evals/**/*.eval.ts`; contract tests are `*.contract.test.ts`. Vitest include globs: `packages/**/src/**/*.test.ts`, `apps/**/src/**/*.test.ts`, `scripts/**/*.test.ts` (`vitest.config.ts`).\n- **Mocking strategy:** prefer real integration tests via Testcontainers over deep mocks (`CONTRIBUTING.md`); `msw` for external HTTP in unit tests only; never mock the DB in integration tests.\n- **Coverage expectation:** **no coverage percentage target.** Behavior coverage is the rule — every phase checkbox has at least one verifying test. `retries: 0` in e2e; flakes are treated as bugs.\n- **`fast-check`** for property-based tests on math-heavy paths (aggregator, priority formula, dedupe).\n- **Ponytail rule:** any non-trivial module (branch, loop, parser, money/security path) leaves one runnable check (`AGENTS.md` §6).\n\n### 6) Evidence\n\n- `AGENTS.md` §6, §7, §9, §10; `CONTRIBUTING.md`\n- `tsconfig.base.json`, `.prettierrc`, `.eslintrc.cjs`, `lefthook.yml`, `vitest.config.ts`\n- `plan/observability.md`, `plan/testing.md`, `plan/security.md`\n- `packages/shared/src/{retry,redact}.ts`, `apps/api/src/common/filters/lockout.filter.ts`\n\n## Extended Sections\n\n### Repo-specific commit / slice conventions\n\n- Branch off `main`/`master`; keep diffs small; if a change exceeds ~400 lines across many files, split into named slices (e.g. `C-P1.5a`, `F.11c`) (`CONTRIBUTING.md` §Making a change).\n- Commit subject + body describing the **why**; sign with `gitsign` when configured.\n- No em dashes in user-facing strings (memory-enforced rule, `CONTRIBUTING.md`).\n- Never commit generated files (`dist/`, `.d.ts`, `.js.map`) outside intentional artifacts.\n- Never touch `plan/_audit_*.md` (historical audit records).\n\n### Known convention violations / drift\n\n- The root ESLint chain is **not active** in any workspace that hasn't opted in (`.eslintrc.cjs:10-13`), so the three cross-cutting rules are not universally enforced today.\n- `AGENTS.md` §5 lists a `packages/storage` and `packages/github` that do not exist as packages; storage lives at `apps/api/src/common/storage.service.ts` and GitHub logic lives in `apps/api/src/modules/integrations/github/` plus `apps/worker/src/github-sync.ts`.\n- `docs/dev-setup.md` references commands (`pnpm check`, `pnpm prisma`, `pnpm erd`, `pnpm ai:probe`, `pnpm seed:dev`, `pnpm eval:ai`, `pnpm test:visual`, `pnpm fixtures:record`) that are **not** all present in the root `package.json`. Verify before trusting. See `CONCERNS.md`.\n"},{"id":"integrations","title":"External Integrations","md":"\n# External Integrations\n\nCareer OS integrates with LLM, code-host, job-source, messaging, and email systems — all behind a deny-by-default egress proxy. Datastores run on a private Docker network.\n\n## Core Sections (Required)\n\n### 1) Integration Inventory\n\n| System | Type | Purpose | Auth model | Criticality | Evidence |\n|--------|------|---------|------------|-------------|----------|\n| DeepSeek API | HTTP (OpenAI-compatible) | Primary LLM: skill extract, grading, resume/cover-letter, market brief, dossier, email classify | Per-install API key, encrypted at rest | High | `packages/ai/src/providers/deepseek.ts`, `packages/ai/src/pricing.ts` |\n| GitHub | REST (Octokit) | Repo list + sync, commit analysis for skill evidence | PAT (OAuth optional); scope-gated to `repo`/`public_repo`/`read:user`/`user:email` | High | `apps/worker/src/github-sync.ts`, `apps/api/src/modules/integrations/github/github.service.ts` |\n| GitLab | REST | Public + self-hosted repo sync (PAT) | PAT + per-user host allowlist via `assertPublicUrl` | Medium | `apps/worker/src/gitlab-sync.ts`, `packages/shared/src/net/assert-public-url.ts` |\n| Ashby / Greenhouse | ATS REST | Verified job source (highest trust tier) + ATS submission | Public boards (no auth); submission via API later | High | `packages/job-pipeline/src/adapters/`, `apps/api/src/modules/ats-submit/adapters/` |\n| Adzuna / Remotive / Arbeitnow | Aggregator REST | Aggregator job sources (tier 2) | API key (Adzuna) / none | Medium | `packages/job-pipeline/src/adapters/`; `plan/PLAN.md:20` |\n| JSearch / Serpapi (optional) | Paid partner API | LinkedIn/Indeed via legitimate partners | API key | Low (optional) | `plan/PLAN.md:20`, `docs/architecture.md` §2 |\n| Slack | Web API + Events API | Daily brief, slash commands, interactive approvals | OAuth bot token + request signing (HMAC) | Medium | `apps/api/src/modules/slack/`, `infra/slack/manifest.yml` |\n| Gmail | Google OAuth + Pub/Sub | Email alert ingest, inbox triage | OAuth `gmail.readonly` + watch/push | Medium | `apps/api/src/modules/gmail/`, `apps/worker/src/gmail-watch-renewal.worker.ts` |\n| Qdrant | Vector DB | Semantic search over verified/user content | Private network, no public auth in MVP | Medium | `packages/embeddings/src/qdrant.ts` |\n| MinIO | Object storage | Resumes, generated artifacts, agent screenshots | Root credentials + per-user signed URLs | High | `apps/api/src/common/storage.service.ts`, `infra/docker/docker-compose.yml` |\n| Squid | Forward proxy | Deny-by-default egress allowlist | Network policy | High | `infra/docker/squid/squid.conf` |\n| GlitchTip | Error tracking (Sentry-compatible) | Self-hosted error capture | DSN (planned wiring) | Low | `plan/observability.md`; `[TODO]` not in compose yet |\n| Desktop agent | WSS | Server→laptop task execution, pairing | Device-code pairing → JWT + refresh, OS keychain | Medium | `apps/desktop/src/wss-client.ts`, `apps/api/src/modules/agent/` |\n\n### 2) Data Stores\n\n| Store | Role | Access layer | Key risk | Evidence |\n|-------|------|--------------|----------|----------|\n| Postgres 16 | System of record (55 models, 38 migrations, append-only `jobs_raw`/`audit_events`/`llm_calls`) | Prisma (`apps/api`, `apps/worker`) | Two Prisma majors across workspaces; AppConfig not yet user-scoped | `apps/api/prisma/schema.prisma`, `apps/api/package.json`, `apps/worker/package.json` |\n| Redis 7 | BullMQ queues, throttler store, cache | `ioredis`, BullMQ | Queue loss if Redis down (documented degradation) | `apps/worker/src/main.ts`, `apps/api/src/modules/auth/auth.module.ts` |\n| Qdrant | Vector index (semantic content) | `@qdrant/js-client-rest` via `QdrantStore` | Embeddings are a placeholder today | `packages/embeddings/src/local.ts`, `src/qdrant.ts` |\n| MinIO | Files (resumes, PDFs, screenshots) | `minio` SDK wrapped in `StorageService` | Credentials must be strong; presign TTL 5 min | `apps/api/src/common/storage.service.ts` |\n| Local filesystem (agent) | Playwright profile, screenshots, logs | `keytar`, `fs` | Screenshot/log retention bounded to 30d/10MB/14d | `apps/desktop/src/screenshot-cleanup.ts`, `log-rotation.ts` |\n\n### 3) Secrets and Credentials Handling\n\n- **Credential sources:** environment variables for boot/master secrets (`ENCRYPTION_KEY`, `SESSION_SECRET`, datastore passwords) and AES-256-GCM-encrypted DB rows for per-integration secrets (`EncryptedSecret`, `Integration`, `ProviderConfig`). Master key must be 64-char hex or 44-char base64 (`packages/secrets/src/master-key.ts`); field encryption uses HKDF subkeys with AAD context (`packages/secrets/src/field.ts`).\n- **Hardcoding checks:** `.gitleaks.toml` + `gitleaks.yml` CI + lefthook pre-commit; `startup-check.ts` refuses known-weak values (`careeros`, `minioadmin`, `changeme`, …) and <24-byte datastore creds.\n- **Rotation lifecycle:** master `ENCRYPTION_KEY` rotation flow is described (`docs/architecture.md` §6) as decrypt-all → re-encrypt-all with fresh re-auth; not yet proven by an end-to-end test. OAuth tokens stored encrypted; GitHub PAT scope validation rejects over-broad/`admin:*` scopes (`github.service.ts:55`).\n\n### 4) Reliability and Failure Behavior\n\n- **Retry/backoff:** shared `packages/shared/retry.ts` — exponential with full jitter, base 500ms, factor 2, max 30s, 3 attempts; `429` honours `Retry-After`; non-429 `4xx` fails fast; circuit breaker at 5 consecutive failures per (provider, endpoint), 60s open, half-open probe (`AGENTS.md` §6).\n- **Timeout policy:** DeepSeek provider enforces `max_tokens` (default 4096) and SSRF-guarded fetches; health checks use 500ms per dependency with a 5s cache (`plan/observability.md`); agent navigation timeout 30s (`apps/desktop/src/task-runner.ts`).\n- **Circuit-breaker/fallback:** documented in `docs/architecture.md` §8 (DeepSeek → fallback provider → Ollama last-resort). `[TODO]` Only DeepSeek adapter exists, so the real fallback path is not implemented.\n- **Egress control:** api/worker force `HTTP(S)_PROXY=http://squid:3128` with `NO_PROXY` for datastores; Squid denies by default and allows only deepseek/openai/anthropic/openrouter/github/githubusercontent/gitlab/npmjs/github-releases; denies non-80/443, CONNECT≠443, and local IPs (`infra/docker/squid/squid.conf`).\n- **SSRF gate:** `assertPublicUrl` (DNS-resolved, redirect-revalidated, host allowlist) applies to user-supplied provider/embedding base URLs and self-hosted GitLab (`packages/shared/src/net/assert-public-url.ts`).\n\n### 5) Observability for Integrations\n\n- **Logging around external calls:** yes — `pino`, with `provider`/`model`/`prompt_id`/`prompt_hash`/`job_id`/`duration_ms` context (`plan/observability.md`).\n- **Metrics:** `prom-client` `/metrics` on api + worker, including `llm_*`, `queue_*`, `jobs_*`, `agent_*`, and auth counters. `[TODO]` worker `/metrics` wiring and GlitchTip service are not yet present in `docker-compose.yml`.\n- **Missing visibility gaps:** no tracing in MVP (interface reserved); no GlitchTip compose service; `llm_calls` middleware is only partially done (per-call caps shipped, full table/middleware deferred per `plan/ai-safety.md` item 9).\n\n### 6) Evidence\n\n- `packages/ai/src/providers/deepseek.ts`, `packages/ai/src/pricing.ts`\n- `packages/job-pipeline/src/adapters/`, `packages/email-parsers/src/senders/allowlist.ts`\n- `apps/api/src/modules/integrations/`, `apps/api/src/modules/{slack,gmail,agent}/`\n- `infra/docker/docker-compose.yml`, `infra/docker/squid/squid.conf`, `infra/slack/manifest.yml`\n- `.env.example`, `packages/secrets/src/`, `packages/shared/src/net/assert-public-url.ts`\n- `plan/security.md` items 4, 6, 8, 10; `plan/observability.md`; `docs/architecture.md` §2, §7, §8\n\n## Extended Sections\n\n### Deployment topology\n\n```mermaid\nflowchart LR\n    Internet((Internet)) -->|443| Reverse[\"Reverse proxy / TLS [TODO: infra/nginx absent]\"]\n\n    subgraph compose[\"Docker Compose: careeros\"]\n        Reverse --> Web[\"web :3000\"]\n        Web --> API[\"api :3001\"]\n        API --> Internal\n        Worker[\"worker\"] --> Internal\n        API --> Squid[\"squid :3128\"]\n        Worker --> Squid\n        Squid --> Internet\n        Internal[\"internal network\"] --> PG[(\"postgres :5432\")]\n        Internal --> Redis[(\"redis :6379\")]\n        Internal --> Qdrant[(\"qdrant :6333\")]\n        Internal --> MinIO[(\"minio :9000\")]\n    end\n\n    Agent[\"desktop agent\"] -.WSS.-> API\n```\n\n### Authentication sequence (browser session + CSRF)\n\n```mermaid\nsequenceDiagram\n    participant U as User\n    participant W as Web (Next.js)\n    participant A as API (NestJS)\n    participant S as SessionService (iron-session)\n    participant DB as Postgres\n\n    U->>W: POST sign-in (email + password)\n    W->>A: POST /auth/sign-in\n    A->>DB: load user, verify Argon2id\n    A->>DB: LoginAttempt counter (exponential lockout)\n    A->>S: seal session cookie + CSRF token\n    S-->>W: Set-Cookie __Host-careeros_session, __Host-careeros_csrf\n    W->>A: mutating request + x-csrf-token\n    A->>A: SecurityMiddleware: Sec-Fetch-Site + CSRF HMAC check\n    A->>DB: ActiveSession revocation check\n    A-->>W: 200 domain response\n    Note over A,DB: Passkey (WebAuthn) and recovery codes are alternative factors\n```\n\n### Integration contract tests\n\nEvery job-source adapter has a recorded-fixture contract test (`packages/job-pipeline/src/adapters/*.contract.test.ts`) and a weekly live revalidation workflow (`.github/workflows/adapter-contract.yml`). Adzuna is fully MSW-mocked because its upstream requires paid credentials.\n"},{"id":"testing","title":"Testing Patterns","md":"\n# Testing Patterns\n\nCareer OS uses a four-layer testing approach — Vitest unit, Testcontainers integration, Playwright e2e/a11y/visual, and a custom LLM-eval runner — plus contract, sandbox-security, and backup-restore side-cars. The stated philosophy is behavior coverage, not a coverage percentage (`plan/testing.md` §10).\n\n## Core Sections (Required)\n\n### 1) Test Stack and Commands\n\n- **Primary test framework:** Vitest 5.0.1 (`vitest.config.ts`, root `package.json`).\n- **Integration:** Testcontainers 10.28 (`packages/testing/src/index.ts` spins real Postgres/Redis/Qdrant/MinIO) + `msw` 2.15 for external HTTP in unit tests + `fast-check` 4.10 for property tests.\n- **E2E/a11y/visual:** Playwright ^1.48 (resolved 1.63) + `@axe-core/playwright` 4.10 (`apps/web/playwright.config.ts`).\n- **Commands:**\n\n```bash\npnpm test                 # vitest run (unit + integration)\npnpm test:unit            # excludes *.integration.test.ts and *.e2e.test.ts\npnpm test:integration     # vitest run integration.test\npnpm test:e2e             # @careeros/web Playwright (headless)\npnpm test:e2e            # via apps/web: pnpm test:e2e:ui for UI mode\npnpm test:a11y            # A11Y=1 pnpm --filter @careeros/web test:e2e\npnpm test:evals           # @careeros/ai evals (EVAL_MOCK=1 default); real run needs provider key\n```\n\n### 2) Test Layout\n\n- **Placement pattern:** unit tests are **co-located** next to source (`apps/api/src/modules/skills/skills.service.test.ts`); integration tests are `*.integration.test.ts`; e2e specs live in `apps/web/e2e/`; LLM evals live in `packages/ai/src/evals/<prompt>/`; contract tests are `*.contract.test.ts` in `packages/job-pipeline/src/adapters/`.\n- **Naming convention:** `foo.ts` + `foo.test.ts`; integration `foo.integration.test.ts`; e2e `*.spec.ts`; evals `*.eval.ts`; contracts `*.contract.test.ts`.\n- **Setup files:** root `vitest.setup.ts` seeds `ENCRYPTION_KEY` (64 hex), `DATABASE_URL`, `REDIS_URL`, `QDRANT_URL`; included via `vitest.config.ts` `setupFiles`. Playwright config lives only at `apps/web/playwright.config.ts`.\n- **Counts in the tree:** 192 `*.test.ts(x)`, 4 `*.integration.test.ts`, 3 `*.spec.ts` (e2e), 7 `*.contract.test.ts`, 2 `*.eval.ts` (typed sources via `git ls-files`).\n\n### 3) Test Scope Matrix\n\n| Scope | Covered? | Typical target | Notes |\n|-------|----------|----------------|-------|\n| Unit | Yes | Services, parsers, aggregators, crypto, schemas, priority/XP math | Vitest; colocated; `pnpm test:unit` |\n| Integration | Yes (partial) | Prisma queries, storage, worker jobs | Testcontainers gated behind `TESTCONTAINERS_E2E=1` + `isDockerAvailable`; 4 files today |\n| E2E | Yes (gate-dependent) | Setup wizard, connect-repo golden flow, post-setup widgets | `post-setup` and `golden-connect-repo` skip unless `E2E_STORAGE_STATE` (+ `E2E_STUB_MODE=1` for stubs) |\n| LLM evals | Yes (partial) | skill-extract, knowledge-grader, question-generator, fact-check, email-classifier | `EVAL_MOCK=1` by default; nightly workflow exists but runner registration is deferred |\n| Contract | Yes | 5 job adapters (`ashby`, `greenhouse`, `arbeitnow`, `remotive`, `adzuna` MSW) | Weekly live revalidation via `adapter-contract.yml` |\n| Sandbox security | Yes | Memory/network/fork/wallclock/fs limits | Real Docker (`packages/sandbox/src/security.test.ts`) |\n| Backup/restore | Partial | Weekly restore round-trip | Workflow exists (`.github/workflows/restore-test.yml`); round-trip body gated on seed/manifest wiring |\n| A11y | Yes | Dashboard, skills, evidence, facts, arena, settings | axe WCAG 2.1 AA; color-contrast disabled in the post-setup spec |\n| Visual regression | No `[TODO]` | Per-screen baselines | Declared in spec; `apps/web/e2e/visual/` not present |\n\n### 4) Mocking and Isolation Strategy\n\n- **Main approach:** real services via Testcontainers for integration; `msw` handlers (`defaultHandlers` for GitHub/GitLab/DeepSeek/OpenAI/Anthropic/OpenRouter) for unit external HTTP; Playwright `page.route()` stubs for e2e provider/GitHub responses.\n- **Isolation:** `resetDb` helper, per-test transactional patterns planned; e2e uses storage-state auth (`seedStorageState`) so users sign in once; `startInfra` per test file or `beforeAll`.\n- **LLM determinism:** evals run `temperature=0`; assertions are schema/property/grounding/pass-rate, never exact strings; responses cached by prompt hash (planned).\n- **Common failure mode:** integration suites silently skip when Docker is unavailable (guarded by `TESTCONTAINERS_E2E`), so CI must set the flag — `pr.yml` runs a dedicated `test-integration` job.\n\n### 5) Coverage and Quality Signals\n\n- **Coverage tool + threshold:** none. **No coverage percentage target** (`plan/testing.md` §10). Behavior coverage is the bar: each phase checkbox needs at least one verifying test.\n- **Current reported coverage:** `[TODO]` not measured/committed.\n- **Quality gates in CI:** typecheck, `pnpm audit --prod --audit-level=high`, image-pin check, prompt-version check, unit tests, integration tests, Trivy, CodeQL, gitleaks, adapter contracts (weekly), evals (nightly), restore test (weekly).\n- **Known gaps/flaky areas:** e2e gates skip without storage state + stub mode; only 4 integration files; no visual baselines; embedder is a placeholder so semantic tests assert shape, not quality.\n\n### 6) Evidence\n\n- `vitest.config.ts`, `vitest.setup.ts`, `apps/web/playwright.config.ts`, `apps/web/e2e/*.spec.ts`\n- `packages/testing/src/index.ts` (Testcontainers, MSW handlers, axe, arbitraries, migration-safety)\n- `.github/workflows/pr.yml`, `nightly-evals.yml`, `adapter-contract.yml`, `restore-test.yml`\n- `plan/testing.md`, `CONTRIBUTING.md` §Testing conventions\n- `docs/codebase/.codebase-scan.txt` (CI/CD PIPELINES, GIT RECENT COMMITS)\n\n## Extended Sections\n\n### CI pipeline (from `.github/workflows/`)\n\n| Workflow | Trigger | Gates |\n|----------|---------|-------|\n| `pr.yml` | PR + push main/master | vitest, `pnpm -r typecheck`, `pnpm audit`, Testcontainers integration, image pins, prompt versions |\n| `trivy.yml` | PR + push + Mon 06:00 | HIGH/CRITICAL image CVEs → SARIF |\n| `codeql.yml` | PR + push + Mon 05:00 | JS/TS security-extended SAST |\n| `gitleaks.yml` | PR + push + Mon 07:00 | secret scanning |\n| `nightly-evals.yml` | daily 02:00 | LLM eval suite; drift issue on >5% regression |\n| `adapter-contract.yml` | Mon 06:00 + dispatch | live adapter contract revalidation |\n| `restore-test.yml` | Mon 03:00 + dispatch | backup restore parity |\n| `tag-release.yml` | `v*` tags | build/push images, cosign sign, Syft SBOM, SHA256SUMS |\n| `desktop-release.yml` | `desktop-v*` tags | mac/win/linux installer builds |\n\n### E2E golden-flow coverage by phase (`plan/testing.md` §3)\n\nP0 wizard+sign-in (`pre-setup.spec.ts`), P1 connect-repo (`golden-connect-repo.spec.ts`), plus the wider post-setup widget/a11y spec. P2-P6 golden flows are specified but the current e2e tree only contains the three P0/P1 specs — the rest are `[TODO]`.\n"},{"id":"concerns","title":"Codebase Concerns","md":"\n# Codebase Concerns\n\nPrioritised from the scan output, config, and source inspection. Severities are relative to the product's stated threat model (`plan/security.md`, `plan/ai-safety.md`). `[TODO]` marks unknowns; `[ASK USER]` marks intent gaps.\n\n## Core Sections (Required)\n\n### 1) Top Risks (Prioritized)\n\n| Severity | Concern | Evidence | Impact | Suggested action |\n|----------|---------|----------|--------|------------------|\n| High | **Embeddings are a non-semantic placeholder** while product/UI promise semantic search | `packages/embeddings/src/local.ts` (SHA-256 → 384-d vector); `AGENTS.md` §4, `plan/PLAN.md:11` promise `bge-small-en` | Qdrant \"semantic\" search returns effectively hash-similarity results; match/evidence UX degrades | Ship the real local embedder (or provider adapter) and add a quality eval; document the limitation until then |\n| High | **Intent docs describe infrastructure that does not exist**: nginx/TLS, certbot, GlitchTip, whisper.cpp, embedding service, scheduler, backup sidecar, `docker-compose.host-dev.yml`, `scripts/dev-host.sh`, `scripts/seed-test.ts` | `docs/architecture.md` §2/§7; `docs/dev-setup.md:24,46`; missing-path check | Operators following docs hit missing services/commands; \"deploy on a VPS\" is not yet real | Reconcile docs with the compose file, or implement the missing services; mark deferred ones clearly |\n| High | **`packages/ui/src/index.ts` re-exports `./motion` but `packages/ui/src/motion.ts` does not exist** | `packages/ui/src/index.ts`; missing-path check | Any consumer importing `@careeros/ui` can fail to build/typecheck | Add the file or remove the re-export |\n| High | **Two Prisma major versions across workspaces** (`@prisma/client ^6.19.3` in api, `^5.20.0` in worker) | `apps/api/package.json`, `apps/worker/package.json` | Generated client/schema drift; migrations and queries can diverge silently | Pin one Prisma version workspace-wide |\n| Medium | **No global session guard; auth is enforced per-controller via `SessionService.requireUserId`** | `apps/api/src/modules/auth/auth.module.ts`, 60+ call sites; only `ThrottlerGuard` is global | One missed call = unauthenticated data access; multi-tenant readiness is weaker than schema suggests | Add a global auth guard (allowlist public routes) before multi-user lands |\n| Medium | **Root ESLint chain is inactive; it is not installed and no workspace extends it** | `.eslintrc.cjs:10-18` | `no-console`, raw-`chat()` and literal-`data-testid` rules are documentation, not enforcement | Opt workspaces in or move rules to a real runner |\n| Medium | **Missing direct-deps no-analytics test**: the web guard references `apps/web/src/no-analytics-sdk.test.ts`, which is not in the tree | `scripts/__tests__/no-analytics-in-web.test.ts`; `plan/PENDING_2026-10-02.md` | Zero-telemetry guarantee is only partially verified | Add the missing test |\n| Medium | **`@nestjs/swagger` absent** though `AGENTS.md` §6 mandates it and `docs/dev-setup.md:46` advertises `/api/docs` | no `@nestjs/swagger` in any `package.json`; no `SwaggerModule` usage | API docs URL 404s; agent/developer contract docs missing | Add Swagger decorators + serve OpenAPI, or remove the claim |\n| Medium | **Docstring/comment drift** in `pnpm-workspace.yaml` says \"Do NOT re-add `pnpm.overrides` to root package.json\", but `package.json:46-51` contains `pnpm.overrides` | `pnpm-workspace.yaml:9-12` vs `package.json:46-51` | Confusing guidance; pnpm 9 ignores root overrides and warns | Delete the override block or the stale comment, and note the correct location |\n| Low | **`docs/dev-setup.md` references many non-existent scripts** (`pnpm check`, `pnpm prisma`, `pnpm erd`, `pnpm ai:probe`, `pnpm seed:dev`, `pnpm eval:ai`, `pnpm test:visual`, `pnpm fixtures:record`) | root `package.json` scripts; `docs/dev-setup.md` §Common tasks | New contributors hit \"missing script\" | Add the scripts or correct the table |\n\n### 2) Technical Debt\n\n| Debt item | Why it exists | Where | Risk if ignored | Suggested fix |\n|-----------|---------------|-------|-----------------|---------------|\n| Only one LLM adapter (DeepSeek) despite provider-agnostic promise | Provider abstraction built first, adapters deferred | `packages/ai/src/providers/` (only `deepseek.ts`) | Provider-agnosticism is theoretical; no fallback | Add OpenAI/Anthropic/Ollama adapters + evals before relying on fallback |\n| `AppConfig` global keys not user-scoped | Single-user MVP | `apps/api/src/modules/usage/usage.controller.ts:96,116,137`; `TODO(multitenant)` markers | Multi-user flip changes another user's config | Scope by `userId` before multi-user |\n| Interactive-transaction encryption gap | Prisma legacy `$use` middleware doesn't run in `tx.*` | `apps/api/src/prisma/prisma.service.ts:14-22` | Callers writing via `tx` must manually encrypt — easy to forget | Move to `$extends` or enforce via a repository layer |\n| Sensitivity gate + fact-check only partial | Shipped incrementally | `packages/ai/src/sensitivity-gate.ts`; `apps/api/src/modules/resume-variants/` `runFactCheck`; `plan/ai-safety.md` items 6, 8 | Employer-confidential leakage / unbacked claims on un-wired surfaces | Extract shared fact-check helper; wire cover-letter + outreach |\n| `llm_calls` audit middleware + tokenizer incomplete | Per-call caps shipped, full accounting deferred | `plan/ai-safety.md` item 9; `packages/ai/src/providers/deepseek.ts` | Cost/audit visibility incomplete | Finish middleware, pricing rows, budget enforcement |\n| N+1 in `JobsService.sync` + match-score pagination pool ceiling | Speed over query shape during rollout | `plan/PLAN.md:69` | Slow job lists as data grows | Batch/paginate; add query-count regression test |\n| Phase slices deferred | Time-boxed waves | `plan/DEFERRED.md`; `plan/PLAN.md` status board | Documented flows are partial | Track each deferred slice to a deliverable |\n| No `latest` tag / upgrade path untested | Pre-release | `plan/release-process.md`; `CHANGELOG.md` is `[Unreleased]` | First tagged upgrade may surprise operators | Test `compose pull && up` on previous data before v0.1.0 |\n\n### 3) Security Concerns\n\n| Risk | OWASP category (if applicable) | Evidence | Current mitigation | Gap |\n|------|--------------------------------|----------|--------------------|-----|\n| Per-controller auth instead of global guard | A01 Broken Access Control | `apps/api/src/modules/auth/auth.module.ts` | `requireUserId` call sites + `RequireAdminGuard` | No fail-closed global guard |\n| Prompt injection via ingested content | A03 Injection | `packages/ai/src/wrap.ts`, `injection-scan.ts`; wired in jobs/market-brief/resume/dossier | `wrapUntrusted` + regex/heuristic scan + audit | LLM classifier pass and dedicated `llm_injection_log` table deferred; email path pending |\n| Secrets could reach an external LLM | A02/A04 | `packages/ai/src/sensitivity-gate.ts`; `packages/shared/src/redact.ts` | Sensitivity gate scaffold + redaction pass | Gate is partial; employer-confidential default path needs end-to-end test |\n| SSRF via user-supplied URLs | A10 SSRF | `packages/shared/src/net/assert-public-url.ts`; `PublicUrlSchema` | DNS-resolved, redirect-revalidated, host allowlist; tests present | Keep coverage as new integrations (self-hosted GitLab) land |\n| Upload spoofing | A04 Insecure Design | `apps/api/src/common/storage.service.ts:30-73` | Magic-byte MIME check (PDF/DOCX), size limit, per-user keys, 5-min presign | DOCX check is shallow (documented upgrade path) |\n| PII at rest partly unencrypted | A02 Cryptographic Failures | `packages/secrets/src/field.ts`; `plan/security.md` item 5 | Field encryption live for `resume_facts.content`, `llm_hallucination_log.snippet` | `career_goals`, `evidence`, `applications`, `outreach_messages` still to add |\n| Prod TLS + Postgres SSL unchecked | A02/A05 | `plan/security.md` item 1 (unchecked boxes) | startup-check has HTTP/dev guards | Production HTTPS + `sslmode=require` enforcement not implemented |\n| Master-key rotation flow unproven | A02 | `docs/architecture.md` §6 | Documented decrypt/re-encrypt flow, fresh re-auth required | No end-to-end test |\n| Desktop agent trust chain = user's browser session | N/A | `plan/security.md` threat model | Pairing + JWT + keychain + pacing + kill-switch | Accepted risk; unsigned installers at MVP |\n\n### 4) Performance and Scaling Concerns\n\n| Concern | Evidence | Current symptom | Scaling risk | Suggested improvement |\n|---------|----------|-----------------|-------------|-----------------------|\n| N+1 in job sync | `plan/PLAN.md:69` | Not yet measured at scale | Slow ingestion as sources grow | Batch writes; query-count test |\n| Match-score pagination pool ceiling | `plan/PLAN.md:69` | Not yet measured | Degraded match feed with many jobs | Keyset pagination |\n| Placeholder embeddings | `packages/embeddings/src/local.ts` | Hash-similar results | Poor search precision regardless of scale | Real embedder + re-index |\n| Global in-process LLM concurrency limit `p-limit(2)` per user | `apps/api/src/modules/usage/usage.service.ts:76-110` | Queueing under burst | Multi-replica needs shared limit | Move to Redis-backed limiter |\n| Qdrant/Redis/MinIO single-instance | `infra/docker/docker-compose.yml` | N/A single-user | No HA; acceptable for self-host | Document as operator concern |\n\n### 5) Fragile/High-Churn Areas\n\n| Area | Why fragile | Churn signal | Safe change strategy |\n|------|-------------|-------------|----------------------|\n| `apps/api/src/app.module.ts` | Every new module touches it; ordering matters | 18 commits / 90d (scan) | Add modules surgically; run boot test |\n| `apps/api/prisma/schema.prisma` | 55 models; migrations must be forward-safe | 17 commits / 90d | Named, idempotent, additive migrations; review |\n| `packages/ai/src/index.ts` + prompt registry | Prompt/provider contract churn | 13 commits / 90d | Bump prompt versions; run evals |\n| `pnpm-lock.yaml` | Dependency churn across 17 workspaces | 21 commits / 90d | Renovate + `pnpm install --frozen-lockfile` |\n| `apps/api/package.json` | Repeated dependency adds | 14 commits / 90d | Keep versions aligned with worker |\n| `infra/docker/docker-compose.yml` | Hardening/pins change frequently | 8 commits / 90d | Keep image-pin check green |\n| `packages/shared/src/index.ts`, `packages/job-pipeline/src/index.ts` | Barrel exports are a wide blast radius | 6-7 commits / 90d | Add subpath exports rather than widening barrels |\n| Plans themselves (`plan/COMPLETION_PLAN.md`, `HANDOFF.md`, `DEFERRED.md`) | Actively rewritten | 17/14/13 commits / 90d | Treat as source, but verify against code |\n\n### 6) `[ASK USER]` Questions\n\n1. **[ASK USER]** Is Career OS going OSS-public or staying personal-only? This blocks the LICENSE, `SECURITY.md` PGP key, install-doc polish, and several release blockers (`CONTRIBUTING.md`, `SECURITY.md`, `plan/PLAN.md:104-107`).\n2. **[ASK USER]** What is the production TLS/reverse-proxy story — nginx + Let's Encrypt, Caddy, or a managed proxy? `infra/nginx/` does not exist yet (`docs/architecture.md` §2/§7).\n3. **[ASK USER]** Which embedding model should ship as the real default — local `bge-small-en`, a hosted provider, or both? (`plan/PLAN.md:11` vs `packages/embeddings/src/local.ts`).\n4. **[ASK USER]** Should the workspace converge on one Prisma major and one React major (resume-render is React 18, web/ui are React 19)? (`apps/api/package.json`, `apps/worker/package.json`, `packages/resume-render/package.json`).\n5. **[ASK USER]** When should multi-user become a supported deployment (and therefore force `AppConfig` scoping + a global auth guard)? (`TODO(multitenant)` markers).\n6. **[ASK USER]** Should the root ESLint chain be activated everywhere, given `apps/web` currently owns its own config? (`.eslintrc.cj
