<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Career OS · Engineering Knowledge Base</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #111418;
    --ink-2: #33383F;
    --muted: #6B7280;
    --faint: #9CA3AF;
    --hair: #E5E7EB;
    --hair-strong: #D1D5DB;
    --accent: #2B4A8B;
    --wash: #F9FAFB;
    --paper: #FFFFFF;
    --page-bg: #F3F4F6;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html { background: var(--page-bg); }
  body {
    margin: 0; background: var(--page-bg); color: var(--ink-2);
    font-family: var(--font); font-weight: 400; line-height: 1.6;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }

  /* ---- page shells ---- */
  .pagedjs_pages { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 24px 0; }
  .pagedjs_page {
    background: var(--paper); border: 1px solid var(--hair);
    box-shadow: 0 6px 24px rgba(17,20,24,.06);
    width: 210mm; height: 297mm; position: relative; overflow: hidden;
  }
  .pagedjs_pagebox { color: var(--muted); font-family: var(--font); font-size: 8pt; }
  .pagedjs_margin-bottom-left { justify-content: flex-start; }
  .pagedjs_margin-bottom-right { justify-content: flex-end; }

  /* ---- typography ---- */
  h1, h2, h3, h4 { color: var(--ink); font-weight: 600; line-height: 1.28; letter-spacing: -.01em; break-after: avoid; }
  h1 { font-size: 19pt; margin: 0 0 8pt; }
  h2 { font-size: 13pt; margin: 16pt 0 6pt; padding-bottom: 4pt; border-bottom: 1px solid var(--hair); }
  h2.sec-title { font-size: 15.5pt; margin-top: 0; padding-bottom: 6pt; border-bottom: 1px solid var(--hair-strong); }
  h3 { font-size: 11pt; margin: 12pt 0 4pt; color: var(--ink-2); }
  p, li, td, th { font-size: 10.5pt; }
  p { margin: 6pt 0; max-width: 72ch; color: var(--ink-2); orphans: 3; widows: 3; }
  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--hair-strong); }
  strong { font-weight: 600; color: var(--ink); }
  ul, ol { padding-left: 16pt; margin: 6pt 0; }
  li { margin: 2pt 0; }
  hr { border: none; border-top: 1px solid var(--hair); margin: 16pt 0; }

  code { font-family: var(--mono); font-size: 8.8pt; background: var(--wash); border: 1px solid var(--hair); padding: .05em .3em; border-radius: 3px; }
  pre { background: #FCFCFD; border: 1px solid var(--hair); border-radius: 5px; padding: 10pt 12pt; overflow-x: auto; break-inside: avoid; margin: 10pt 0; }
  pre code { background: none; border: none; padding: 0; font-size: 8.4pt; line-height: 1.55; }
  blockquote { margin: 10pt 0; padding: 1pt 0 1pt 12pt; border-left: 2px solid var(--hair-strong); color: var(--muted); }

  table { border-collapse: collapse; width: 100%; margin: 8pt 0; font-size: 9.5pt; table-layout: auto; font-variant-numeric: tabular-nums; }
  thead { display: table-header-group; }
  tr { break-inside: avoid; }
  th { text-align: left; font-weight: 600; padding: 5.5pt 8pt; color: var(--ink); background: var(--wash); border-top: 1px solid var(--hair-strong); border-bottom: 1px solid var(--hair-strong); font-size: 8.6pt; letter-spacing: .02em; text-transform: uppercase; overflow-wrap: break-word; }
  td { padding: 5.5pt 8pt; border-bottom: 1px solid var(--hair); vertical-align: top; color: var(--ink-2); overflow-wrap: break-word; }
  td code, th code { white-space: normal; overflow-wrap: anywhere; }
  tbody tr:last-child td { border-bottom: 1px solid var(--hair-strong); }

  .mermaid { break-inside: avoid; margin: 12pt 0; text-align: center; }
  .mermaid svg { max-width: 100%; height: auto; }
  figure.diagram { break-inside: avoid; margin: 12pt 0; }

  /* ---- cover ---- */
  .cover { height: 100%; padding: 28mm 22mm 22mm; display: flex; flex-direction: column; justify-content: space-between; background: var(--paper); break-after: page; }
  .cover-top { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--hair); padding-bottom: 12pt; }
  .cover-brand { display: flex; align-items: center; gap: 10pt; }
  .cover-logo { width: 34pt; height: 34pt; object-fit: contain; }
  .cover-brand-name { font-size: 10pt; font-weight: 600; letter-spacing: .02em; color: var(--ink); }
  .cover-audience { font-size: 8pt; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .cover-main { margin-top: 10mm; }
  .cover-eyebrow { font-size: 8.5pt; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); margin-bottom: 12pt; }
  .cover-title { font-size: 36pt; font-weight: 700; line-height: 1.08; letter-spacing: -.03em; color: var(--ink); margin: 0 0 14pt; }
  .cover-rule { width: 46mm; height: 2px; background: var(--ink); margin: 0 0 14pt; }
  .cover-sub { font-size: 12pt; color: var(--muted); max-width: 108mm; line-height: 1.6; }
  .cover-foot { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12pt; border-top: 1px solid var(--hair); padding-top: 12pt; }
  .cover-foot .k { font-size: 8pt; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .cover-foot .v { font-size: 11pt; color: var(--ink); margin-top: 3pt; }

  /* ---- TOC ---- */
  .toc { padding-top: 2mm; padding-bottom: 4pt; }
  .toc h1 { font-size: 18pt; margin-bottom: 14pt; }
  .toc ol { list-style: none; padding: 0; margin: 0; }
  .toc li { margin: 0; }
  .toc a { display: flex; align-items: baseline; gap: 8pt; border: none; padding: 6pt 0; color: var(--ink-2); border-bottom: 1px solid var(--hair); }
  .toc a .t { font-size: 10.5pt; font-weight: 500; color: var(--ink); }
  .toc a .dots { flex: 1; }
  .toc a .pg { font-size: 10pt; font-weight: 600; color: var(--accent); min-width: 16pt; text-align: right; }
  .toc .toc-h3 { display: none; }

  /* ---- sections ---- */
  section.doc { break-before: auto; }
  .stack-grid + section.doc, .toc + section.doc { break-before: page; }
  section.doc > h1:first-child { padding-bottom: 6pt; border-bottom: 1px solid var(--hair-strong); }
  section.doc + section.doc { border-top: 1px solid var(--hair-strong); margin-top: 22pt; padding-top: 18pt; }

  /* ---- stack grid ---- */
  .stack-grid { break-inside: avoid; margin-top: 28pt; padding-top: 20pt; border-top: 1px solid var(--hair-strong); }
  .stack-list { list-style: none; padding: 0; margin: 12pt 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 9pt; }
  .stack-item { display: flex; align-items: center; gap: 9pt; border: 1px solid var(--hair); border-radius: 6px; padding: 8pt 10pt; break-inside: avoid; background: var(--paper); }
  .stack-icon { width: 20pt; height: 20pt; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 20pt; }
  .stack-icon img { width: 20pt; height: 20pt; object-fit: contain; }
  .stack-fallback { width: 20pt; height: 20pt; border-radius: 4px; background: var(--ink); color: #fff; font-size: 8pt; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; }
  .stack-meta { display: flex; flex-direction: column; }
  .stack-name { font-weight: 600; font-size: 10pt; color: var(--ink); }
  .stack-role { font-size: 8pt; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

  /* public doc: larger, airier */
  .audience-public p, .audience-public li, .audience-public td { font-size: 11.5pt; }
  .audience-public p { max-width: 74ch; line-height: 1.66; }
  .audience-public h1 { font-size: 26pt; }
  .audience-public h2.sec-title { font-size: 19pt; }

  .nojs { padding: 24px; font-family: var(--font); }

  @page :first {
    @bottom-left { content: none; }
    @bottom-right { content: none; }
  }

  @page {
    size: A4;
    margin: 20mm 18mm 18mm;
    @bottom-left {
      content: "Career OS · Engineering Knowledge Base";
      font-family: "Inter", sans-serif; font-size: 8pt; color: #9CA3AF;
    }
    @bottom-right {
      content: "Page " counter(page) " of " counter(pages);
      font-family: "Inter", sans-serif; font-size: 8pt; color: #9CA3AF;
    }
  }

  @media print {
    html, body { background: #fff; }
    .pagedjs_pages { gap: 0; padding: 0; }
    .pagedjs_page { box-shadow: none; border: none; }
  }
</style>
</head>

<script id="kb-data" type="application/json">{"mode":"technical","repo":"Career OS","title":"Career OS","subtitle":"Architecture, stack, conventions, integrations and risks. An evidence-based reference for engineers.","audience":"For engineering teams","date":"2026-10-03","version":"43db5b9","docs":[{"id":"readme","title":"Career OS — Knowledge Base","md":"\n# Career OS — Knowledge Base\n\nAn evidence-based reference for engineers working on **Career OS** — a self-hosted, provider-agnostic Personal AI Career Operating System. Built from the repository at revision `d31dead` (2026-10-03), after Waves A–C (desktop UI, Expo mobile, OSS-AGPL, embeddings/providers, deploy/nginx, AI-safety logs, key rotation).\n\n## Executive summary\n\nCareer OS is a single-user-by-default, multi-user-ready **pnpm + Turborepo monorepo** (~112k lines of TypeScript across 5 apps and 15 packages), licensed **AGPL-3.0-or-later**. A Next.js 16 web app, a NestJS 10 API, an Expo (React Native) mobile companion, and an Electron + Playwright desktop agent sit in front of **Postgres (system of record), Redis (queues), Qdrant (vectors), and MinIO (files)**; BullMQ workers do asynchronous ingestion/sync; nginx is the single public TLS entrypoint. The AI layer is a `packages/ai` provider abstraction with real DeepSeek, OpenAI/OpenRouter-compatible, and local Ollama adapters plus a primary→backup→Ollama fallback chain; every LLM call passes a sensitivity gate, produces schema-validated output, is grounded in the Postgres evidence graph, and is audited to `llm_calls`, with a dedicated `llm_injection_log`. Embeddings now use a real local `bge-small-en` model (`@xenova/transformers`) with a deterministic offline fallback. Job discovery includes the `@careeros/firecrawl` client and Workday/Lever/SmartRecruiters/Workable/iCIMS/SuccessFactors adapters for public career sites and ATS boards.\n\nThe product's non-negotiable invariants (`AGENTS.md` §3): evidence (not LLM claims) is truth; generated content may only rephrase verified facts; every outbound action needs approval + audit; server-side scraping of LinkedIn/Indeed/Naukri/Glassdoor is prohibited; every job flows through one ingestion pipeline; and data carries sensitivity labels.\n\n**Maturity:** alpha, pre-v0.1. Every phase P0-P6 is \"In progress\" with named shipped slices and named deferrals (`plan/PLAN.md`). The web surface is owned by a parallel workstream (see `CHANGELOG.md` Notes). Treat unchecked items in `plan/*.md` as not-done.\n\n## Documents\n\n| Document | What it answers |\n|----------|-----------------|\n| [STACK.md](STACK.md) | Languages, runtimes, frameworks, dependency reality checks, commands, env |\n| [STRUCTURE.md](STRUCTURE.md) | Directory map, entry points, module boundaries, naming rules, workspace graph |\n| [ARCHITECTURE.md](ARCHITECTURE.md) | Style, system flow, layer responsibilities, patterns, risks, diagrams |\n| [CONVENTIONS.md](CONVENTIONS.md) | Naming, formatting/lint, imports, errors/logging, testing rules |\n| [INTEGRATIONS.md](INTEGRATIONS.md) | External APIs, data stores, secrets, reliability, observability, deployment |\n| [TESTING.md](TESTING.md) | Frameworks, layout, scope matrix, mocking, CI gates, gaps |\n| [CONCERNS.md](CONCERNS.md) | Prioritised risks, debt, security, performance, churn, and `[ASK USER]` items |\n| [PUBLIC_OVERVIEW.md](PUBLIC_OVERVIEW.md) | Plain-language product overview for a general audience |\n\n## How to use this knowledge base\n\n- **New to the repo?** Read this page, then `ARCHITECTURE.md`, then `STRUCTURE.md`. Keep `AGENTS.md` and `plan/PLAN.md` open beside it — they are the team's own durable spec and status board.\n- **About to change code?** Check `CONVENTIONS.md` and `TESTING.md` first; both cite the binding source files.\n- **Touching integrations or secrets?** Read `INTEGRATIONS.md` §3-4 and the matching item in `plan/security.md`.\n- **Triage or planning?** Start from `CONCERNS.md`; its top-risks table and `[ASK USER]` list are the shortest path to open questions.\n- **Evidence convention:** every non-trivial claim cites a committed file path. `[TODO]` = not determinable from the repo; `[ASK USER]` = requires team intent.\n\n## System overview\n\n```mermaid\nflowchart LR\n    subgraph Users\n        U[\"User / browser\"]\n        D[\"Desktop agent\"]\n        M[\"Mobile app (Expo)\"]\n    end\n    subgraph Core[\"Career OS (self-hosted)\"]\n        N[\"nginx (TLS)\"]\n        W[\"Next.js web\"]\n        A[\"NestJS api\"]\n        K[\"BullMQ workers\"]\n        subgraph Data[\"Postgres · Redis · Qdrant · MinIO\"]\n            P[(\"System of record\")]\n        end\n        S[\"Squid egress allowlist\"]\n    end\n    subgraph Ext[\"Configured externals\"]\n        L[\"DeepSeek / OpenAI / Ollama\"]\n        G[\"GitHub / GitLab\"]\n        J[\"ATS + aggregators\"]\n        Msg[\"Slack / Gmail\"]\n    end\n    U --> N\n    N --> W --> A --> P\n    N --> A\n    M --> N\n    A --> K --> P\n    D <-.WSS.-> A\n    A --> S\n    K --> S\n    S --> L\n    S --> G\n    S --> J\n    A -.-> Msg\n```\n\n## Intent vs reality (divergences)\n\nThe team's docs are unusually explicit, but several describe the *target*, not the tree. These are the material divergences found while building this KB (full detail in `CONCERNS.md`).\n\n| Area | Docs say | Reality | Status | Evidence |\n|------|----------|---------|--------|----------|\n| Frontend framework | Next.js 15 | Next.js **16.3.6** pinned + React 19 | Open (docs lag) | `AGENTS.md` §4 vs `apps/web/package.json` |\n| Embeddings | Local `bge-small-en` via `@xenova/transformers` | Implemented: local `Xenova/bge-small-en-v1.5` default + deterministic offline fallback + external seam | **Resolved (Wave B)** | `packages/embeddings/src/provider.ts`, `apps/worker/src/embedding-job.ts` |\n| LLM providers | Provider-agnostic with fallback | DeepSeek + OpenAI/OpenRouter-compatible + Ollama adapters, primary→backup→Ollama chain | **Resolved (Wave C)** | `packages/ai/src/providers/ ain | all `uses:` pinned to full commit SHAs | **Resolved (T9)** | `.github/workflows/*.yml` |\n| Root lint rules | `no-console`, no raw `chat()`, literal `data-testid` enforced | `apps/web` runs eslint 9 (incl. `set-state-in-effect: error`); root chain still dormant and api has no flat config | Partial | `.eslintrc.cjs:10-18`, `apps/web/eslint.config.mjs` |\n| Web fetch-on-mount | Panels fetch in `useEffect`+`setState` | `useApi` data hook backs 19 panels; warning rule restored to error | **Resolved (T29)** | `apps/web/src/lib/use-api.ts` |\n| UI re-export | `@careeros/ui` barrel exports motion helpers | `packages/ui/src/motion.ts` exists | **Resolved (T1)** | `packages/ui/src/motion.ts`, `packages/ui/src/index.ts` |\n| Dev commands | `pnpm check`, `pnpm seed:dev`, `pnpm erd`, `pnpm eval:ai`, `pnpm test:visual`, `pnpm fixtures:record`, `pnpm ai:probe` | Reconciled: `dev:host`/`seed:test`/`docker:infra` wired; unwired scripts marked \"planned\" | **Resolved (T3/D2)** | `docs/dev-setup.md` vs `package.json` |\n| Analytics guard | Web ships a no-analytics test | `apps/web/src/no-analytics-sdk.test.ts` exists | **Resolved (T4)** | `apps/web/src/no-analytics-sdk.test.ts` |\n\n## Coverage and confidence\n\n- **Built from:** committed source at `d31dead` (waves 1–14 cleanup + Waves A–C), config, the team's own specs, and a full file scan (`docs/codebase/.codebase-scan.txt`).\n- **Not verified by running:** the stack was **not** booted during this KB refresh (no `.env`, no Docker run). Behavioural claims come from the team's committed tests, the cleanup verification log (`plan/CLEANUP_TASKS.md`), and docs, cited inline. In particular, the live Docker egress smoke and a full-stack master-key rotation rehearsal have not been executed.\n- **Diagrams:** Mermaid diagrams (system overview here, component + data-flow in `ARCHITECTURE.md`, workspace graph in `STRUCTURE.md`, deployment + auth sequence in `INTEGRATIONS.md`). Validate rendering before print.\n\n## Open questions\n\nSee the numbered `[ASK USER]` list at the end of [CONCERNS.md](CONCERNS.md) — the most consequential are workspace React-version convergence, the multi-user timeline, the backup destination, and whether mobile push/offline is in scope.\n"},{"id":"stack","title":"Technology Stack","md":"\n# Technology Stack\n\nCareer OS is a self-hosted, provider-agnostic Personal AI Career Operating System. It is a pnpm/Turborepo monorepo written almost entirely in TypeScript, with a Next.js web app, a NestJS API, BullMQ workers, an Electron desktop agent, and an Expo (React Native) mobile companion. It is licensed **AGPL-3.0-or-later** (`LICENSE`, root `package.json:5`).\n\n> Evidence for every row below is a committed manifest, config, or source file. `[TODO]` marks unknowable facts; `[ASK USER]` marks intent-dependent ones.\n\n## Core Sections (Required)\n\n### 1) Runtime Summary\n\n| Area | Value | Evidence |\n|------|-------|----------|\n| Primary language | TypeScript (`.ts`/`.tsx`; ~895 source files — 757 `.ts` + 138 `.tsx`; ~112k LOC) | `docs/codebase/.codebase-scan.txt` (CODE METRICS); `tsconfig.base.json` |\n| Runtime + version | Node.js >= 20 (see `.nvmrc`; root `engines.node`) | `package.json:6-8`, `.nvmrc` |\n| Package manager | pnpm 9.12.0 (workspaces) | `package.json:5`, `pnpm-workspace.yaml:1-3` |\n| Module/build system | Turborepo 2 (`turbo run build/typecheck/lint`), per-workspace `tsc`/`nest build`/`next build`/`expo` | `turbo.json:1-21`, `package.json:11-14` |\n| Module format | ESM-ish `module: ESNext` + `moduleResolution: Bundler`; API compiled by Nest CLI, worker run with `tsx`, mobile via Expo/Metro | `tsconfig.base.json:4-5`, `apps/worker/package.json:6` |\n| Workspace layout | `apps/*` + `packages/*` (5 apps, 15 packages) | `pnpm-workspace.yaml:1-3`; `packages/*/package.json` |\n\n### 2) Production Frameworks and Dependencies\n\n| Dependency | Version | Role in system | Evidence |\n|------------|---------|----------------|----------|\n| Next.js | 16.3.6 (pinned) | Web app, App Router, middleware | `apps/web/package.json` |\n| React | ^19.3.0 | Web + UI component runtime | `apps/web/package.json` |\n| NestJS (`@nestjs/common`/`core`) | ^10.4.4 | HTTP API, modules, DI, WebSockets gateway | `apps/api/package.json` |\n| `@nestjs/platform-express` | ^10.4.22 | Express HTTP adapter (raw body for Slack HMAC) | `apps/api/package.json`, `apps/api/src/main.ts:88` |\n| `@nestjs/platform-socket.io` + `socket.io` | ^10.4.4 / ^4.8.1 | Desktop-agent WSS pairing/task channel | `apps/api/package.json`, `apps/api/src/modules/agent/agent.gateway.ts` |\n| Prisma + `@prisma/client` | ^6.19.3 (**aligned** across api, worker, and `@careeros/aggregator`) | ORM + migrations (56 models, 0 enums, 40 migrations) | `apps/api/package.json`, `apps/worker/package.json`, `packages/aggregator/package.json`, `apps/api/prisma/schema.prisma` |\n| `@nestjs/swagger` + `@asteasolutions/zod-to-openapi` | ^7.4.2 / ^7.3.4 | OpenAPI JSON at `/api/openapi.json` + Swagger UI at `/api/docs`, generated from the shared Zod schemas | `apps/api/package.json`, `apps/api/src/main.ts:125-142`, `apps/api/src/openapi/openapi.ts` |\n| `undici` | ^6 | Egress enforcement: installs an `EnvHttpProxyAgent` as the process-global `fetch` dispatcher at api/worker boot so Squid actually gates Node global `fetch` | `packages/shared/package.json`, `packages/shared/src/net/proxy-dispatcher.ts`, `apps/api/src/main.ts:97`, `apps/worker/src/main.ts:120` |\n| PostgreSQL | 16-alpine (digest-pinned) | System of record | `infra/docker/docker-compose.yml` |\n| Redis + BullMQ | redis:7-alpine / `bullmq ^5.13.0` | Queues, cache, rate-limit store | `infra/docker/docker-compose.yml`, `apps/worker/package.json` |\n| Qdrant client | `@qdrant/js-client-rest ^1.12.0` | Vector store for semantic content | `packages/embeddings/package.json` |\n| MinIO client | `minio ^8.0.2` | Object storage (resumes, artifacts, screenshots) | `apps/api/package.json`, `apps/api/src/common/storage.service.ts` |\n| `argon2` | ^0.41.1 | Argon2id password hashing | `packages/auth/package.json:13` |\n| `iron-session` | ^8.0.3 | Sealed session cookie (`__Host-*`, AES-256-GCM) | `apps/api/package.json`, `packages/auth/src/session.ts` |\n| `@simplewebauthn/server` | ^11 | Passkey / WebAuthn MFA | `apps/api/package.json` |\n| `helmet` | ^8.0.0 | Security headers + CSP nonce | `apps/api/src/main.ts:5,13-80` |\n| `@nestjs/throttler` + `@nest-lab/throttler-storage-redis` | ^6.4.0 / ^1.2.0 | Redis-backed rate limiting | `apps/api/package.json`, `apps/api/src/modules/auth/auth.module.ts:21-31` |\n| `zod` | ^3.23.8 | Trust-boundary validation (HTTP + LLM structured output) | `packages/shared/package.json`, `apps/api/src/common/pipes/zod-validation.pipe.ts` |\n| `pino` + `nestjs-pino` | ^9.5.0 / ^4.1.0 | Structured JSON logging | `apps/api/package.json`, `plan/observability.md` |\n| `prom-client` | ^15.1.3 | Prometheus metrics on `/metrics` | `apps/api/package.json`, `apps/api/src/common/metrics/` |\n| `@sentry/node` | ^11.4.0 | Error tracking against self-hosted GlitchTip; no-op without `SENTRY_DSN`, `beforeSend` runs shared redaction | `apps/api/package.json`, `apps/worker/package.json`, `apps/api/src/common/sentry.ts` |\n| `@slack/web-api` | ^7.11.0 | Slack daily-assistant integration | `apps/api/package.json` |\n| `googleapis` + `google-auth-library` | ^144.0.0 / ^9.15.0 | Gmail OAuth, watch, push ingest | `apps/api/package.json` |\n| `@octokit/rest` | ^21.1.0 | GitHub repo sync in workers | `apps/worker/package.json` |\n| `@react-pdf/renderer` + `docx` | ^4.9.0 / ^9.5.1 | Resume/cover-letter PDF + DOCX rendering | `packages/resume-render/package.json` |\n| `electron` + `electron-updater` + `playwright-core` + `keytar` | ^31.3.1 / ^6.3.9 / ^1.47.2 / ^7.9.0 | Desktop companion agent | `apps/desktop/package.json` |\n| `expo` + `expo-router` + `expo-secure-store` + `react-native` | ~57.0 / ~57.0.24 / ~57.0.4 / 0.86.3 (React 19.2.3) | Mobile companion app (iOS/Android); per-device token in the OS keychain | `apps/mobile/package.json`, `apps/mobile/app.json` |\n| `@xenova/transformers` | ^2.17.2 | Local semantic embeddings (`Xenova/bge-small-en-v1.5`, 384-d) loaded lazily; deterministic SHA-256 fallback | `packages/embeddings/package.json`, `packages/embeddings/src/provider.ts` |\n| `js-tiktoken` | ^1.0.21 | Pre-flight prompt-token estimation for cost caps + `LlmCall.estimatedPromptTokens` | `packages/ai/package.json`, `packages/ai/src/tokenize.ts` |\n| `cheerio` | ^1.0.0 | Email-alert HTML parsing | `packages/email-parsers/package.json` |\n\n**Notable production choices and reality checks**\n\n- **Provider adapters ship for DeepSeek, OpenAI/OpenRouter, and local Ollama:** `packages/ai/src/providers/` holds `deepseek.ts`, `openai-compatible.ts` (shared by OpenAI + any OpenAI-compatible base URL), `ollama.ts` (native `/api/chat`, `prompt_eval_count`/`eval_count`), plus `fallback.ts` (5-failure/60s-open circuit breaker → primary → backup → Ollama last-resort) and `create.ts` (`createProvider`/`registerBuiltinProviders`). All are chat-only on the `AIProvider` surface (structured output yes; streaming/tools/embeddings no; Anthropic/Azure still absent). See `packages/ai/src/provider.ts`, `registry.ts`, `providers/`.\n- **Embeddings are now a real provider seam (Wave B):** `packages/embeddings/src/provider.ts` selects `EMBEDDING_MODE` — `local` (default) lazy-loads `Xenova/bge-small-en-v1.5` through `@xenova/transformers` into `EMBEDDING_MODEL_CACHE_DIR`, `deterministic` is the offline SHA-256 fallback in `local.ts` (unchanged, 384-d), and `external` is a pluggable hosted adapter with none shipped. `local` is wrapped in `FallbackEmbeddingProvider`, so an offline/missing model degrades to deterministic with a warning and reports the effective mode (never a stale `bge-small-en` claim). The worker's `embedding.generate` job and `POST /embeddings/reembed` use the same seam.\n- **Per-call LLM audit + injection audit are wired (Wave C):** `makeLlmAuditor` writes one `LlmCall` (`llm_calls`: prompt id/hash, sensitivity, tokens via `js-tiktoken` pre-flight + provider `usage`, cost split, latency, validation verdict) through a bounded queue that drops loudly; `InjectionAuditModule` persists `LlmInjectionLog` (`llm_injection_log`) rows for every suspect/blocked wrap-or-scan hit. See `apps/api/src/common/{llm-audit.ts,injection-log.ts,injection-audit.module.ts}`, `packages/ai/src/tokenize.ts`.\n- **Master-key rotation is implemented (Wave C):** pure `rotateMasterKey(old, new, ctx)` in `@careeros/secrets` re-encrypts both `encrypted_secrets` rows and `enc:v1:` field values, idempotently (already-rotated rows are skipped on resume). `MasterKeyRotationService` walks them one transaction per row; `POST /me/security/rotate-key` is session + fresh-re-auth gated. See `packages/secrets/src/rotation.ts`, `apps/api/src/modules/me/master-key-rotation.service.ts`.\n- **Swagger/OpenAPI is now real** (cleanup task U1): `@nestjs/swagger` (^7.4.2) + `@asteasolutions/zod-to-openapi` (^7.3.4) are declared and `apps/api/src/main.ts` serves the OpenAPI document at `/api/openapi.json` and Swagger UI at `/api/docs` (behind an auth gate in production). The old \"no swagger dependency\" caveat no longer applies.\n- **Prisma is one major across the workspace** (cleanup T11): api, worker, and `@careeros/aggregator` all use `@prisma/client`/`prisma` `^6.19.3`. `apps/api` wires `postinstall: prisma generate` (plus `prebuild`) so a clean install generates the client.\n\n### 3) Development Toolchain\n\n| Tool | Purpose | Evidence |\n|------|---------|----------|\n| Turborepo 2.11.2 | Task orchestration + cache | `package.json`, `turbo.json` |\n| TypeScript 5.9.3 (^5.6.3) | Strict compilation (`strict`, `exactOptionalPropertyTypes`, `noUncheckedIndexedAccess`) | `tsconfig.base.json` |\n| Prettier 3.9.8 + `prettier-plugin-tailwindcss` | Formatting | `.prettierrc` |\n| **ESLint 9** in `apps/web` (`eslint.config.mjs`, `eslint-config-next@16`); root `.eslintrc.cjs` is still a dormant reference config | Web lint: Next core-web-vitals + TypeScript rules; cross-cutting `no-console`/raw-`chat()`/literal-`data-testid` rules live in the root config, not yet adopted by workspaces | `.eslintrc.cjs`, `apps/web/package.json`, `apps/web/eslint.config.mjs` |\n| Vitest 5 | Unit + integration runner | `vitest.config.ts`, `package.json` |\n| Testcontainers 10.28 | Real Postgres/Redis/Qdrant/MinIO for integration tests | `packages/testing/package.json`, `packages/testing/src/index.ts` |\n| Playwright 1.63 | E2E, a11y, visual | `apps/web/playwright.config.ts`, `apps/web/e2e/` |\n| `fast-check` 4.10 | Property-based tests | `package.json`, `packages/testing/src/index.ts` |\n| `msw` 2.15 | External HTTP mocks (unit) | `packages/testing/src/index.ts` |\n| `@axe-core/playwright` 4.10 | WCAG 2.1 AA checks | `apps/web/package.json` |\n| lefthook | Pre-commit gitleaks + typecheck + lint | `lefthook.yml`, `package.json:10` |\n| ESLint (dormant root chain) | Cross-cutting rules; requires workspaces to opt in | `.eslintrc.cjs:10-18` |\n\n### 4) Key Commands\n\n```bash\npnpm install                       # install all workspace deps\npnpm docker:up                     # build shared pkgs + start full compose stack\npnpm migrate                       # prisma migrate deploy\npnpm dev                           # turbo run dev --parallel (api + web + worker)\npnpm build                         # turbo run build\npnpm typecheck                     # turbo run typecheck\npnpm lint                          # turbo run lint\npnpm test                          # vitest run (unit + integration)\npnpm test:unit                     # excludes integration + e2e\npnpm test:integration              # vitest run integration.test\npnpm test:e2e                      # @careeros/web Playwright\npnpm test:evals                    # @careeros/ai LLM evals (EVAL_MOCK=1 default)\nmake help                          # shortcut help (Makefile)\n```\n\n### 5) Environment and Config\n\n- **Config sources:** `.env` (copied from `.env.example`), `apps/api/prisma/schema.prisma`, `apps/web/next.config.mjs`, `apps/web/tailwind.config.ts`, `apps/mobile/app.json`, `infra/docker/docker-compose.yml`, `infra/nginx/nginx.conf` + `infra/nginx/templates/careeros.conf.template`, per-workspace `tsconfig.json`, `packages/ui/src/tokens.css`.\n- **Required env vars** (from `.env.example`): `POSTGRES_USER`, `POSTGRES_DB`, `POSTGRES_PASSWORD`, `DATABASE_URL`, `REDIS_URL`, `QDRANT_URL`, `MINIO_ROOT_USER`, `MINIO_ROOT_PASSWORD`, `MINIO_BUCKET`, `ENCRYPTION_KEY`, `SESSION_SECRET`, `API_PORT`, `WEB_PORT`, `WEB_URL`, `API_URL`, `TRUSTED_ORIGINS`, `SESSION_TTL_HOURS`. Optional/gated: `DEEPSEEK_API_KEY`, `FIRECRAWL_API_KEY`, `EMBEDDING_MODE` (+ `EMBEDDING_MODEL_CACHE_DIR`), `LOG_LEVEL`, `LOG_DEBUG`, `NEXT_TELEMETRY_DISABLED`, public-entrypoint `SERVER_NAME`/`HTTP_PORT`/`HTTPS_PORT`/`TLS_CERT_PATH`/`TLS_KEY_PATH`/`HSTS_MAX_AGE`/`ACME_EMAIL`, and backup `AGE_RECIPIENT`.\n- **Boot-time enforcement:** `apps/api/src/startup-check.ts` refuses to start on missing/weak `ENCRYPTION_KEY`, `SESSION_SECRET`, or datastore credentials (<24 bytes or known-weak). Compose interpolates `${VAR:?...}` so a missing password aborts the stack.\n- **Deployment/runtime constraints:** Docker Compose on a VPS; api/worker reach the internet only through an allowlisting Squid proxy; datastores on an `internal: true` network. All three app containers (api, worker, web) run `read_only` with a `tmpfs` scratch area, `cap_drop: ALL` (worker/web hold no caps), and `no-new-privileges:true` (`infra/docker/docker-compose.yml`). `undici`/`EnvHttpProxyAgent` enforces the proxy for Node global `fetch` (`apps/api/src/main.ts:97`, `apps/worker/src/main.ts:120`). **nginx is now present** (`infra/nginx/`) and is the only service publishing host ports (80/443), terminating TLS, redirecting `:80`→`:443` (except `/healthz` + ACME challenge), and routing `/`→web and `/api/*`→api; `certbot` renews every 12h, and an `ops`-profiled `backup` sidecar (`infra/docker/Dockerfile.backup`) writes age-encrypted artifacts. See `INTEGRATIONS.md` and `infra/nginx/README.md`.\n\n### 6) Evidence\n\n- `package.json` (AGPL-3.0-or-later), `pnpm-workspace.yaml`, `pnpm-lock.yaml`, `turbo.json`, `tsconfig.base.json`, `.nvmrc`\n- `apps/*/package.json`, `packages/*/package.json` (including `apps/mobile/`, `packages/aggregator/`, `packages/firecrawl/`)\n- `.env.example`, `infra/docker/docker-compose.yml`, `infra/docker/Dockerfile.backup`, `infra/nginx/`, `apps/api/src/startup-check.ts`\n- `apps/api/src/main.ts` (Swagger + egress + token-cap filter), `apps/worker/src/main.ts` (egress boot), `packages/shared/src/net/proxy-dispatcher.ts`\n- `packages/embeddings/src/provider.ts`, `packages/ai/src/tokenize.ts`, `packages/secrets/src/rotation.ts`, `apps/api/src/common/{llm-audit.ts,injection-log.ts}`\n- `docs/codebase/.codebase-scan.txt` (DIRECTORY TREE, STACK DETECTION, CODE METRICS)\n\n## Extended Sections\n\n### Docker base images (digest-pinned)\n\n`infra/docker/docker-compose.yml`: `postgres:*`, `redis:*`, `qdrant/qdrant:v1.12.4`, `bitnamilegacy/minio`, `ubuntu/squid:6.10`, `nginx:alpine`, `certbot/certbot`, plus locally built `api`/`worker`/`web` images and the `ops`-profiled `backup` sidecar built from `infra/docker/Dockerfile.backup` (alpine + age/`mc`/`pg_dump`). `scripts/verify-image-pins.sh` fails CI if a floating tag is reintroduced (security spec item 10).\n\n### Shared-package dependency graph (production deps only)\n\n`@careeros/shared` (zod) is the base; `@careeros/ai`, `@careeros/job-pipeline`, `@careeros/email-parsers`, `@careeros/browser-agent`, `@careeros/firecrawl`, and `@careeros/aggregator` depend on it; `@careeros/embeddings` (Qdrant + `@xenova/transformers`) and `@careeros/resume-render` (React-PDF/docx) are leaf capabilities; `@careeros/messaging`, `@careeros/secrets`, `@careeros/auth`, `@careeros/sandbox`, `@careeros/ui`, `@careeros/testing` are independent. `@careeros/aggregator` (skill-state sync; type-only Prisma import) is consumed by both `apps/api` and `apps/worker`; `@careeros/firecrawl` (Firecrawl search/scrape/crawl client) is consumed by the worker and the job-pipeline adapter. `apps/api` and `apps/worker` compose all of the above; `apps/mobile` is standalone (no workspace deps — REST only). See `STRUCTURE.md` for the diagram.\n"},{"id":"structure","title":"Codebase Structure","md":"\n# Codebase Structure\n\nCareer OS is a pnpm + Turborepo monorepo with five applications and fifteen shared packages. There is no path-alias indirection: cross-workspace imports use the `@careeros/*` package names declared in each `package.json`; within a workspace imports are relative.\n\n## Core Sections (Required)\n\n### 1) Top-Level Map\n\n| Path | Purpose | Evidence |\n|------|---------|----------|\n| `apps/web/` | Next.js 16 App Router user app: setup wizard, dashboard, arena, market, jobs, settings, devices | `apps/web/src/app/**/page.tsx`; `apps/web/package.json` |\n| `apps/api/` | NestJS HTTP API: 41 feature-module directories (49 modules registered in `app.module.ts`), Prisma data layer, WebSockets gateway, seed data | `apps/api/src/app.module.ts`; `apps/api/src/modules/` |\n| `apps/worker/` | BullMQ workers on Redis (sync, embedding, retention, market snapshot, Gmail watch, selector health, corpus refresh) | `apps/worker/src/main.ts`; `apps/worker/src/*.worker.ts` |\n| `apps/desktop/` | Electron desktop companion agent (Playwright + user's Chrome, WSS pairing, tray/pairing UI) | `apps/desktop/src/main.ts`; `apps/desktop/renderer/pair.html` |\n| `apps/mobile/` | Expo (React Native SDK 57) mobile companion — read-only daily brief, jobs, approvals, settings; `expo-router` + `expo-secure-store` | `apps/mobile/package.json`, `apps/mobile/src/app/` |\n| `packages/ai/` | `AIProvider` abstraction, DeepSeek/OpenAI-compatible/Ollama adapters + fallback, versioned prompts, tokenizer, grounding/injection/sensitivity, evals | `packages/ai/src/` |\n| `packages/shared/` | Zod schemas, constants, knowledge rules, queues, retry, redact, git-analysis, SSRF guard | `packages/shared/src/` |\n| `packages/job-pipeline/` | Source-agnostic job ingestion funnel: stages + adapters (`ashby`, `greenhouse`, `adzuna`, `arbeitnow`, `remotive`, `firecrawl`, `workday`, `lever`, `smartrecruiters`, `workable`, `icims`, `successfactors`) | `packages/job-pipeline/src/stages/`, `packages/job-pipeline/src/adapters/` |\n| `packages/aggregator/` | Single skill-state write path: evidence → `candidate_skill_state` + `skill_state_event` (type-only Prisma import); used by api + worker | `packages/aggregator/src/index.ts` |\n| `packages/firecrawl/` | Firecrawl API client (search/scrape/crawl), Zod-validated, typed errors, retry | `packages/firecrawl/src/` |\n| `packages/embeddings/` | Qdrant store wrapper + embedding provider seam (local `bge-small-en` / deterministic fallback / external) | `packages/embeddings/src/` |\n| `packages/auth/` | Argon2id hashing + sealed session cookie helpers | `packages/auth/src/` |\n| `packages/secrets/` | AES-256-GCM field encryption + master-key validation + rotation primitive | `packages/secrets/src/` |\n| `packages/browser-agent/` | Agent task contract, YAML allowlist, pacing, kill-switch, selector health | `packages/browser-agent/src/` |\n| `packages/email-parsers/` | LinkedIn/Indeed/Naukri alert-HTML parsers | `packages/email-parsers/src/` |\n| `packages/resume-render/` | PDF/DOCX resume + cover-letter rendering and templates | `packages/resume-render/src/` |\n| `packages/sandbox/` | Docker-per-run code execution with resource/kill limits | `packages/sandbox/src/` |\n| `packages/messaging/` | Transport-free `Channel` interface + `ChannelRegistry` (Slack/Web registered at runtime) | `packages/messaging/src/` |\n| `packages/ui/` | Design-system primitives, tokens, layout | `packages/ui/src/` |\n| `packages/testing/` | Testcontainers harness, MSW handlers, axe, arbitraries | `packages/testing/src/index.ts` |\n| `infra/` | Docker Compose + per-service Dockerfiles (incl. `Dockerfile.backup`), nginx reverse proxy + TLS templates, Postgres init, Squid config, Slack manifest | `infra/docker/`, `infra/nginx/`, `infra/postgres/`, `infra/slack/` |\n| `plan/` | Living implementation plan, per-phase checklists, cross-cutting specs (security, ai-safety, testing, observability, release) | `plan/PLAN.md` and siblings |\n| `docs/` | Operator docs + authoritative product blueprint (`.docx`) | `docs/architecture.md`, `docs/*.docx` |\n| `careeros-screens/` | 60+ static HTML wireframes (information architecture only, not final design) | `careeros-screens/index.html` |\n| `scripts/` | Backup/restore, verification gates, browser-agent probes, smoke tests | `scripts/` |\n| `.github/workflows/` | 9 CI/CD workflows | `.github/workflows/` |\n| `AGENTS.md` | Durable agent/dev rules for the repo | `AGENTS.md` |\n\n### 2) Entry Points\n\n- **Main runtime entry (API):** `apps/api/src/main.ts` — boots after `startup-check.ts`, installs the egress proxy (`installEgressProxy()`), registers global `LockoutExceptionFilter` + `TokenCapExceptionFilter`, helmet security middleware, and serves Swagger UI at `/api/docs` + OpenAPI JSON at `/api/openapi.json` (`apps/api/src/openapi/`).\n- **Web entry:** `apps/web/src/app/layout.tsx` + `apps/web/src/middleware.ts` (setup-state gate + Next security headers/nonce).\n- **Worker entry:** `apps/worker/src/main.ts` — pino + Prisma + heartbeat + Qdrant + seed skills + register workers.\n- **Desktop entry:** `apps/desktop/src/main.ts` (Electron main process, tray + pairing window; renderer `apps/desktop/renderer/pair.html`).\n- **Mobile entry:** `apps/mobile/src/app/_layout.tsx` (expo-router root; `(auth)/sign-in` + `(app)/*` read-only screens).\n- **Secondary entry points:** NestJS `AgentGateway` (`apps/api/src/modules/agent/agent.gateway.ts`); `MobileAuthMiddleware` + `MobileController` (`apps/api/src/modules/mobile/`); scheduled BullMQ repeatables registered in `apps/worker/src/main.ts`; `scripts/backup.sh` / `restore.sh`.\n- **How entry is selected:** root `package.json` scripts drive `turbo run dev`; each workspace declares its own `dev`/`start`; API production start runs `prisma migrate deploy` first (`apps/api/package.json:11`).\n\n### 3) Module Boundaries\n\n| Boundary | What belongs here | What must not be here |\n|----------|-------------------|------------------------|\n| `apps/web` | UI, routing, browser fetch wrapper, middleware gate | Direct imports of adapter/provider packages; server secrets |\n| `apps/api` | HTTP/WS controllers, domain services, Prisma access, guards | Long-running batch jobs (those go to worker); provider SDK calls outside `packages/ai` |\n| `apps/worker` | BullMQ processors, scheduled jobs, external sync | HTTP request handling |\n| `apps/desktop` | Local Playwright execution, keychain, WSS client, OS integration | Server-side business logic; server scraping |\n| `apps/mobile` | Expo/React Native read-only client, secure-store token, REST only | Server-side business logic; write actions (stay on web for now) |\n| `packages/*` | Reusable capability with a stable interface | Feature-specific controller/service logic (belongs in `apps/api`) |\n| `packages/ai` | Provider abstraction, prompts, grounding/safety | Direct DB access (agents write through domain services) |\n\nRule from `AGENTS.md` §5: never import an adapter from `apps/web` directly; go through a stable `packages/` interface. Domain logic lives in `apps/api` NestJS modules.\n\n### 4) Naming and Organization Rules\n\n- **File naming:** `kebab-case` for multi-word files (`zod-validation.pipe.ts`, `agent.jwt-strategy.ts`, `market-snapshot.worker.ts`); React components are `PascalCase.tsx` (`SkillTree.tsx`, `ApprovalQueue.tsx`); hooks/utilities are `camelCase.ts` (`useDrafts.ts`, `api-client.ts`).\n- **Directory organization:** `apps/api` is module/feature-based (`modules/<feature>/<feature>.controller.ts|service.ts|module.ts`); `apps/web` is route-based under `src/app` and feature-based under `src/components/<feature>/`; `packages` are capability-based with a barrel `src/index.ts`.\n- **Bootstrap file inside modules:** modules consistently use `<feature>.module.ts` + `<feature>.controller.ts` + `<feature>.service.ts`, and colocate `<name>.test.ts`.\n- **Import aliases:** no custom `paths` alias in `tsconfig.base.json`; `@careeros/*` is the workspace package name; intra-workspace imports are relative (`../..`).\n- **Barrel policy:** every package exposes a single `src/index.ts`; `@careeros/shared` additionally exposes subpath exports (`./schemas`, `./constants`, `./redact`, `./retry`, `./net`). `./net` is deliberately excluded from the barrel (`packages/shared/src/index.ts:18-19`).\n\n### 5) Evidence\n\n- `apps/api/src/app.module.ts`, `apps/api/src/main.ts`, `apps/api/src/modules/`, `apps/api/src/openapi/`\n- `apps/web/src/app/`, `apps/web/src/components/`, `packages/ui/src/index.ts`, `packages/ui/src/motion.ts`\n- `apps/mobile/src/app/`, `apps/mobile/package.json`, `apps/desktop/renderer/pair.html`\n- `packages/job-pipeline/src/adapters/index.ts` (all registered adapters), `packages/aggregator/src/index.ts`, `packages/firecrawl/src/index.ts`\n- `infra/nginx/`, `infra/docker/Dockerfile.backup`, `pnpm-workspace.yaml`, `turbo.json`, `packages/*/package.json`, `docs/codebase/.codebase-scan.txt` (DIRECTORY TREE)\n\n## Extended Sections\n\n### Workspace dependency diagram\n\n```mermaid\nflowchart TB\n    subgraph apps[\"Applications\"]\n        WEB[\"apps/web<br/>Next.js 16\"]\n        API[\"apps/api<br/>NestJS 10\"]\n        WORKER[\"apps/worker<br/>BullMQ\"]\n        DESKTOP[\"apps/desktop<br/>Electron\"]\n        MOBILE[\"apps/mobile<br/>Expo / RN\"]\n    end\n\n    subgraph pkgs[\"Shared packages\"]\n        SHARED[\"@careeros/shared\"]\n        AI[\"@careeros/ai\"]\n        EMB[\"@careeros/embeddings\"]\n        PIPE[\"@careeros/job-pipeline\"]\n        AGG[\"@careeros/aggregator\"]\n        FIRE[\"@careeros/firecrawl\"]\n        BROWSER[\"@careeros/browser-agent\"]\n        EMAIL[\"@careeros/email-parsers\"]\n        RENDER[\"@careeros/resume-render\"]\n        SANDBOX[\"@careeros/sandbox\"]\n        AUTH[\"@careeros/auth\"]\n        SECRETS[\"@careeros/secrets\"]\n        MSG[\"@careeros/messaging\"]\n        UI[\"@careeros/ui\"]\n        TESTING[\"@careeros/testing\"]\n    end\n\n    WEB --> SHARED\n    WEB --> UI\n    API --> SHARED\n    API --> AI\n    API --> AUTH\n    API --> SECRETS\n    API --> EMB\n    API --> PIPE\n    API --> AGG\n    API --> RENDER\n    API --> SANDBOX\n    API --> MSG\n    WORKER --> SHARED\n    WORKER --> EMB\n    WORKER --> SECRETS\n    WORKER --> BROWSER\n    WORKER --> AGG\n    WORKER --> FIRE\n    DESKTOP --> BROWSER\n    MOBILE -->|REST| API\n\n    AI --> SHARED\n    PIPE --> SHARED\n    PIPE --> FIRE\n    AGG --> SHARED\n    FIRE --> SHARED\n    BROWSER --> SHARED\n    EMAIL --> SHARED\n\n    AUTH -. independent .-> AUTH\n    SECRETS -. independent .-> SECRETS\n    UI -. standalone .-> UI\n    RENDER -. standalone .-> RENDER\n    SANDBOX -. standalone .-> SANDBOX\n    EMB --> QDRANT[(\"Qdrant\")]\n    API --> STORES[(\"Postgres · Redis · MinIO\")]\n    WORKER --> STORES\n```\n\n### Generated vs source boundaries\n\n- Do not document or edit generated output: `dist/`, `.next/`, `apps/*/dist`, `packages/*/dist`, `prisma/generated/`, coverage. `.gitignore` and `.eslintrc.cjs:29-38` both exclude them.\n- `apps/api/prisma/migrations/` **is** committed source (39 migration directories) and must be treated as reviewable code (`AGENTS.md` §6).\n- The product blueprint `docs/*.docx` is the authoritative *product* spec; `docs/architecture.md` is the maintained integration narrative.\n\n### Empty / not-yet-created paths referenced by config\n\nNo dangling config paths remain for the deployment surface: `infra/nginx/` (config, templates, self-signed script, README), `infra/docker/Dockerfile.backup`, `infra/docker/Dockerfile.whisper`, and the `ops`-profiled `backup` / `glitchtip` and `speech`-profiled `whisper` services now exist, alongside the earlier-resolved `packages/ui/src/motion.ts`, `scripts/dev-host.sh`, `scripts/seed-test.ts`, and `infra/docker/docker-compose.host-dev.yml`. The remaining absent-but-documented consumer work is the P2 `verbal_sessions` table and the web `@sentry/nextjs` layer (see `CONCERNS.md`).\n"},{"id":"architecture","title":"Architecture","md":"\n# Architecture\n\nCareer OS is a layered, modular monolith plus async workers, a local desktop agent, and an Expo mobile client. Postgres is the source of truth; LLMs never are (`AGENTS.md` §1, `docs/architecture.md` §9).\n\n## Core Sections (Required)\n\n### 1) Architectural Style\n\n- **Primary style:** layered + feature-modular monolith (`apps/api` NestJS modules over a Prisma data layer), with an event/queue side-car (`apps/worker` + BullMQ), an out-of-process agent (`apps/desktop`), and a thin REST mobile client (`apps/mobile`).\n- **Why this classification (evidence):** `apps/api/src/app.module.ts` registers 49 modules — 42 feature modules plus infra (`PrismaModule`, `StorageModule`, `QueueModule`, `SensitivityGateModule`, `ProviderLoaderModule`, `InjectionAuditModule`, `MetricsModule`); each feature module owns controller + service + Prisma access. `apps/worker/src/main.ts` boots independent queue consumers via the shared `registerWorker` helper. `packages/*` hold capability interfaces consumed by both apps; `apps/mobile` is standalone and talks REST only.\n- **Single sources of truth (post-cleanup):** job-match scoring lives once in `packages/job-pipeline/src/stages/match.ts` (`computeMatch` for detail, `computeMatchResult` for the jobs list); provider construction + fallback goes through `ProviderLoaderService` (`apps/api/src/common/provider-loader.service.ts`); sensitivity policy has one authority, `SensitivityGateService` (`apps/api/src/common/sensitivity-gate.service.ts`) over the pure rank primitives in `@careeros/ai`; skill-state sync is `@careeros/aggregator`; embeddings go through one `EmbeddingProvider` seam (`packages/embeddings/src/provider.ts`); master-key rotation is the pure `rotateMasterKey` primitive (`packages/secrets/src/rotation.ts`) driven by `MasterKeyRotationService`. Approval dispatch for an unhandled kind fails loud (audit + `markFailed`) rather than dropping the item.\n- **Primary constraints (evidence):**\n  1. **Evidence over claims** — Postgres evidence graph is authoritative; LLMs interpret only (`AGENTS.md` §1, §11).\n  2. **Privacy/egress control** — server scraping of LinkedIn/Indeed/Naukri/Glassdoor is prohibited; only partner APIs, the user's own agent session, or parsed email alerts (`AGENTS.md` §3.4, §15).\n  3. **Approval + audit for outbound actions** — nothing sends without an approval-queue item and an append-only audit row (`AGENTS.md` §3.3, `apps/api/src/modules/approvals/`).\n\n### 2) System Flow\n\n```text\nBrowser (Next.js) → middleware setup-gate → /api HTTP (NestJS controllers)\n  → domain service (modules/*) → packages/* capability (ai, job-pipeline, secrets…)\n  → Postgres / Qdrant / Redis / MinIO  → response\nNginx (TLS :443) → / → web:3000 · /api/* → api:3001 (prefix stripped)\nExpo mobile app → same REST API (mobile:* bearer, no cookie)\nAsync: API enqueues BullMQ job → apps/worker processor → external API\n  → Postgres evidence/pipeline rows → (optionally) WSS push back to browser\n```\n\nConcretely, a GitHub connect (`docs/architecture.md` §4.2): web `POST /integrations/github/select` → API enqueues `github.sync` → worker lists repos via Octokit → evidence rows → KnowledgeAggregator updates `candidate_skill_state` and appends `skill_state_event` → dashboard reads `/me/skills`.\n\nAn LLM call (`docs/architecture.md` §5.3): build versioned prompt → sensitivity gate → provider fallback chain → `chatStructured<T>({schema})` → Zod validation (one retry) → `llm_calls` audit row → optional fact-check gate before rendering. Untrusted content that trips the wrap/scan boundary additionally writes a `llm_injection_log` row.\n\n### 3) Layer/Module Responsibilities\n\n| Layer or module | Owns | Must not own | Evidence |\n|-----------------|------|--------------|----------|\n| `apps/web` | Routing, middleware gate, feature components, browser fetch/CSRF | Adapter imports, server secrets | `apps/web/src/middleware.ts`, `apps/web/src/lib/api-client.ts` |\n| `apps/api/modules/*` | HTTP/WS endpoints, domain rules, state machines, Prisma access | Provider SDK calls, long batch jobs | `apps/api/src/modules/` |\n| `apps/api/common` | Guards, pipes, filters, storage, metrics, redaction | Feature domain logic | `apps/api/src/common/` |\n| `apps/worker` | Queue processors, cron jobs, external sync | HTTP handling | `apps/worker/src/*.worker.ts`, `main.ts` |\n| `apps/desktop` | Local Playwright, keychain, WSS, OS integration | Server business logic, server-side scraping | `apps/desktop/src/main.ts`, `task-runner.ts` |\n| `apps/mobile` | Read-only mobile UI, secure-store token, REST calls | Server business logic, write actions | `apps/mobile/src/app/`, `apps/mobile/src/lib/api.ts` |\n| `packages/ai` | Provider abstraction + DeepSeek/OpenAI-compatible/Ollama adapters + fallback chain, prompts, tokenizer, grounding, injection/sensitivity | DB writes | `packages/ai/src/provider.ts`, `providers/` |\n| `packages/job-pipeline` | Source-agnostic ingestion stages + adapters; the canonical weighted match scorer (`computeMatch`/`computeMatchResult`) | Persistence (caller writes) | `packages/job-pipeline/src/stages/`, `stages/match.ts`, `adapters/` |\n| `packages/aggregator` | Skill-state aggregation + `skill_state_event` audit (type-only Prisma) | HTTP / domain rules | `packages/aggregator/src/index.ts` |\n| `packages/firecrawl` | Firecrawl search/scrape/crawl client (Zod-validated, typed errors) | Job-source policy (lives in `docs/job-sources.md`) | `packages/firecrawl/src/client.ts` |\n| `packages/shared` | Zod schemas, constants, knowledge rules, retry, redact, SSRF guard, egress proxy | Feature-specific logic | `packages/shared/src/` |\n\n### 4) Reused Patterns\n\n| Pattern | Where found | Why it exists |\n|---------|-------------|---------------|\n| Provider/Adapter (Strategy) | `packages/ai/src/provider.ts` + `registry.ts` + `providers/`; `packages/embeddings/src/provider.ts`; `packages/job-pipeline/src/adapters/`; `packages/embeddings/src/qdrant.ts` | Swap LLM/embedding/job source without touching domain code |\n| Decorator fallback chain | `packages/ai/src/providers/fallback.ts` + `CircuitBreaker` (primary → backup → Ollama) | Availability failover without changing call sites; gate runs per candidate |\n| Bounded fire-and-forget audit queue | `apps/api/src/common/llm-audit.ts` (`makeLlmAuditor`), `apps/api/src/common/injection-log.ts` | Persist `llm_calls` + `llm_injection_log` without blocking or unbounded memory |\n| Single-loader / single-authority | `ProviderLoaderService` (budget → config → sensitivity → decrypt → construct provider), `SensitivityGateService` (one egress decision per provider) | Remove near-duplicate call-site logic and divergent policy |\n| Canonical pure scorer | `packages/job-pipeline/src/stages/match.ts` — same `computeMatch` backs list + detail | One score per job/candidate pair |\n| Registry (explicit, no FS scan) | `ProviderRegistry`, prompt registry `packages/ai/src/prompts/index.ts`, adapter registry | Predictable boot; unknown ID = hard fail |\n| Repository/Service via DI | All `apps/api/src/modules/*.service.ts` + PrismaService | Keep invariant enforcement in one layer |\n| State machine | `apps/api/src/modules/approvals/state-machine.ts`; `packages/shared/src/applications.ts` (`canTransition`) | Guard irreversible transitions |\n| Queue + idempotent job IDs | `apps/worker/src/main.ts`, `packages/shared/src/queues.ts` | Reliable async; no double-processing |\n| Zod at trust boundaries | `apps/api/src/common/pipes/zod-validation.pipe.ts`; every prompt schema | Validate every request + LLM response |\n| Grounded generation | `packages/ai/src/grounded.ts` + `grounded/gate.ts`; fact-check in `resume-variants` | Every generated claim binds to a `fact_id` |\n| Untrusted-content isolation | `packages/ai/src/wrap.ts` + `injection-scan.ts` | Structural prompt-injection defence |\n| Field-level encryption via middleware | `apps/api/src/prisma/prisma.service.ts:28-116` | Encrypt PII at rest transparently |\n| Guard/decorator | `RequireAdminGuard`, `@RateLimitAuth()`, `AgentJwtGuard` | Cross-cutting auth/limits |\n\n### 5) Known Architectural Risks\n\n- **Multi-user not enforced by default.** Most modules call `SessionService.requireUserId`, but there is no global session guard; global `AppConfig` writes are explicitly blocked when a second user exists (`UsageService.assertSingleUserForGlobalConfig`, `plan/security.md` item 1). A missed `requireUserId` could expose data before multi-tenant work lands. See `CONCERNS.md`.\n- **Schema is string-typed, not enum-enforced.** 55 Prisma models, 0 `enum` blocks — states are `String` with documented unions (`Application.state`, `Evidence.kind`, `NormalizedJob.state`). Invalid states are only prevented by app code.\n- **Anthropic/Azure have no adapter** (DeepSeek, OpenAI/OpenRouter, and Ollama do, with a real fallback chain), and circuit-breaker state is in-process (`packages/ai/src/providers/`, `apps/api/src/common/provider-loader.service.ts`).\n- **N+1 / pagination ceiling** already identified by the team: `plan/PLAN.md:69` parks N+1 in `JobsService.sync` and a match-score pagination pool ceiling as debt. Skill extraction and adapter fetch/persist still run inline in the API request path rather than on a `jobs` BullMQ queue.\n- **Deferred phase slices** (see `plan/DEFERRED.md`) mean several documented flows are partial: the `verbal_sessions` table and its P2/P6 consumers, web `@sentry/nextjs` instrumentation, mobile push/offline, desktop installer signing, and prompt-eval registration are still open. GlitchTip and `whisper.cpp` now exist in compose (profiles `ops`/`observability` and `speech`), and the formerly-absent deployment paths (`infra/nginx/`, `infra/docker/Dockerfile.backup`) exist.\n- **Resolved during cleanup + Waves A–C (no longer risks):** Prisma is aligned on 6.x across api/worker/aggregator; egress for Node global `fetch` is enforced via `undici`; Swagger/OpenAPI is implemented; api/worker/web containers are hardened; GitHub Actions are SHA-pinned; the embedding provider seam is real (`bge-small-en` + deterministic fallback); `@careeros/messaging` is instantiated through `ChannelRegistry`; the desktop devices UI ships; nginx/TLS/certbot/backup are in compose. See `CONCERNS.md`.\n\n### 6) Evidence\n\n- `docs/architecture.md` (system topology, golden paths, data lifecycles, failure modes)\n- `AGENTS.md` §1-§14, `plan/PLAN.md` (locked decisions, status board)\n- `apps/api/src/main.ts`, `apps/api/src/app.module.ts`, `apps/api/src/modules/`\n- `apps/api/src/common/{provider-loader.service.ts,sensitivity-gate.service.ts,llm-audit.ts,injection-log.ts,injection-audit.module.ts}`, `packages/job-pipeline/src/stages/match.ts`, `packages/aggregator/src/index.ts`, `packages/embeddings/src/provider.ts`, `packages/secrets/src/rotation.ts`, `apps/api/src/modules/me/master-key-rotation.service.ts`\n- `apps/worker/src/main.ts`, `apps/worker/src/register-worker.ts`, `packages/ai/src/{provider,registry,grounded,wrap}.ts`, `packages/ai/src/providers/`\n- `apps/mobile/src/`, `apps/desktop/src/`, `infra/nginx/`, `infra/docker/Dockerfile.backup`\n- `apps/api/prisma/schema.prisma`\n\n## Extended Sections\n\n### Component / deployment architecture\n\n```mermaid\nflowchart TB\n    subgraph client[\"Clients\"]\n        Browser[\"User browser\"]\n        Agent[\"Desktop agent (Electron + Playwright + Chrome)\"]\n        Mobile[\"Mobile app (Expo / React Native)\"]\n    end\n\n    subgraph vps[\"Self-hosted host (Docker Compose)\"]\n        Nginx[\"nginx (TLS :80/:443)\"]\n        Web[\"web (Next.js :3000)\"]\n        API[\"api (NestJS :3001)\"]\n        Worker[\"worker (BullMQ)\"]\n        subgraph data[\"Private network (internal: true)\"]\n            PG[(\"Postgres\")]\n            Redis[(\"Redis\")]\n            Qdrant[(\"Qdrant\")]\n            MinIO[(\"MinIO\")]\n        end\n        Squid[\"squid egress proxy (allowlist)\"]\n    end\n\n    subgraph ext[\"External (operator-configured)\"]\n        DeepSeek[\"DeepSeek API\"]\n        GitHub[\"GitHub / GitLab\"]\n        ATS[\"Ashby / Greenhouse\"]\n        Agg[\"Adzuna / Remotive / Arbeitnow\"]\n        Slack[\"Slack\"]\n        Gmail[\"Gmail + Pub/Sub\"]\n    end\n\n    Browser -->|HTTPS| Nginx --> Web\n    Nginx -->|/api/*| API\n    Web -->|server-side API_URL| API\n    Mobile -->|REST /api| Nginx\n    Agent <-.WSS pairing.-> API\n    API --> PG\n    API --> Redis\n    API --> Qdrant\n    API --> MinIO\n    Worker --> PG\n    Worker --> Redis\n    Worker --> Qdrant\n    API --> Squid\n    Worker --> Squid\n    Squid --> DeepSeek\n    Squid --> GitHub\n    Squid --> ATS\n    Squid --> Agg\n    API -. webhooks .-> Slack\n    Slack -. events .-> API\n    Gmail -. push .-> API\n```\n\n### Data flow: job ingestion to match (source-agnostic)\n\n```mermaid\nsequenceDiagram\n    participant Sched as Scheduler (BullMQ)\n    participant Adapter as Job adapters (Ashby/Adzuna/…)\n    participant Pipeline as packages/job-pipeline\n    participant LLM as DeepSeek (grounded skill extract)\n    participant DB as Postgres\n    participant User as User (web)\n\n    Sched->>Adapter: hourly ingest tick\n    Adapter->>Pipeline: RawJob[]\n    Pipeline->>DB: insert jobs_raw (append-only)\n    Pipeline->>Pipeline: normalize → dedupe → cross-source dedupe → freshness\n    Pipeline->>LLM: skill extract (wrapUntrusted + schema)\n    LLM-->>Pipeline: {skill_ids[], evidence_refs}\n    Pipeline->>Pipeline: verify (trust order) → relevance → match\n    Pipeline->>DB: upsert NormalizedJob + JobRejectLog on reject\n    User->>DB: GET /jobs → match list with gap report\n```\n\n### Failure modes / degraded behaviour\n\nThe repo documents its degradation posture in `docs/architecture.md` §8: DeepSeek circuit-breaker to fallback provider; Postgres down → 503 + retry loop; Qdrant down → text fallback; Redis down → in-memory rate limit; agent offline → tasks held 7 days; LLM budget exceeded → 429 with reset time; injection detected → auto-action skipped. The observability contract adds `/health` (dependency checks, 5s cache) and `/metrics` (`plan/observability.md`).\n"},{"id":"conventions","title":"Coding Conventions","md":"\n# Coding Conventions\n\nConventions below are stated in `AGENTS.md`, `CONTRIBUTING.md`, and enforced (or partially enforced) by config in the repo. Where a rule is aspirational rather than enforced, that is called out explicitly.\n\n## Core Sections (Required)\n\n### 1) Naming Rules\n\n| Item | Rule | Example | Evidence |\n|------|------|---------|----------|\n| Files (non-React) | kebab-case (dot-separated \"type\" suffix for Nest components) | `zod-validation.pipe.ts`, `market-snapshot.worker.ts`, `assert-public-url.ts` | `apps/api/src/common/pipes/zod-validation.pipe.ts`; `apps/worker/src/market-snapshot.worker.ts` |\n| React components | PascalCase `.tsx`, one component per file | `SkillTree.tsx`, `ApprovalQueue.tsx` | `apps/web/src/components/skills/SkillTree.tsx` |\n| Hooks / utilities | camelCase | `useDrafts.ts`, `api-client.ts`, `chart-geometry.ts` | `packages/ui/src/useDrafts.ts`; `apps/web/src/lib/api-client.ts` |\n| Functions/methods | camelCase, verb-first | `syncSkillState`, `encryptField`, `computeMatch` | `packages/aggregator/src/index.ts`; `packages/secrets/src/field.ts`; `packages/job-pipeline/src/stages/match.ts` |\n| Types/interfaces | PascalCase; Zod schemas suffixed `Schema` | `NormalizedJob`, `SkillExtractSchema` | `packages/shared/src/schemas/index.ts` |\n| Constants | UPPER_SNAKE_CASE | `QUEUE_GITHUB`, `EMBED_DIM`, `SENSITIVITY_LEVELS` | `packages/shared/src/queues.ts`, `packages/embeddings/src/local.ts` |\n| Env vars | UPPER_SNAKE_CASE | `ENCRYPTION_KEY`, `TRUSTED_ORIGINS` | `.env.example` |\n| DB tables/columns | snake_case in `@@map`/`@map`; Prisma models PascalCase | `candidate_skill_state`, `job_reject_log` | `apps/api/prisma/schema.prisma` |\n| Migrations | descriptive snake_case name (never a date alone) | `add_evidence_source_column` | `AGENTS.md` §6; `apps/api/prisma/migrations/` |\n\n### 2) Formatting and Linting\n\n- **Formatter:** Prettier 3 configured in `.prettierrc` — `semi: true`, `singleQuote: true`, `trailingComma: \"all\"`, `printWidth: 100`, `tabWidth: 2`, `arrowParens: \"always\"`, plugin `prettier-plugin-tailwindcss`. Run with `pnpm format`.\n- **Linter:** Two layers. `apps/web` runs **ESLint 9** via a flat config (`apps/web/eslint.config.mjs`, `eslint-config-next@16`); Next 16 removed `next lint`, so `pnpm lint` calls the ESLint CLI directly. A **root `.eslintrc.cjs` is a reference config that is not installed and not active** until a workspace adds ESLint + `extends: [\"../../.eslintrc.cjs\"]` (`.eslintrc.cjs:10-18`); `@careeros/api` has no working flat config and is excluded from the CI lint job. CI also runs the API typecheck, unit/integration tests, and Playwright (`.github/workflows/pr.yml`).\n- **Most relevant enforced rules (root chain, when adopted):**\n  1. `no-console: error` in production code (allow `warn`/`error`; tests/scripts/seeds exempt) — observability spec.\n  2. `no-restricted-syntax` on `CallExpression[callee.property.name='chat']` — raw `provider.chat()` is forbidden outside `packages/ai`; use `chatStructured()` with a Zod schema per `plan/ai-safety.md` item 2.\n  3. `data-testid` must be a string literal, never an interpolated expression — per `plan/testing.md`.\n- **TypeScript strictness (enforced by `tsconfig.base.json`):** `strict`, `noImplicitAny`, `strictNullChecks`, `exactOptionalPropertyTypes`, `noUncheckedIndexedAccess`, `noImplicitOverride`. `any` is disallowed unless justified inline.\n- **Commands:** `pnpm lint` (turbo), `pnpm typecheck` (turbo), `pnpm format`.\n- **Pre-commit:** `lefthook.yml` runs gitleaks (best-effort), workspace typecheck, and per-workspace lint on staged TS. Binary must be on PATH; hooks degrade gracefully.\n\n### 3) Import and Module Conventions\n\n- **Cross-workspace imports** use the `@careeros/*` package name (declared `workspace:*`); there are **no path aliases** in `tsconfig.base.json`, so imports like `@/foo` do not exist.\n- **Intra-workspace imports** are relative. NestJS modules import sibling files by relative path (`./session.service`).\n- **Barrel policy:** each package exposes `src/index.ts`. `@careeros/shared` also exposes explicit subpaths — `./schemas`, `./constants`, `./redact`, `./retry`, `./net` (`packages/shared/package.json` exports). `./net` is intentionally excluded from the barrel (`packages/shared/src/index.ts:18-19`).\n- **Adapter rule:** never import an adapter from `apps/web` directly — go through a stable interface in `packages/` (`AGENTS.md` §5).\n- **Reuse before rewrite:** check `packages/ui`, `packages/shared`, shadcn, lucide, stdlib first (`AGENTS.md` §6).\n\n### 4) Error and Logging Conventions\n\n- **Error strategy by layer:** NestJS services throw typed domain errors; global `LockoutExceptionFilter` maps `LockoutError` to HTTP 429 with `Retry-After` (`apps/api/src/common/filters/lockout.filter.ts`, registered `apps/api/src/main.ts:91`). Zod schemas validate at every trust boundary via `ZodValidationPipe`. `packages/sandbox` deliberately never throws — failures return `status: 'crash'`.\n- **Logging:** all application logging goes through `pino` (JSON in prod, `pino-pretty` in dev). `console.log` is forbidden in application code (root lint rule; observability spec). Required stable context keys: `user_id`, `request_id`, `agent_role`, `prompt_id`, `prompt_hash`, `provider`, `model`, `job_id`, `duration_ms` (`plan/observability.md` §Logging).\n- **Redaction:** `packages/shared/src/redact.ts` runs before log writes and Sentry `beforeSend`; redacts `Authorization`, `Cookie`, `api_key`, `token`, `password`, `refresh_token`, `client_secret`, AWS-style keys.\n- **Retry/backoff:** all external calls go through `packages/shared/retry.ts` — exponential with full jitter, base 500ms, factor 2, max 30s, 3 attempts; `429` respects `Retry-After`; non-429 `4xx` fails fast; circuit breaker at 5 consecutive failures per (provider, endpoint) (`AGENTS.md` §6).\n- **Timezone:** all timestamps stored UTC (`timestamptz`); user timezone in `user_prefs.timezone`; render with `Intl.DateTimeFormat(user.timezone)` client-side; never format server-side (`AGENTS.md` §6).\n\n### 5) Testing Conventions\n\n- **Test file naming/location:** unit tests are colocated `foo.ts` + `foo.test.ts`; integration tests are `*.integration.test.ts`; e2e are `*.spec.ts` under `apps/web/e2e/`; LLM evals are `packages/ai/src/evals/**/*.eval.ts`; contract tests are `*.contract.test.ts`. Vitest include globs: `packages/**/src/**/*.test.ts`, `apps/**/src/**/*.test.ts`, `scripts/**/*.test.ts` (`vitest.config.ts`).\n- **Mocking strategy:** prefer real integration tests via Testcontainers over deep mocks (`CONTRIBUTING.md`); `msw` for external HTTP in unit tests only; never mock the DB in integration tests.\n- **Coverage expectation:** **no coverage percentage target.** Behavior coverage is the rule — every phase checkbox has at least one verifying test. `retries: 0` in e2e; flakes are treated as bugs.\n- **`fast-check`** for property-based tests on math-heavy paths (aggregator, priority formula, dedupe).\n- **Ponytail rule:** any non-trivial module (branch, loop, parser, money/security path) leaves one runnable check (`AGENTS.md` §6).\n\n### 6) Evidence\n\n- `AGENTS.md` §6, §7, §9, §10; `CONTRIBUTING.md`\n- `tsconfig.base.json`, `.prettierrc`, `.eslintrc.cjs`, `lefthook.yml`, `vitest.config.ts`\n- `plan/observability.md`, `plan/testing.md`, `plan/security.md`\n- `packages/shared/src/{retry,redact}.ts`, `apps/api/src/common/filters/lockout.filter.ts`\n\n## Extended Sections\n\n### Repo-specific commit / slice conventions\n\n- Branch off `main`/`master`; keep diffs small; if a change exceeds ~400 lines across many files, split into named slices (e.g. `C-P1.5a`, `F.11c`) (`CONTRIBUTING.md` §Making a change).\n- Commit subject + body describing the **why**; sign with `gitsign` when configured.\n- No em dashes in user-facing strings (memory-enforced rule, `CONTRIBUTING.md`).\n- Never commit generated files (`dist/`, `.d.ts`, `.js.map`) outside intentional artifacts.\n- Never touch `plan/_audit_*.md` (historical audit records).\n\n### Known convention violations / drift\n\n- The root ESLint chain is **still not active** in any workspace that hasn't opted in (`.eslintrc.cjs:10-13`), so the three cross-cutting rules are not universally enforced today. `apps/web` ships its own eslint 9 flat config and is the only workspace gated in CI.\n- T29 is **resolved**: `react-hooks/set-state-in-effect` is back to `error` in `apps/web/eslint.config.mjs`, and the `useApi` hook (`apps/web/src/lib/use-api.ts`) backs 19 panels so fetch-on-mount no longer sets state inside the effect synchronously.\n- `AGENTS.md` §5 lists a `packages/storage` and `packages/github` that do not exist as packages; storage lives at `apps/api/src/common/storage.service.ts` and GitHub logic lives in `apps/api/src/modules/integrations/github/` plus `apps/worker/src/github-sync.ts`.\n- `docs/dev-setup.md` now labels the remaining unwired commands (`pnpm seed:dev`, `pnpm ai:probe`) as \"planned\" rather than presenting them as available. See `CONCERNS.md`.\n"},{"id":"integrations","title":"External Integrations","md":"\n# External Integrations\n\nCareer OS integrates with LLM, code-host, job-source, messaging, and email systems — all behind a deny-by-default egress proxy. Datastores run on a private Docker network, and nginx is the single public TLS entrypoint.\n\n## Core Sections (Required)\n\n### 1) Integration Inventory\n\n| System | Type | Purpose | Auth model | Criticality | Evidence |\n|--------|------|---------|------------|-------------|----------|\n| DeepSeek API | HTTP (OpenAI-compatible) | Default LLM: skill extract, grading, resume/cover-letter, market brief, dossier, email classify | Per-install API key, encrypted at rest | High | `packages/ai/src/providers/deepseek.ts`, `packages/ai/src/pricing.ts` |\n| OpenAI / OpenRouter / any OpenAI-compatible | HTTP | Alternate/backup LLM providers via one `openai-compatible.ts` adapter | Encrypted API key + optional per-user base URL (SSRF-gated) | Medium | `packages/ai/src/providers/openai-compatible.ts`, `create.ts` |\n| Ollama (local) | HTTP (`/api/chat`) | Last-resort local LLM fallback; never leaves the host | Local endpoint, no key | Low | `packages/ai/src/providers/ollama.ts` |\n| GitHub | REST (Octokit) | Repo list + sync, commit analysis for skill evidence | PAT (OAuth optional); scope-gated to `repo`/`public_repo`/`read:user`/`user:email` | High | `apps/worker/src/github-sync.ts`, `apps/api/src/modules/integrations/github/github.service.ts` |\n| GitLab | REST | Public + self-hosted repo sync (PAT) | PAT + per-user host allowlist via `assertPublicUrl` | Medium | `apps/worker/src/gitlab-sync.ts`, `packages/shared/src/net/assert-public-url.ts` |\n| Ashby / Greenhouse | ATS REST | Verified job source (highest trust tier) + ATS submission | Public boards (no auth); submission via API later | High | `packages/job-pipeline/src/adapters/`, `apps/api/src/modules/ats-submit/adapters/` |\n| Workday / Lever / SmartRecruiters / Workable / iCIMS / SuccessFactors | ATS/career-site adapters | Direct crawl of public company career sites and ATS boards (owner decision U6) | Public boards; config/credentials per source (env) | Medium–High | `packages/job-pipeline/src/adapters/{workday,lever,smartrecruiters,workable,icims,successfactors}/` |\n| Firecrawl | Managed scrape/search/crawl (`api.firecrawl.dev/v1`) | Public career-site / ATS discovery, preferred over direct crawl | `FIRECRAWL_API_KEY` (optional; encrypted at rest) | Medium | `packages/firecrawl/src/client.ts`, `packages/job-pipeline/src/adapters/firecrawl/`, `docs/job-sources.md` |\n| Adzuna / Remotive / Arbeitnow | Aggregator REST | Aggregator job sources (tier 2) | API key (Adzuna) / none | Medium | `packages/job-pipeline/src/adapters/`; `plan/PLAN.md:20` |\n| JSearch / Serpapi (optional) | Paid partner API | LinkedIn/Indeed via legitimate partners | API key | Low (optional) | `plan/PLAN.md:20`, `docs/architecture.md` §2 |\n| Slack | Web API + Events API | Daily brief, slash commands, interactive approvals | OAuth bot token + request signing (HMAC) | Medium | `apps/api/src/modules/slack/`, `infra/slack/manifest.yml` |\n| Gmail | Google OAuth + Pub/Sub | Email alert ingest, inbox triage | OAuth `gmail.readonly` + watch/push | Medium | `apps/api/src/modules/gmail/`, `apps/worker/src/gmail-watch-renewal.worker.ts` |\n| Qdrant | Vector DB | Semantic search over verified/user content | Private network, no public auth in MVP | Medium | `packages/embeddings/src/qdrant.ts` |\n| MinIO | Object storage | Resumes, generated artifacts, agent screenshots | Root credentials + per-user signed URLs | High | `apps/api/src/common/storage.service.ts`, `infra/docker/docker-compose.yml` |\n| Squid | Forward proxy | Deny-by-default egress allowlist | Network policy | High | `infra/docker/squid/squid.conf` |\n| nginx | Reverse proxy + TLS | Public entrypoint: terminates TLS, ACME HTTP-01, routes `/`→web, `/api/*`→api (prefix stripped) | Network policy; self-signed or Let's Encrypt cert | High | `infra/nginx/nginx.conf`, `infra/nginx/templates/careeros.conf.template` |\n| certbot | ACME client | Renews issued Let's Encrypt certs every 12h into the shared volume | `ACME_EMAIL`; operator issues first cert | Medium | `infra/docker/docker-compose.yml` (certbot service) |\n| GlitchTip | Error tracking (Sentry-compatible) | Self-hosted error capture (all-in-one, profile `ops`/`observability`) | `SENTRY_DSN`/`GLITCHTIP_DSN`; blank = SDK no-op | Low | `apps/api/src/common/sentry.ts`, `apps/worker/src/sentry.ts`, `docs/observability.md`, `infra/docker/docker-compose.yml` |\n| whisper.cpp | Local speech-to-text HTTP server | P2 verbal defense + P6 talk-track transcription (profile `speech`) | Private network via `WHISPER_URL`; blank = client inert | Medium | `packages/stt/`, `infra/docker/Dockerfile.whisper`, `docs/stt.md` |\n| Desktop / mobile clients | WSS + REST | Desktop agent pairing/execution; mobile read-only companion | Device-code pairing → JWT + refresh; `expo-secure-store`/keychain | Medium | `apps/desktop/src/wss-client.ts`, `apps/mobile/src/lib/auth.tsx`, `apps/api/src/modules/{agent,mobile}/` |\n\n### 2) Data Stores\n\n| Store | Role | Access layer | Key risk | Evidence |\n|-------|------|--------------|----------|----------|\n| Postgres 16 | System of record (56 models, 40 migrations, append-only `jobs_raw`/`audit_events`/`llm_calls`/`llm_injection_log`) | Prisma 6 (`apps/api`, `apps/worker`, `@careeros/aggregator`) | AppConfig not yet user-scoped (multitenant TODO) | `apps/api/prisma/schema.prisma`, `apps/api/package.json`, `apps/worker/package.json`, `packages/aggregator/package.json` |\n| Redis 7 | BullMQ queues, throttler store, cache | `ioredis`, BullMQ | Queue loss if Redis down (documented degradation) | `apps/worker/src/main.ts`, `apps/api/src/modules/auth/auth.module.ts` |\n| Qdrant | Vector index (semantic content) | `@qdrant/js-client-rest` via `QdrantStore` | Vectors are semantic when `EMBEDDING_MODE=local` and weights are available; pre-switch vectors are deterministic and need re-embedding | `packages/embeddings/src/{provider.ts,qdrant.ts}`, `apps/worker/src/embedding-job.ts` |\n| MinIO | Files (resumes, PDFs, screenshots) | `minio` SDK wrapped in `StorageService` | Credentials must be strong; presign TTL 5 min | `apps/api/src/common/storage.service.ts` |\n| Local filesystem (agent) | Playwright profile, screenshots, logs | `keytar`, `fs` | Screenshot/log retention bounded to 30d/10MB/14d | `apps/desktop/src/screenshot-cleanup.ts`, `log-rotation.ts` |\n\n### 3) Secrets and Credentials Handling\n\n- **Credential sources:** environment variables for boot/master secrets (`ENCRYPTION_KEY`, `SESSION_SECRET`, datastore passwords) and AES-256-GCM-encrypted DB rows for per-integration secrets (`EncryptedSecret`, `Integration`, `ProviderConfig`). Master key must be 64-char hex or 44-char base64 (`packages/secrets/src/master-key.ts`); field encryption uses HKDF subkeys with AAD context (`packages/secrets/src/field.ts`).\n- **Hardcoding checks:** `.gitleaks.toml` + `gitleaks.yml` CI + lefthook pre-commit; `startup-check.ts` refuses known-weak values (`careeros`, `minioadmin`, `changeme`, …) and <24-byte datastore creds.\n- **Rotation lifecycle:** master `ENCRYPTION_KEY` rotation is **implemented** (Wave C). `POST /me/security/rotate-key` (session + fresh re-auth via `SensitivityGateService.hasFreshReauth`) runs `MasterKeyRotationService`, which walks every `encrypted_secrets` row and every `enc:v1:`-prefixed `ENCRYPTED_FIELDS` value one transaction per row using the pure, idempotent `rotateMasterKey` primitive (`packages/secrets/src/rotation.ts`). It stops at the first row neither key can decrypt and reports `{scanned, rotated, alreadyRotated, skippedPlaintext, failed, failure}` without ever returning ciphertext; re-running resumes. On success the operator updates `ENCRYPTION_KEY` and restarts (the endpoint never writes env). OAuth tokens stored encrypted; GitHub PAT scope validation rejects over-broad/`admin:*` scopes (`github.service.ts:55`).\n\n### 4) Reliability and Failure Behavior\n\n- **Retry/backoff:** shared `packages/shared/retry.ts` — exponential with full jitter, base 500ms, factor 2, max 30s, 3 attempts; `429` honours `Retry-After`; non-429 `4xx` fails fast; circuit breaker at 5 consecutive failures per (provider, endpoint), 60s open, half-open probe (`AGENTS.md` §6).\n- **Timeout policy:** DeepSeek provider enforces `max_tokens` (default 4096) and SSRF-guarded fetches; health checks use 500ms per dependency with a 5s cache (`plan/observability.md`); agent navigation timeout 30s (`apps/desktop/src/task-runner.ts`).\n- **Circuit-breaker/fallback:** implemented (DeepSeek/OpenAI-compatible → configured backup → Ollama last-resort) in `packages/ai/src/providers/fallback.ts` + `apps/api/src/common/provider-loader.service.ts`; 5 consecutive availability failures → 60s open → half-open probe, with a `providerStatus` degraded badge. Circuit state is in-process (move to Redis for multi-replica).\n- **Egress control:** api/worker force `HTTP(S)_PROXY=http://squid:3128` with `NO_PROXY` for datastores; Squid denies by default and allows only deepseek/openai/anthropic/openrouter/github/githubusercontent/gitlab/npmjs/github-releases plus **`api.firecrawl.dev`**; denies non-80/443, CONNECT≠443, and local IPs (`infra/docker/squid/squid.conf`). Direct ATS/career-site crawl hosts are deliberately **not** wildcarded — each reviewed host needs an explicit `allowed_dsts` line (`docs/job-sources.md`). Because Node global `fetch` ignores proxy env vars, `installEgressProxy()` (`packages/shared/src/net/proxy-dispatcher.ts`) installs an undici `EnvHttpProxyAgent` at api/worker boot (`apps/api/src/main.ts:97`, `apps/worker/src/main.ts:120`) and fails closed if the proxy is configured but cannot be built (`docs/egress.md`). A manual operator smoke lives at `scripts/smoke/egress.sh` (not run in CI; the live Docker egress smoke is still outstanding).\n- **SSRF gate:** `assertPublicUrl` (DNS-resolved, redirect-revalidated, host allowlist) applies to user-supplied provider/embedding base URLs and self-hosted GitLab (`packages/shared/src/net/assert-public-url.ts`).\n\n### 5) Observability for Integrations\n\n- **Logging around external calls:** yes — `pino`, with `provider`/`model`/`p
