sion convergence, the multi-user timeline, the backup destination, and whether GlitchTip/observability and mobile push/offline are in scope.\n"},{"id":"stack","title":"Technology Stack","md":"\n# Technology Stack\n\nCareer OS is a self-hosted, provider-agnostic Personal AI Career Operating System. It is a pnpm/Turborepo monorepo written almost entirely in TypeScript, with a Next.js web app, a NestJS API, BullMQ workers, an Electron desktop agent, and an Expo (React Native) mobile companion. It is licensed **AGPL-3.0-or-later** (`LICENSE`, root `package.json:5`).\n\n> Evidence for every row below is a committed manifest, config, or source file. `[TODO]` marks unknowable facts; `[ASK USER]` marks intent-dependent ones.\n\n## Core Sections (Required)\n\n### 1) Runtime Summary\n\n| Area | Value | Evidence |\n|------|-------|----------|\n| Primary language | TypeScript (`.ts`/`.tsx`; ~895 source files — 757 `.ts` + 138 `.tsx`; ~112k LOC) | `docs/codebase/.codebase-scan.txt` (CODE METRICS); `tsconfig.base.json` |\n| Runtime + version | Node.js >= 20 (see `.nvmrc`; root `engines.node`) | `package.json:6-8`, `.nvmrc` |\n| Package manager | pnpm 9.12.0 (workspaces) | `package.json:5`, `pnpm-workspace.yaml:1-3` |\n| Module/build system | Turborepo 2 (`turbo run build/typecheck/lint`), per-workspace `tsc`/`nest build`/`next build`/`expo` | `turbo.json:1-21`, `package.json:11-14` |\n| Module format | ESM-ish `module: ESNext` + `moduleResolution: Bundler`; API compiled by Nest CLI, worker run with `tsx`, mobile via Expo/Metro | `tsconfig.base.json:4-5`, `apps/worker/package.json:6` |\n| Workspace layout | `apps/*` + `packages/*` (5 apps, 15 packages) | `pnpm-workspace.yaml:1-3`; `packages/*/package.json` |\n\n### 2) Production Frameworks and Dependencies\n\n| Dependency | Version | Role in system | Evidence |\n|------------|---------|----------------|----------|\n| Next.js | 16.3.6 (pinned) | Web app, App Router, middleware | `apps/web/package.json` |\n| React | ^19.3.0 | Web + UI component runtime | `apps/web/package.json` |\n| NestJS (`@nestjs/common`/`core`) | ^10.4.4 | HTTP API, modules, DI, WebSockets gateway | `apps/api/package.json` |\n| `@nestjs/platform-express` | ^10.4.22 | Express HTTP adapter (raw body for Slack HMAC) | `apps/api/package.json`, `apps/api/src/main.ts:88` |\n| `@nestjs/platform-socket.io` + `socket.io` | ^10.4.4 / ^4.8.1 | Desktop-agent WSS pairing/task channel | `apps/api/package.json`, `apps/api/src/modules/agent/agent.gateway.ts` |\n| Prisma + `@prisma/client` | ^6.19.3 (**aligned** across api, worker, and `@careeros/aggregator`) | ORM + migrations (56 models, 0 enums, 40 migrations) | `apps/api/package.json`, `apps/worker/package.json`, `packages/aggregator/package.json`, `apps/api/prisma/schema.prisma` |\n| `@nestjs/swagger` + `@asteasolutions/zod-to-openapi` | ^7.4.2 / ^7.3.4 | OpenAPI JSON at `/api/openapi.json` + Swagger UI at `/api/docs`, generated from the shared Zod schemas | `apps/api/package.json`, `apps/api/src/main.ts:125-142`, `apps/api/src/openapi/openapi.ts` |\n| `undici` | ^6 | Egress enforcement: installs an `EnvHttpProxyAgent` as the process-global `fetch` dispatcher at api/worker boot so Squid actually gates Node global `fetch` | `packages/shared/package.json`, `packages/shared/src/net/proxy-dispatcher.ts`, `apps/api/src/main.ts:97`, `apps/worker/src/main.ts:120` |\n| PostgreSQL | 16-alpine (digest-pinned) | System of record | `infra/docker/docker-compose.yml` |\n| Redis + BullMQ | redis:7-alpine / `bullmq ^5.13.0` | Queues, cache, rate-limit store | `infra/docker/docker-compose.yml`, `apps/worker/package.json` |\n| Qdrant client | `@qdrant/js-client-rest ^1.12.0` | Vector store for semantic content | `packages/embeddings/package.json` |\n| MinIO client | `minio ^8.0.2` | Object storage (resumes, artifacts, screenshots) | `apps/api/package.json`, `apps/api/src/common/storage.service.ts` |\n| `argon2` | ^0.41.1 | Argon2id password hashing | `packages/auth/package.json:13` |\n| `iron-session` | ^8.0.3 | Sealed session cookie (`__Host-*`, AES-256-GCM) | `apps/api/package.json`, `packages/auth/src/session.ts` |\n| `@simplewebauthn/server` | ^11 | Passkey / WebAuthn MFA | `apps/api/package.json` |\n| `helmet` | ^8.0.0 | Security headers + CSP nonce | `apps/api/src/main.ts:5,13-80` |\n| `@nestjs/throttler` + `@nest-lab/throttler-storage-redis` | ^6.4.0 / ^1.2.0 | Redis-backed rate limiting | `apps/api/package.json`, `apps/api/src/modules/auth/auth.module.ts:21-31` |\n| `zod` | ^3.23.8 | Trust-boundary validation (HTTP + LLM structured output) | `packages/shared/package.json`, `apps/api/src/common/pipes/zod-validation.pipe.ts` |\n| `pino` + `nestjs-pino` | ^9.5.0 / ^4.1.0 | Structured JSON logging | `apps/api/package.json`, `plan/observability.md` |\n| `prom-client` | ^15.1.3 | Prometheus metrics on `/metrics` | `apps/api/package.json`, `apps/api/src/common/metrics/` |\n| `@slack/web-api` | ^7.11.0 | Slack daily-assistant integration | `apps/api/package.json` |\n| `googleapis` + `google-auth-library` | ^144.0.0 / ^9.15.0 | Gmail OAuth, watch, push ingest | `apps/api/package.json` |\n| `@octokit/rest` | ^21.1.0 | GitHub repo sync in workers | `apps/worker/package.json` |\n| `@react-pdf/renderer` + `docx` | ^4.9.0 / ^9.5.1 | Resume/cover-letter PDF + DOCX rendering | `packages/resume-render/package.json` |\n| `electron` + `electron-updater` + `playwright-core` + `keytar` | ^31.3.1 / ^6.3.9 / ^1.47.2 / ^7.9.0 | Desktop companion agent | `apps/desktop/package.json` |\n| `expo` + `expo-router` + `expo-secure-store` + `react-native` | ~57.0 / ~57.0.24 / ~57.0.4 / 0.86.3 (React 19.2.3) | Mobile companion app (iOS/Android); per-device token in the OS keychain | `apps/mobile/package.json`, `apps/mobile/app.json` |\n| `@xenova/transformers` | ^2.17.2 | Local semantic embeddings (`Xenova/bge-small-en-v1.5`, 384-d) loaded lazily; deterministic SHA-256 fallback | `packages/embeddings/package.json`, `packages/embeddings/src/provider.ts` |\n| `js-tiktoken` | ^1.0.21 | Pre-flight prompt-token estimation for cost caps + `LlmCall.estimatedPromptTokens` | `packages/ai/package.json`, `packages/ai/src/tokenize.ts` |\n| `cheerio` | ^1.0.0 | Email-alert HTML parsing | `packages/email-parsers/package.json` |\n\n**Notable production choices and reality checks**\n\n- **Provider adapters ship for DeepSeek, OpenAI/OpenRouter, and local Ollama:** `packages/ai/src/providers/` holds `deepseek.ts`, `openai-compatible.ts` (shared by OpenAI + any OpenAI-compatible base URL), `ollama.ts` (native `/api/chat`, `prompt_eval_count`/`eval_count`), plus `fallback.ts` (5-failure/60s-open circuit breaker → primary → backup → Ollama last-resort) and `create.ts` (`createProvider`/`registerBuiltinProviders`). All are chat-only on the `AIProvider` surface (structured output yes; streaming/tools/embeddings no; Anthropic/Azure still absent). See `packages/ai/src/provider.ts`, `registry.ts`, `providers/`.\n- **Embeddings are now a real provider seam (Wave B):** `packages/embeddings/src/provider.ts` selects `EMBEDDING_MODE` — `local` (default) lazy-loads `Xenova/bge-small-en-v1.5` through `@xenova/transformers` into `EMBEDDING_MODEL_CACHE_DIR`, `deterministic` is the offline SHA-256 fallback in `local.ts` (unchanged, 384-d), and `external` is a pluggable hosted adapter with none shipped. `local` is wrapped in `FallbackEmbeddingProvider`, so an offline/missing model degrades to deterministic with a warning and reports the effective mode (never a stale `bge-small-en` claim). The worker's `embedding.generate` job and `POST /embeddings/reembed` use the same seam.\n- **Per-call LLM audit + injection audit are wired (Wave C):** `makeLlmAuditor` writes one `LlmCall` (`llm_calls`: prompt id/hash, sensitivity, tokens via `js-tiktoken` pre-flight + provider `usage`, cost split, latency, validation verdict) through a bounded queue that drops loudly; `InjectionAuditModule` persists `LlmInjectionLog` (`llm_injection_log`) rows for every suspect/blocked wrap-or-scan hit. See `apps/api/src/common/{llm-audit.ts,injection-log.ts,injection-audit.module.ts}`, `packages/ai/src/tokenize.ts`.\n- **Master-key rotation is implemented (Wave C):** pure `rotateMasterKey(old, new, ctx)` in `@careeros/secrets` re-encrypts both `encrypted_secrets` rows and `enc:v1:` field values, idempotently (already-rotated rows are skipped on resume). `MasterKeyRotationService` walks them one transaction per row; `POST /me/security/rotate-key` is session + fresh-re-auth gated. See `packages/secrets/src/rotation.ts`, `apps/api/src/modules/me/master-key-rotation.service.ts`.\n- **Swagger/OpenAPI is now real** (cleanup task U1): `@nestjs/swagger` (^7.4.2) + `@asteasolutions/zod-to-openapi` (^7.3.4) are declared and `apps/api/src/main.ts` serves the OpenAPI document at `/api/openapi.json` and Swagger UI at `/api/docs` (behind an auth gate in production). The old \"no swagger dependency\" caveat no longer applies.\n- **Prisma is one major across the workspace** (cleanup T11): api, worker, and `@careeros/aggregator` all use `@prisma/client`/`prisma` `^6.19.3`. `apps/api` wires `postinstall: prisma generate` (plus `prebuild`) so a clean install generates the client.\n\n### 3) Development Toolchain\n\n| Tool | Purpose | Evidence |\n|------|---------|----------|\n| Turborepo 2.11.2 | Task orchestration + cache | `package.json`, `turbo.json` |\n| TypeScript 5.9.3 (^5.6.3) | Strict compilation (`strict`, `exactOptionalPropertyTypes`, `noUncheckedIndexedAccess`) | `tsconfig.base.json` |\n| Prettier 3.9.8 + `prettier-plugin-tailwindcss` | Formatting | `.prettierrc` |\n| **ESLint 9** in `apps/web` (`eslint.config.mjs`, `eslint-config-next@16`); root `.eslintrc.cjs` is still a dormant reference config | Web lint: Next core-web-vitals + TypeScript rules; cross-cutting `no-console`/raw-`chat()`/literal-`data-testid` rules live in the root config, not yet adopted by workspaces | `.eslintrc.cjs`, `apps/web/package.json`, `apps/web/eslint.config.mjs` |\n| Vitest 5 | Unit + integration runner | `vitest.config.ts`, `package.json` |\n| Testcontainers 10.28 | Real Postgres/Redis/Qdrant/MinIO for integration tests | `packages/testing/package.json`, `packages/testing/src/index.ts` |\n| Playwright 1.63 | E2E, a11y, visual | `apps/web/playwright.config.ts`, `apps/web/e2e/` |\n| `fast-check` 4.10 | Property-based tests | `package.json`, `packages/testing/src/index.ts` |\n| `msw` 2.15 | External HTTP mocks (unit) | `packages/testing/src/index.ts` |\n| `@axe-core/playwright` 4.10 | WCAG 2.1 AA checks | `apps/web/package.json` |\n| lefthook | Pre-commit gitleaks + typecheck + lint | `lefthook.yml`, `package.json:10` |\n| ESLint (dormant root chain) | Cross-cutting rules; requires workspaces to opt in | `.eslintrc.cjs:10-18` |\n\n### 4) Key Commands\n\n```bash\npnpm install                       # install all workspace deps\npnpm docker:up                     # build shared pkgs + start full compose stack\npnpm migrate                       # prisma migrate deploy\npnpm dev                           # turbo run dev --parallel (api + web + worker)\npnpm build                         # turbo run build\npnpm typecheck                     # turbo run typecheck\npnpm lint                          # turbo run lint\npnpm test                          # vitest run (unit + integration)\npnpm test:unit                     # excludes integration + e2e\npnpm test:integration              # vitest run integration.test\npnpm test:e2e                      # @careeros/web Playwright\npnpm test:evals                    # @careeros/ai LLM evals (EVAL_MOCK=1 default)\nmake help                          # shortcut help (Makefile)\n```\n\n### 5) Environment and Config\n\n- **Config sources:** `.env` (copied from `.env.example`), `apps/api/prisma/schema.prisma`, `apps/web/next.config.mjs`, `apps/web/tailwind.config.ts`, `apps/mobile/app.json`, `infra/docker/docker-compose.yml`, `infra/nginx/nginx.conf` + `infra/nginx/templates/careeros.conf.template`, per-workspace `tsconfig.json`, `packages/ui/src/tokens.css`.\n- **Required env vars** (from `.env.example`): `POSTGRES_USER`, `POSTGRES_DB`, `POSTGRES_PASSWORD`, `DATABASE_URL`, `REDIS_URL`, `QDRANT_URL`, `MINIO_ROOT_USER`, `MINIO_ROOT_PASSWORD`, `MINIO_BUCKET`, `ENCRYPTION_KEY`, `SESSION_SECRET`, `API_PORT`, `WEB_PORT`, `WEB_URL`, `API_URL`, `TRUSTED_ORIGINS`, `SESSION_TTL_HOURS`. Optional/gated: `DEEPSEEK_API_KEY`, `FIRECRAWL_API_KEY`, `EMBEDDING_MODE` (+ `EMBEDDING_MODEL_CACHE_DIR`), `LOG_LEVEL`, `LOG_DEBUG`, `NEXT_TELEMETRY_DISABLED`, public-entrypoint `SERVER_NAME`/`HTTP_PORT`/`HTTPS_PORT`/`TLS_CERT_PATH`/`TLS_KEY_PATH`/`HSTS_MAX_AGE`/`ACME_EMAIL`, and backup `AGE_RECIPIENT`.\n- **Boot-time enforcement:** `apps/api/src/startup-check.ts` refuses to start on missing/weak `ENCRYPTION_KEY`, `SESSION_SECRET`, or datastore credentials (<24 bytes or known-weak). Compose interpolates `${VAR:?...}` so a missing password aborts the stack.\n- **Deployment/runtime constraints:** Docker Compose on a VPS; api/worker reach the internet only through an allowlisting Squid proxy; datastores on an `internal: true` network. All three app containers (api, worker, web) run `read_only` with a `tmpfs` scratch area, `cap_drop: ALL` (worker/web hold no caps), and `no-new-privileges:true` (`infra/docker/docker-compose.yml`). `undici`/`EnvHttpProxyAgent` enforces the proxy for Node global `fetch` (`apps/api/src/main.ts:97`, `apps/worker/src/main.ts:120`). **nginx is now present** (`infra/nginx/`) and is the only service publishing host ports (80/443), terminating TLS, redirecting `:80`→`:443` (except `/healthz` + ACME challenge), and routing `/`→web and `/api/*`→api; `certbot` renews every 12h, and an `ops`-profiled `backup` sidecar (`infra/docker/Dockerfile.backup`) writes age-encrypted artifacts. See `INTEGRATIONS.md` and `infra/nginx/README.md`.\n\n### 6) Evidence\n\n- `package.json` (AGPL-3.0-or-later), `pnpm-workspace.yaml`, `pnpm-lock.yaml`, `turbo.json`, `tsconfig.base.json`, `.nvmrc`\n- `apps/*/package.json`, `packages/*/package.json` (including `apps/mobile/`, `packages/aggregator/`, `packages/firecrawl/`)\n- `.env.example`, `infra/docker/docker-compose.yml`, `infra/docker/Dockerfile.backup`, `infra/nginx/`, `apps/api/src/startup-check.ts`\n- `apps/api/src/main.ts` (Swagger + egress + token-cap filter), `apps/worker/src/main.ts` (egress boot), `packages/shared/src/net/proxy-dispatcher.ts`\n- `packages/embeddings/src/provider.ts`, `packages/ai/src/tokenize.ts`, `packages/secrets/src/rotation.ts`, `apps/api/src/common/{llm-audit.ts,injection-log.ts}`\n- `docs/codebase/.codebase-scan.txt` (DIRECTORY TREE, STACK DETECTION, CODE METRICS)\n\n## Extended Sections\n\n### Docker base images (digest-pinned)\n\n`infra/docker/docker-compose.yml`: `postgres:*`, `redis:*`, `qdrant/qdrant:v1.12.4`, `bitnamilegacy/minio`, `ubuntu/squid:6.10`, `nginx:alpine`, `certbot/certbot`, plus locally built `api`/`worker`/`web` images and the `ops`-profiled `backup` sidecar built from `infra/docker/Dockerfile.backup` (alpine + age/`mc`/`pg_dump`). `scripts/verify-image-pins.sh` fails CI if a floating tag is reintroduced (security spec item 10).\n\n### Shared-package dependency graph (production deps only)\n\n`@careeros/shared` (zod) is the base; `@careeros/ai`, `@careeros/job-pipeline`, `@careeros/email-parsers`, `@careeros/browser-agent`, `@careeros/firecrawl`, and `@careeros/aggregator` depend on it; `@careeros/embeddings` (Qdrant + `@xenova/transformers`) and `@careeros/resume-render` (React-PDF/docx) are leaf capabilities; `@careeros/messaging`, `@careeros/secrets`, `@careeros/auth`, `@careeros/sandbox`, `@careeros/ui`, `@careeros/testing` are independent. `@careeros/aggregator` (skill-state sync; type-only Prisma import) is consumed by both `apps/api` and `apps/worker`; `@careeros/firecrawl` (Firecrawl search/scrape/crawl client) is consumed by the worker and the job-pipeline adapter. `apps/api` and `apps/worker` compose all of the above; `apps/mobile` is standalone (no workspace deps — REST only). See `STRUCTURE.md` for the diagram.\n"},{"id":"structure","title":"Codebase Structure","md":"\n# Codebase Structure\n\nCareer OS is a pnpm + Turborepo monorepo with five applications and fifteen shared packages. There is no path-alias indirection: cross-workspace imports use the `@careeros/*` package names declared in each `package.json`; within a workspace imports are relative.\n\n## Core Sections (Required)\n\n### 1) Top-Level Map\n\n| Path | Purpose | Evidence |\n|------|---------|----------|\n| `apps/web/` | Next.js 16 App Router user app: setup wizard, dashboard, arena, market, jobs, settings, devices | `apps/web/src/app/**/page.tsx`; `apps/web/package.json` |\n| `apps/api/` | NestJS HTTP API: 41 feature-module directories (49 modules registered in `app.module.ts`), Prisma data layer, WebSockets gateway, seed data | `apps/api/src/app.module.ts`; `apps/api/src/modules/` |\n| `apps/worker/` | BullMQ workers on Redis (sync, embedding, retention, market snapshot, Gmail watch, selector health, corpus refresh) | `apps/worker/src/main.ts`; `apps/worker/src/*.worker.ts` |\n| `apps/desktop/` | Electron desktop companion agent (Playwright + user's Chrome, WSS pairing, tray/pairing UI) | `apps/desktop/src/main.ts`; `apps/desktop/renderer/pair.html` |\n| `apps/mobile/` | Expo (React Native SDK 57) mobile companion — read-only daily brief, jobs, approvals, settings; `expo-router` + `expo-secure-store` | `apps/mobile/package.json`, `apps/mobile/src/app/` |\n| `packages/ai/` | `AIProvider` abstraction, DeepSeek/OpenAI-compatible/Ollama adapters + fallback, versioned prompts, tokenizer, grounding/injection/sensitivity, evals | `packages/ai/src/` |\n| `packages/shared/` | Zod schemas, constants, knowledge rules, queues, retry, redact, git-analysis, SSRF guard | `packages/shared/src/` |\n| `packages/job-pipeline/` | Source-agnostic job ingestion funnel: stages + adapters (`ashby`, `greenhouse`, `adzuna`, `arbeitnow`, `remotive`, `firecrawl`, `workday`, `lever`, `smartrecruiters`, `workable`, `icims`, `successfactors`) | `packages/job-pipeline/src/stages/`, `packages/job-pipeline/src/adapters/` |\n| `packages/aggregator/` | Single skill-state write path: evidence → `candidate_skill_state` + `skill_state_event` (type-only Prisma import); used by api + worker | `packages/aggregator/src/index.ts` |\n| `packages/firecrawl/` | Firecrawl API client (search/scrape/crawl), Zod-validated, typed errors, retry | `packages/firecrawl/src/` |\n| `packages/embeddings/` | Qdrant store wrapper + embedding provider seam (local `bge-small-en` / deterministic fallback / external) | `packages/embeddings/src/` |\n| `packages/auth/` | Argon2id hashing + sealed session cookie helpers | `packages/auth/src/` |\n| `packages/secrets/` | AES-256-GCM field encryption + master-key validation + rotation primitive | `packages/secrets/src/` |\n| `packages/browser-agent/` | Agent task contract, YAML allowlist, pacing, kill-switch, selector health | `packages/browser-agent/src/` |\n| `packages/email-parsers/` | LinkedIn/Indeed/Naukri alert-HTML parsers | `packages/email-parsers/src/` |\n| `packages/resume-render/` | PDF/DOCX resume + cover-letter rendering and templates | `packages/resume-render/src/` |\n| `packages/sandbox/` | Docker-per-run code execution with resource/kill limits | `packages/sandbox/src/` |\n| `packages/messaging/` | Transport-free `Channel` interface + `ChannelRegistry` (Slack/Web registered at runtime) | `packages/messaging/src/` |\n| `packages/ui/` | Design-system primitives, tokens, layout | `packages/ui/src/` |\n| `packages/testing/` | Testcontainers harness, MSW handlers, axe, arbitraries | `packages/testing/src/index.ts` |\n| `infra/` | Docker Compose + per-service Dockerfiles (incl. `Dockerfile.backup`), nginx reverse proxy + TLS templates, Postgres init, Squid config, Slack manifest | `infra/docker/`, `infra/nginx/`, `infra/postgres/`, `infra/slack/` |\n| `plan/` | Living implementation plan, per-phase checklists, cross-cutting specs (security, ai-safety, testing, observability, release) | `plan/PLAN.md` and siblings |\n| `docs/` | Operator docs + authoritative product blueprint (`.docx`) | `docs/architecture.md`, `docs/*.docx` |\n| `careeros-screens/` | 60+ static HTML wireframes (information architecture only, not final design) | `careeros-screens/index.html` |\n| `scripts/` | Backup/restore, verification gates, browser-agent probes, smoke tests | `scripts/` |\n| `.github/workflows/` | 9 CI/CD workflows | `.github/workflows/` |\n| `AGENTS.md` | Durable agent/dev rules for the repo | `AGENTS.md` |\n\n### 2) Entry Points\n\n- **Main runtime entry (API):** `apps/api/src/main.ts` — boots after `startup-check.ts`, installs the egress proxy (`installEgressProxy()`), registers global `LockoutExceptionFilter` + `TokenCapExceptionFilter`, helmet security middleware, and serves Swagger UI at `/api/docs` + OpenAPI JSON at `/api/openapi.json` (`apps/api/src/openapi/`).\n- **Web entry:** `apps/web/src/app/layout.tsx` + `apps/web/src/middleware.ts` (setup-state gate + Next security headers/nonce).\n- **Worker entry:** `apps/worker/src/main.ts` — pino + Prisma + heartbeat + Qdrant + seed skills + register workers.\n- **Desktop entry:** `apps/desktop/src/main.ts` (Electron main process, tray + pairing window; renderer `apps/desktop/renderer/pair.html`).\n- **Mobile entry:** `apps/mobile/src/app/_layout.tsx` (expo-router root; `(auth)/sign-in` + `(app)/*` read-only screens).\n- **Secondary entry points:** NestJS `AgentGateway` (`apps/api/src/modules/agent/agent.gateway.ts`); `MobileAuthMiddleware` + `MobileController` (`apps/api/src/modules/mobile/`); scheduled BullMQ repeatables registered in `apps/worker/src/main.ts`; `scripts/backup.sh` / `restore.sh`.\n- **How entry is selected:** root `package.json` scripts drive `turbo run dev`; each workspace declares its own `dev`/`start`; API production start runs `prisma migrate deploy` first (`apps/api/package.json:11`).\n\n### 3) Module Boundaries\n\n| Boundary | What belongs here | What must not be here |\n|----------|-------------------|------------------------|\n| `apps/web` | UI, routing, browser fetch wrapper, middleware gate | Direct imports of adapter/provider packages; server secrets |\n| `apps/api` | HTTP/WS controllers, domain services, Prisma access, guards | Long-running batch jobs (those go to worker); provider SDK calls outside `packages/ai` |\n| `apps/worker` | BullMQ processors, scheduled jobs, external sync | HTTP request handling |\n| `apps/desktop` | Local Playwright execution, keychain, WSS client, OS integration | Server-side business logic; server scraping |\n| `apps/mobile` | Expo/React Native read-only client, secure-store token, REST only | Server-side business logic; write actions (stay on web for now) |\n| `packages/*` | Reusable capability with a stable interface | Feature-specific controller/service logic (belongs in `apps/api`) |\n| `packages/ai` | Provider abstraction, prompts, grounding/safety | Direct DB access (agents write through domain services) |\n\nRule from `AGENTS.md` §5: never import an adapter from `apps/web` directly; go through a stable `packages/` interface. Domain logic lives in `apps/api` NestJS modules.\n\n### 4) Naming and Organization Rules\n\n- **File naming:** `kebab-case` for multi-word files (`zod-validation.pipe.ts`, `agent.jwt-strategy.ts`, `market-snapshot.worker.ts`); React components are `PascalCase.tsx` (`SkillTree.tsx`, `ApprovalQueue.tsx`); hooks/utilities are `camelCase.ts` (`useDrafts.ts`, `api-client.ts`).\n- **Directory organization:** `apps/api` is module/feature-based (`modules/<feature>/<feature>.controller.ts|service.ts|module.ts`); `apps/web` is route-based under `src/app` and feature-based under `src/components/<feature>/`; `packages` are capability-based with a barrel `src/index.ts`.\n- **Bootstrap file inside modules:** modules consistently use `<feature>.module.ts` + `<feature>.controller.ts` + `<feature>.service.ts`, and colocate `<name>.test.ts`.\n- **Import aliases:** no custom `paths` alias in `tsconfig.base.json`; `@careeros/*` is the workspace package name; intra-workspace imports are relative (`../..`).\n- **Barrel policy:** every package exposes a single `src/index.ts`; `@careeros/shared` additionally exposes subpath exports (`./schemas`, `./constants`, `./redact`, `./retry`, `./net`). `./net` is deliberately excluded from the barrel (`packages/shared/src/index.ts:18-19`).\n\n### 5) Evidence\n\n- `apps/api/src/app.module.ts`, `apps/api/src/main.ts`, `apps/api/src/modules/`, `apps/api/src/openapi/`\n- `apps/web/src/app/`, `apps/web/src/components/`, `packages/ui/src/index.ts`, `packages/ui/src/motion.ts`\n- `apps/mobile/src/app/`, `apps/mobile/package.json`, `apps/desktop/renderer/pair.html`\n- `packages/job-pipeline/src/adapters/index.ts` (all registered adapters), `packages/aggregator/src/index.ts`, `packages/firecrawl/src/index.ts`\n- `infra/nginx/`, `infra/docker/Dockerfile.backup`, `pnpm-workspace.yaml`, `turbo.json`, `packages/*/package.json`, `docs/codebase/.codebase-scan.txt` (DIRECTORY TREE)\n\n## Extended Sections\n\n### Workspace dependency diagram\n\n```mermaid\nflowchart TB\n    subgraph apps[\"Applications\"]\n        WEB[\"apps/web<br/>Next.js 16\"]\n        API[\"apps/api<br/>NestJS 10\"]\n        WORKER[\"apps/worker<br/>BullMQ\"]\n        DESKTOP[\"apps/desktop<br/>Electron\"]\n        MOBILE[\"apps/mobile<br/>Expo / RN\"]\n    end\n\n    subgraph pkgs[\"Shared packages\"]\n        SHARED[\"@careeros/shared\"]\n        AI[\"@careeros/ai\"]\n        EMB[\"@careeros/embeddings\"]\n        PIPE[\"@careeros/job-pipeline\"]\n        AGG[\"@careeros/aggregator\"]\n        FIRE[\"@careeros/firecrawl\"]\n        BROWSER[\"@careeros/browser-agent\"]\n        EMAIL[\"@careeros/email-parsers\"]\n        RENDER[\"@careeros/resume-render\"]\n        SANDBOX[\"@careeros/sandbox\"]\n        AUTH[\"@careeros/auth\"]\n        SECRETS[\"@careeros/secrets\"]\n        MSG[\"@careeros/messaging\"]\n        UI[\"@careeros/ui\"]\n        TESTING[\"@careeros/testing\"]\n    end\n\n    WEB --> SHARED\n    WEB --> UI\n    API --> SHARED\n    API --> AI\n    API --> AUTH\n    API --> SECRETS\n    API --> EMB\n    API --> PIPE\n    API --> AGG\n    API --> RENDER\n    API --> SANDBOX\n    API --> MSG\n    WORKER --> SHARED\n    WORKER --> EMB\n    WORKER --> SECRETS\n    WORKER --> BROWSER\n    WORKER --> AGG\n    WORKER --> FIRE\n    DESKTOP --> BROWSER\n    MOBILE -->|REST| API\n\n    AI --> SHARED\n    PIPE --> SHARED\n    PIPE --> FIRE\n    AGG --> SHARED\n    FIRE --> SHARED\n    BROWSER --> SHARED\n    EMAIL --> SHARED\n\n    AUTH -. independent .-> AUTH\n    SECRETS -. independent .-> SECRETS\n    UI -. standalone .-> UI\n    RENDER -. standalone .-> RENDER\n    SANDBOX -. standalone .-> SANDBOX\n    EMB --> QDRANT[(\"Qdrant\")]\n    API --> STORES[(\"Postgres · Redis · MinIO\")]\n    WORKER --> STORES\n```\n\n### Generated vs source boundaries\n\n- Do not document or edit generated output: `dist/`, `.next/`, `apps/*/dist`, `packages/*/dist`, `prisma/generated/`, coverage. `.gitignore` and `.eslintrc.cjs:29-38` both exclude them.\n- `apps/api/prisma/migrations/` **is** committed source (39 migration directories) and must be treated as reviewable code (`AGENTS.md` §6).\n- The product blueprint `docs/*.docx` is the authoritative *product* spec; `docs/architecture.md` is the maintained integration narrative.\n\n### Empty / not-yet-created paths referenced by config\n\nNo dangling config paths remain for the deployment surface: `infra/nginx/` (config, templates, self-signed script, README), `infra/docker/Dockerfile.backup`, and the `ops`-profiled `backup` service now exist, alongside the earlier-resolved `packages/ui/src/motion.ts`, `scripts/dev-host.sh`, `scripts/seed-test.ts`, and `infra/docker/docker-compose.host-dev.yml`. Remaining absent-but-documented services are GlitchTip and `whisper.cpp` (see `CONCERNS.md`).\n"},{"id":"architecture","title":"Architecture","md":"\n# Architecture\n\nCareer OS is a layered, modular monolith plus async workers, a local desktop agent, and an Expo mobile client. Postgres is the source of truth; LLMs never are (`AGENTS.md` §1, `docs/architecture.md` §9).\n\n## Core Sections (Required)\n\n### 1) Architectural Style\n\n- **Primary style:** layered + feature-modular monolith (`apps/api` NestJS modules over a Prisma data layer), with an event/queue side-car (`apps/worker` + BullMQ), an out-of-process agent (`apps/desktop`), and a thin REST mobile client (`apps/mobile`).\n- **Why this classification (evidence):** `apps/api/src/app.module.ts` registers 49 modules — 42 feature modules plus infra (`PrismaModule`, `StorageModule`, `QueueModule`, `SensitivityGateModule`, `ProviderLoaderModule`, `InjectionAuditModule`, `MetricsModule`); each feature module owns controller + service + Prisma access. `apps/worker/src/main.ts` boots independent queue consumers via the shared `registerWorker` helper. `packages/*` hold capability interfaces consumed by both apps; `apps/mobile` is standalone and talks REST only.\n- **Single sources of truth (post-cleanup):** job-match scoring lives once in `packages/job-pipeline/src/stages/match.ts` (`computeMatch` for detail, `computeMatchResult` for the jobs list); provider construction + fallback goes through `ProviderLoaderService` (`apps/api/src/common/provider-loader.service.ts`); sensitivity policy has one authority, `SensitivityGateService` (`apps/api/src/common/sensitivity-gate.service.ts`) over the pure rank primitives in `@careeros/ai`; skill-state sync is `@careeros/aggregator`; embeddings go through one `EmbeddingProvider` seam (`packages/embeddings/src/provider.ts`); master-key rotation is the pure `rotateMasterKey` primitive (`packages/secrets/src/rotation.ts`) driven by `MasterKeyRotationService`. Approval dispatch for an unhandled kind fails loud (audit + `markFailed`) rather than dropping the item.\n- **Primary constraints (evidence):**\n  1. **Evidence over claims** — Postgres evidence graph is authoritative; LLMs interpret only (`AGENTS.md` §1, §11).\n  2. **Privacy/egress control** — server scraping of LinkedIn/Indeed/Naukri/Glassdoor is prohibited; only partner APIs, the user's own agent session, or parsed email alerts (`AGENTS.md` §3.4, §15).\n  3. **Approval + audit for outbound actions** — nothing sends without an approval-queue item and an append-only audit row (`AGENTS.md` §3.3, `apps/api/src/modules/approvals/`).\n\n### 2) System Flow\n\n```text\nBrowser (Next.js) → middleware setup-gate → /api HTTP (NestJS controllers)\n  → domain service (modules/*) → packages/* capability (ai, job-pipeline, secrets…)\n  → Postgres / Qdrant / Redis / MinIO  → response\nNginx (TLS :443) → / → web:3000 · /api/* → api:3001 (prefix stripped)\nExpo mobile app → same REST API (mobile:* bearer, no cookie)\nAsync: API enqueues BullMQ job → apps/worker processor → external API\n  → Postgres evidence/pipeline rows → (optionally) WSS push back to browser\n```\n\nConcretely, a GitHub connect (`docs/architecture.md` §4.2): web `POST /integrations/github/select` → API enqueues `github.sync` → worker lists repos via Octokit → evidence rows → KnowledgeAggregator updates `candidate_skill_state` and appends `skill_state_event` → dashboard reads `/me/skills`.\n\nAn LLM call (`docs/architecture.md` §5.3): build versioned prompt → sensitivity gate → provider fallback chain → `chatStructured<T>({schema})` → Zod validation (one retry) → `llm_calls` audit row → optional fact-check gate before rendering. Untrusted content that trips the wrap/scan boundary additionally writes a `llm_injection_log` row.\n\n### 3) Layer/Module Responsibilities\n\n| Layer or module | Owns | Must not own | Evidence |\n|-----------------|------|--------------|----------|\n| `apps/web` | Routing, middleware gate, feature components, browser fetch/CSRF | Adapter imports, server secrets | `apps/web/src/middleware.ts`, `apps/web/src/lib/api-client.ts` |\n| `apps/api/modules/*` | HTTP/WS endpoints, domain rules, state machines, Prisma access | Provider SDK calls, long batch jobs | `apps/api/src/modules/` |\n| `apps/api/common` | Guards, pipes, filters, storage, metrics, redaction | Feature domain logic | `apps/api/src/common/` |\n| `apps/worker` | Queue processors, cron jobs, external sync | HTTP handling | `apps/worker/src/*.worker.ts`, `main.ts` |\n| `apps/desktop` | Local Playwright, keychain, WSS, OS integration | Server business logic, server-side scraping | `apps/desktop/src/main.ts`, `task-runner.ts` |\n| `apps/mobile` | Read-only mobile UI, secure-store token, REST calls | Server business logic, write actions | `apps/mobile/src/app/`, `apps/mobile/src/lib/api.ts` |\n| `packages/ai` | Provider abstraction + DeepSeek/OpenAI-compatible/Ollama adapters + fallback chain, prompts, tokenizer, grounding, injection/sensitivity | DB writes | `packages/ai/src/provider.ts`, `providers/` |\n| `packages/job-pipeline` | Source-agnostic ingestion stages + adapters; the canonical weighted match scorer (`computeMatch`/`computeMatchResult`) | Persistence (caller writes) | `packages/job-pipeline/src/stages/`, `stages/match.ts`, `adapters/` |\n| `packages/aggregator` | Skill-state aggregation + `skill_state_event` audit (type-only Prisma) | HTTP / domain rules | `packages/aggregator/src/index.ts` |\n| `packages/firecrawl` | Firecrawl search/scrape/crawl client (Zod-validated, typed errors) | Job-source policy (lives in `docs/job-sources.md`) | `packages/firecrawl/src/client.ts` |\n| `packages/shared` | Zod schemas, constants, knowledge rules, retry, redact, SSRF guard, egress proxy | Feature-specific logic | `packages/shared/src/` |\n\n### 4) Reused Patterns\n\n| Pattern | Where found | Why it exists |\n|---------|-------------|---------------|\n| Provider/Adapter (Strategy) | `packages/ai/src/provider.ts` + `registry.ts` + `providers/`; `packages/embeddings/src/provider.ts`; `packages/job-pipeline/src/adapters/`; `packages/embeddings/src/qdrant.ts` | Swap LLM/embedding/job source without touching domain code |\n| Decorator fallback chain | `packages/ai/src/providers/fallback.ts` + `CircuitBreaker` (primary → backup → Ollama) | Availability failover without changing call sites; gate runs per candidate |\n| Bounded fire-and-forget audit queue | `apps/api/src/common/llm-audit.ts` (`makeLlmAuditor`), `apps/api/src/common/injection-log.ts` | Persist `llm_calls` + `llm_injection_log` without blocking or unbounded memory |\n| Single-loader / single-authority | `ProviderLoaderService` (budget → config → sensitivity → decrypt → construct provider), `SensitivityGateService` (one egress decision per provider) | Remove near-duplicate call-site logic and divergent policy |\n| Canonical pure scorer | `packages/job-pipeline/src/stages/match.ts` — same `computeMatch` backs list + detail | One score per job/candidate pair |\n| Registry (explicit, no FS scan) | `ProviderRegistry`, prompt registry `packages/ai/src/prompts/index.ts`, adapter registry | Predictable boot; unknown ID = hard fail |\n| Repository/Service via DI | All `apps/api/src/modules/*.service.ts` + PrismaService | Keep invariant enforcement in one layer |\n| State machine | `apps/api/src/modules/approvals/state-machine.ts`; `packages/shared/src/applications.ts` (`canTransition`) | Guard irreversible transitions |\n| Queue + idempotent job IDs | `apps/worker/src/main.ts`, `packages/shared/src/queues.ts` | Reliable async; no double-processing |\n| Zod at trust boundaries | `apps/api/src/common/pipes/zod-validation.pipe.ts`; every prompt schema | Validate every request + LLM response |\n| Grounded generation | `packages/ai/src/grounded.ts` + `grounded/gate.ts`; fact-check in `resume-variants` | Every generated claim binds to a `fact_id` |\n| Untrusted-content isolation | `packages/ai/src/wrap.ts` + `injection-scan.ts` | Structural prompt-injection defence |\n| Field-level encryption via middleware | `apps/api/src/prisma/prisma.service.ts:28-116` | Encrypt PII at rest transparently |\n| Guard/decorator | `RequireAdminGuard`, `@RateLimitAuth()`, `AgentJwtGuard` | Cross-cutting auth/limits |\n\n### 5) Known Architectural Risks\n\n- **Multi-user not enforced by default.** Most modules call `SessionService.requireUserId`, but there is no global session guard; global `AppConfig` writes are explicitly blocked when a second user exists (`UsageService.assertSingleUserForGlobalConfig`, `plan/security.md` item 1). A missed `requireUserId` could expose data before multi-tenant work lands. See `CONCERNS.md`.\n- **Schema is string-typed, not enum-enforced.** 55 Prisma models, 0 `enum` blocks — states are `String` with documented unions (`Application.state`, `Evidence.kind`, `NormalizedJob.state`). Invalid states are only prevented by app code.\n- **Anthropic/Azure have no adapter** (DeepSeek, OpenAI/OpenRouter, and Ollama do, with a real fallback chain), and circuit-breaker state is in-process (`packages/ai/src/providers/`, `apps/api/src/common/provider-loader.service.ts`).\n- **N+1 / pagination ceiling** already identified by the team: `plan/PLAN.md:69` parks N+1 in `JobsService.sync` and a match-score pagination pool ceiling as debt. Skill extraction and adapter fetch/persist still run inline in the API request path rather than on a `jobs` BullMQ queue.\n- **Deferred phase slices** (see `plan/DEFERRED.md`) mean several documented flows are partial: `whisper.cpp` verbal/multi-turn interview (`verbal_sessions`), GlitchTip error tracking, mobile push/offline, desktop installer signing, and prompt-eval registration are still open. The formerly-absent deployment paths (`infra/nginx/`, `infra/docker/Dockerfile.backup`) now exist.\n- **Resolved during cleanup + Waves A–C (no longer risks):** Prisma is aligned on 6.x across api/worker/aggregator; egress for Node global `fetch` is enforced via `undici`; Swagger/OpenAPI is implemented; api/worker/web containers are hardened; GitHub Actions are SHA-pinned; the embedding provider seam is real (`bge-small-en` + deterministic fallback); `@careeros/messaging` is instantiated through `ChannelRegistry`; the desktop devices UI ships; nginx/TLS/certbot/backup are in compose. See `CONCERNS.md`.\n\n### 6) Evidence\n\n- `docs/architecture.md` (system topology, golden paths, data lifecycles, failure modes)\n- `AGENTS.md` §1-§14, `plan/PLAN.md` (locked decisions, status board)\n- `apps/api/src/main.ts`, `apps/api/src/app.module.ts`, `apps/api/src/modules/`\n- `apps/api/src/common/{provider-loader.service.ts,sensitivity-gate.service.ts,llm-audit.ts,injection-log.ts,injection-audit.module.ts}`, `packages/job-pipeline/src/stages/match.ts`, `packages/aggregator/src/index.ts`, `packages/embeddings/src/provider.ts`, `packages/secrets/src/rotation.ts`, `apps/api/src/modules/me/master-key-rotation.service.ts`\n- `apps/worker/src/main.ts`, `apps/worker/src/register-worker.ts`, `packages/ai/src/{provider,registry,grounded,wrap}.ts`, `packages/ai/src/providers/`\n- `apps/mobile/src/`, `apps/desktop/src/`, `infra/nginx/`, `infra/docker/Dockerfile.backup`\n- `apps/api/prisma/schema.prisma`\n\n## Extended Sections\n\n### Component / deployment architecture\n\n```mermaid\nflowchart TB\n    subgraph client[\"Clients\"]\n        Browser[\"User browser\"]\n        Agent[\"Desktop agent (Electron + Playwright + Chrome)\"]\n        Mobile[\"Mobile app (Expo / React Native)\"]\n    end\n\n    subgraph vps[\"Self-hosted host (Docker Compose)\"]\n        Nginx[\"nginx (TLS :80/:443)\"]\n        Web[\"web (Next.js :3000)\"]\n        API[\"api (NestJS :3001)\"]\n        Worker[\"worker (BullMQ)\"]\n        subgraph data[\"Private network (internal: true)\"]\n            PG[(\"Postgres\")]\n            Redis[(\"Redis\")]\n            Qdrant[(\"Qdrant\")]\n            MinIO[(\"MinIO\")]\n        end\n        Squid[\"squid egress proxy (allowlist)\"]\n    end\n\n    subgraph ext[\"External (operator-configured)\"]\n        DeepSeek[\"DeepSeek API\"]\n        GitHub[\"GitHub / GitLab\"]\n        ATS[\"Ashby / Greenhouse\"]\n        Agg[\"Adzuna / Remotive / Arbeitnow\"]\n        Slack[\"Slack\"]\n        Gmail[\"Gmail + Pub/Sub\"]\n    end\n\n    Browser -->|HTTPS| Nginx --> Web\n    Nginx -->|/api/*| API\n    Web -->|server-side API_URL| API\n    Mobile -->|REST /api| Nginx\n    Agent <-.WSS pairing.-> API\n    API --> PG\n    API --> Redis\n    API --> Qdrant\n    API --> MinIO\n    Worker --> PG\n    Worker --> Redis\n    Worker --> Qdrant\n    API --> Squid\n    Worker --> Squid\n    Squid --> DeepSeek\n    Squid --> GitHub\n    Squid --> ATS\n    Squid --> Agg\n    API -. webhooks .-> Slack\n    Slack -. events .-> API\n    Gmail -. push .-> API\n```\n\n### Data flow: job ingestion to match (source-agnostic)\n\n```mermaid\nsequenceDiagram\n    participant Sched as Scheduler (BullMQ)\n    participant Adapter as Job adapters (Ashby/Adzuna/…)\n    participant Pipeline as packages/job-pipeline\n    participant LLM as DeepSeek (grounded skill extract)\n    participant DB as Postgres\n    participant User as User (web)\n\n    Sched->>Adapter: hourly ingest tick\n    Adapter->>Pipeline: RawJob[]\n    Pipeline->>DB: insert jobs_raw (append-only)\n    Pipeline->>Pipeline: normalize → dedupe → cross-source dedupe → freshness\n    Pipeline->>LLM: skill extract (wrapUntrusted + schema)\n    LLM-->>Pipeline: {skill_ids[], evidence_refs}\n    Pipeline->>Pipeline: verify (trust order) → relevance → match\n    Pipeline->>DB: upsert NormalizedJob + JobRejectLog on reject\n    User->>DB: GET /jobs → match list with gap report\n```\n\n### Failure modes / degraded behaviour\n\nThe repo documents its degradation posture in `docs/architecture.md` §8: DeepSeek circuit-breaker to fallback provider; Postgres down → 503 + retry loop; Qdrant down → text fallback; Redis down → in-memory rate limit; agent offline → tasks held 7 days; LLM budget exceeded → 429 with reset time; injection detected → auto-action skipped. The observability contract adds `/health` (dependency checks, 5s cache) and `/metrics` (`plan/observability.md`).\n"},{"id":"conventions","title":"Coding Conventions","md":"\n# Coding Conventions\n\nConventions below are stated in `AGENTS.md`, `CONTRIBUTING.md`, and enforced (or partially enforced) by config in the repo. Where a rule is aspirational rather than enforced, that is called out explicitly.\n\n## Core Sections (Required)\n\n### 1) Naming Rules\n\n| Item | Rule | Example | Evidence |\n|------|------|---------|----------|\n| Files (non-React) | kebab-case (dot-separated \"type\" suffix for Nest components) | `zod-validation.pipe.ts`, `market-snapshot.worker.ts`, `assert-public-url.ts` | `apps/api/src/common/pipes/zod-validation.pipe.ts`; `apps/worker/src/market-snapshot.worker.ts` |\n| React components | PascalCase `.tsx`, one component per file | `SkillTree.tsx`, `ApprovalQueue.tsx` | `apps/web/src/components/skills/SkillTree.tsx` |\n| Hooks / utilities | camelCase | `useDrafts.ts`, `api-client.ts`, `chart-geometry.ts` | `packages/ui/src/useDrafts.ts`; `apps/web/src/lib/api-client.ts` |\n| Functions/methods | camelCase, verb-first | `syncSkillState`, `encryptField`, `computeMatch` | `packages/aggregator/src/index.ts`; `packages/secrets/src/field.ts`; `packages/job-pipeline/src/stages/match.ts` |\n| Types/interfaces | PascalCase; Zod schemas suffixed `Schema` | `NormalizedJob`, `SkillExtractSchema` | `packages/shared/src/schemas/index.ts` |\n| Constants | UPPER_SNAKE_CASE | `QUEUE_GITHUB`, `EMBED_DIM`, `SENSITIVITY_LEVELS` | `packages/shared/src/queues.ts`, `packages/embeddings/src/local.ts` |\n| Env vars | UPPER_SNAKE_CASE | `ENCRYPTION_KEY`, `TRUSTED_ORIGINS` | `.env.example` |\n| DB tables/columns | snake_case in `@@map`/`@map`; Prisma models PascalCase | `candidate_skill_state`, `job_reject_log` | `apps/api/prisma/schema.prisma` |\n| Migrations | descriptive snake_case name (never a date alone) | `add_evidence_source_column` | `AGENTS.md` §6; `apps/api/prisma/migrations/` |\n\n### 2) Formatting and Linting\n\n- **Formatter:** Prettier 3 configured in `.prettierrc` — `semi: true`, `singleQuote: true`, `trailingComma: \"all\"`, `printWidth: 100`, `tabWidth: 2`, `arrowParens: \"always\"`, plugin `prettier-plugin-tailwindcss`. Run with `pnpm format`.\n- **Linter:** Two layers. `apps/web` runs **ESLint 9** via a flat config (`apps/web/eslint.config.mjs`, `eslint-config-next@16`); Next 16 removed `next lint`, so `pnpm lint` calls the ESLint CLI directly. A **root `.eslintrc.cjs` is a reference config that is not installed and not active** until a workspace adds ESLint + `extends: [\"../../.eslintrc.cjs\"]` (`.eslintrc.cjs:10-18`); `@careeros/api` has no working flat config and is excluded from the CI lint job. CI also runs the API typecheck, unit/integration tests, and Playwright (`.github/workflows/pr.yml`).\n- **Most relevant enforced rules (root chain, when adopted):**\n  1. `no-console: error` in production code (allow `warn`/`error`; tests/scripts/seeds exempt) — observability spec.\n  2. `no-restricted-syntax` on `CallExpression[callee.property.name='chat']` — raw `provider.chat()` is forbidden outside `packages/ai`; use `chatStructured()` with a Zod schema per `plan/ai-safety.md` item 2.\n  3. `data-testid` must be a string literal, never an interpolated expression — per `plan/testing.md`.\n- **TypeScript strictness (enforced by `tsconfig.base.json`):** `strict`, `noImplicitAny`, `strictNullChecks`, `exactOptionalPropertyTypes`, `noUncheckedIndexedAccess`, `noImplicitOverride`. `any` is disallowed unless justified inline.\n- **Commands:** `pnpm lint` (turbo), `pnpm typecheck` (turbo), `pnpm format`.\n- **Pre-commit:** `lefthook.yml` runs gitleaks (best-effort), workspace typecheck, and per-workspace lint on staged TS. Binary must be on PATH; hooks degrade gracefully.\n\n### 3) Import and Module Conventions\n\n- **Cross-workspace imports** use the `@careeros/*` package name (declared `workspace:*`); there are **no path aliases** in `tsconfig.base.json`, so imports like `@/foo` do not exist.\n- **Intra-workspace imports** are relative. NestJS modules import sibling files by relative path (`./session.service`).\n- **Barrel policy:** each package exposes `src/index.ts`. `@careeros/shared` also exposes explicit subpaths — `./schemas`, `./constants`, `./redact`, `./retry`, `./net` (`packages/shared/package.json` exports). `./net` is intentionally excluded from the barrel (`packages/shared/src/index.ts:18-19`).\n- **Adapter rule:** never import an adapter from `apps/web` directly — go through a stable interface in `packages/` (`AGENTS.md` §5).\n- **Reuse before rewrite:** check `packages/ui`, `packages/shared`, shadcn, lucide, stdlib first (`AGENTS.md` §6).\n\n### 4) Error and Logging Conventions\n\n- **Error strategy by layer:** NestJS services throw typed domain errors; global `LockoutExceptionFilter` maps `LockoutError` to HTTP 429 with `Retry-After` (`apps/api/src/common/filters/lockout.filter.ts`, registered `apps/api/src/main.ts:91`). Zod schemas validate at every trust boundary via `ZodValidationPipe`. `packages/sandbox` deliberately never throws — failures return `status: 'crash'`.\n- **Logging:** all application logging goes through `pino` (JSON in prod, `pino-pretty` in dev). `console.log` is forbidden in application code (root lint rule; observability spec). Required stable context keys: `user_id`, `request_id`, `agent_role`, `prompt_id`, `prompt_hash`, `provider`, `model`, `job_id`, `duration_ms` (`plan/observability.md` §Logging).\n- **Redaction:** `packages/shared/src/redact.ts` runs before log writes and Sentry `beforeSend`; redacts `Authorization`, `Cookie`, `api_key`, `token`, `password`, `refresh_token`, `client_secret`, AWS-style keys.\n- **Retry/backoff:** all external calls go through `packages/shared/retry.ts` — exponential with full jitter, base 500ms, factor 2, max 30s, 3 attempts; `429` respects `Retry-After`; non-429 `4xx` fails fast; circuit breaker at 5 consecutive failures per (provider, endpoint) (`AGENTS.md` §6).\n- **Timezone:** all timestamps stored UTC (`timestamptz`); user timezone in `user_prefs.timezone`; render with `Intl.DateTimeFormat(user.timezone)` client-side; never format server-side (`AGENTS.md` §6).\n\n### 5) Testing Conventions\n\n- **Test file naming/location:** unit tests are colocated `foo.ts` + `foo.test.ts`; integration tests are `*.integration.test.ts`; e2e are `*.spec.ts` under `apps/web/e2e/`; LLM evals are `packages/ai/src/evals/**/*.eval.ts`; contract tests are `*.contract.test.ts`. Vitest include globs: `packages/**/src/**/*.test.ts`, `apps/**/src/**/*.test.ts`, `scripts/**/*.test.ts` (`vitest.config.ts`).\n- **Mocking strategy:** prefer real integration tests via Testcontainers over deep mocks (`CONTRIBUTING.md`); `msw` for external HTTP in unit tests only; never mock the DB in integration tests.\n- **Coverage expectation:** **no coverage percentage target.** Behavior coverage is the rule — every phase checkbox has at least one verifying test. `retries: 0` in e2e; flakes are treated as bugs.\n- **`fast-check`** for property-based tests on math-heavy paths (aggregator, priority formula, dedupe).\n- **Ponytail rule:** any non-trivial module (branch, loop, parser, money/security path) leaves one runnable check (`AGENTS.md` §6).\n\n### 6) Evidence\n\n- `AGENTS.md` §6, §7, §9, §10; `CONTRIBUTING.md`\n- `tsconfig.base.json`, `.prettierrc`, `.eslintrc.cjs`, `lefthook.yml`, `vitest.config.ts`\n- `plan/observability.md`, `plan/testing.md`, `plan/security.md`\n- `packages/shared/src/{retry,redact}.ts`, `apps/api/src/common/filters/lockout.filter.ts`\n\n## Extended Sections\n\n### Repo-specific commit / slice conventions\n\n- Branch off `main`/`master`; keep diffs small; if a change exceeds ~400 lines across many files, split into named slices (e.g. `C-P1.5a`, `F.11c`) (`CONTRIBUTING.md` §Making a change).\n- Commit subject + body describing the **why**; sign with `gitsign` when configured.\n- No em dashes in user-facing strings (memory-enforced rule, `CONTRIBUTING.md`).\n- Never commit generated files (`dist/`, `.d.ts`, `.js.map`) outside intentional artifacts.\n- Never touch `plan/_audit_*.md` (historical audit records).\n\n### Known convention violations / drift\n\n- The root ESLint chain is **still not active** in any workspace that hasn't opted in (`.eslintrc.cjs:10-13`), so the three cross-cutting rules are not universally enforced today. `apps/web` ships its own eslint 9 flat config and is the only workspace gated in CI.\n- T29 is **resolved**: `react-hooks/set-state-in-effect` is back to `error` in `apps/web/eslint.config.mjs`, and the `useApi` hook (`apps/web/src/lib/use-api.ts`) backs 19 panels so fetch-on-mount no longer sets state inside the effect synchronously.\n- `AGENTS.md` §5 lists a `packages/storage` and `packages/github` that do not exist as packages; storage lives at `apps/api/src/common/storage.service.ts` and GitHub logic lives in `apps/api/src/modules/integrations/github/` plus `apps/worker/src/github-sync.ts`.\n- `docs/dev-setup.md` now labels the remaining unwired commands (`pnpm seed:dev`, `pnpm ai:probe`) as \"planned\" rather than presenting them as available. See `CONCERNS.md`.\n"},{"id":"integrations","title":"External Integrations","md":"\n# External Integrations\n\nCareer OS integrates with LLM, code-host, job-source, messaging, and email systems — all behind a deny-by-default egress proxy. Datastores run on a private Docker network, and nginx is the single public TLS entrypoint.\n\n## Core Sections (Required)\n\n### 1) Integration Inventory\n\n| System | Type | Purpose | Auth model | Criticality | Evidence |\n|--------|------|---------|------------|-------------|----------|\n| DeepSeek API | HTTP (OpenAI-compatible) | Default LLM: skill extract, grading, resume/cover-letter, market brief, dossier, email classify | Per-install API key, encrypted at rest | High | `packages/ai/src/providers/deepseek.ts`, `packages/ai/src/pricing.ts` |\n| OpenAI / OpenRouter / any OpenAI-compatible | HTTP | Alternate/backup LLM providers via one `openai-compatible.ts` adapter | Encrypted API key + optional per-user base URL (SSRF-gated) | Medium | `packages/ai/src/providers/openai-compatible.ts`, `create.ts` |\n| Ollama (local) | HTTP (`/api/chat`) | Last-resort local LLM fallback; never leaves the host | Local endpoint, no key | Low | `packages/ai/src/providers/ollama.ts` |\n| GitHub | REST (Octokit) | Repo list + sync, commit analysis for skill evidence | PAT (OAuth optional); scope-gated to `repo`/`public_repo`/`read:user`/`user:email` | High | `apps/worker/src/github-sync.ts`, `apps/api/src/modules/integrations/github/github.service.ts` |\n| GitLab | REST | Public + self-hosted repo sync (PAT) | PAT + per-user host allowlist via `assertPublicUrl` | Medium | `apps/worker/src/gitlab-sync.ts`, `packages/shared/src/net/assert-public-url.ts` |\n| Ashby / Greenhouse | ATS REST | Verified job source (highest trust tier) + ATS submission | Public boards (no auth); submission via API later | High | `packages/job-pipeline/src/adapters/`, `apps/api/src/modules/ats-submit/adapters/` |\n| Workday / Lever / SmartRecruiters / Workable / iCIMS / SuccessFactors | ATS/career-site adapters | Direct crawl of public company career sites and ATS boards (owner decision U6) | Public boards; config/credentials per source (env) | Medium–High | `packages/job-pipeline/src/adapters/{workday,lever,smartrecruiters,workable,icims,successfactors}/` |\n| Firecrawl | Managed scrape/search/crawl (`api.firecrawl.dev/v1`) | Public career-site / ATS discovery, preferred over direct crawl | `FIRECRAWL_API_KEY` (optional; encrypted at rest) | Medium | `packages/firecrawl/src/client.ts`, `packages/job-pipeline/src/adapters/firecrawl/`, `docs/job-sources.md` |\n| Adzuna / Remotive / Arbeitnow | Aggregator REST | Aggregator job sources (tier 2) | API key (Adzuna) / none | Medium | `packages/job-pipeline/src/adapters/`; `plan/PLAN.md:20` |\n| JSearch / Serpapi (optional) | Paid partner API | LinkedIn/Indeed via legitimate partners | API key | Low (optional) | `plan/PLAN.md:20`, `docs/architecture.md` §2 |\n| Slack | Web API + Events API | Daily brief, slash commands, interactive approvals | OAuth bot token + request signing (HMAC) | Medium | `apps/api/src/modules/slack/`, `infra/slack/manifest.yml` |\n| Gmail | Google OAuth + Pub/Sub | Email alert ingest, inbox triage | OAuth `gmail.readonly` + watch/push | Medium | `apps/api/src/modules/gmail/`, `apps/worker/src/gmail-watch-renewal.worker.ts` |\n| Qdrant | Vector DB | Semantic search over verified/user content | Private network, no public auth in MVP | Medium | `packages/embeddings/src/qdrant.ts` |\n| MinIO | Object storage | Resumes, generated artifacts, agent screenshots | Root credentials + per-user signed URLs | High | `apps/api/src/common/storage.service.ts`, `infra/docker/docker-compose.yml` |\n| Squid | Forward proxy | Deny-by-default egress allowlist | Network policy | High | `infra/docker/squid/squid.conf` |\n| nginx | Reverse proxy + TLS | Public entrypoint: terminates TLS, ACME HTTP-01, routes `/`→web, `/api/*`→api (prefix stripped) | Network policy; self-signed or Let's Encrypt cert | High | `infra/nginx/nginx.conf`, `infra/nginx/templates/careeros.conf.template` |\n| certbot | ACME client | Renews issued Let's Encrypt certs every 12h into the shared volume | `ACME_EMAIL`; operator issues first cert | Medium | `infra/docker/docker-compose.yml` (certbot service) |\n| GlitchTip | Error tracking (Sentry-compatible) | Self-hosted error capture | DSN (planned wiring) | Low | `plan/observability.md`; `[TODO]` not in compose yet |\n| Desktop / mobile clients | WSS + REST | Desktop agent pairing/execution; mobile read-only companion | Device-code pairing → JWT + refresh; `expo-secure-store`/keychain | Medium | `apps/desktop/src/wss-client.ts`, `apps/mobile/src/lib/auth.tsx`, `apps/api/src/modules/{agent,mobile}/` |\n\n### 2) Data Stores\n\n| Store | Role | Access layer | Key risk | Evidence |\n|-------|------|--------------|----------|----------|\n| Postgres 16 | System of record (56 models, 40 migrations, append-only `jobs_raw`/`audit_events`/`llm_calls`/`llm_injection_log`) | Prisma 6 (`apps/api`, `apps/worker`, `@careeros/aggregator`) | AppConfig not yet user-scoped (multitenant TODO) | `apps/api/prisma/schema.prisma`, `apps/api/package.json`, `apps/worker/package.json`, `packages/aggregator/package.json` |\n| Redis 7 | BullMQ queues, throttler store, cache | `ioredis`, BullMQ | Queue loss if Redis down (documented degradation) | `apps/worker/src/main.ts`, `apps/api/src/modules/auth/auth.module.ts` |\n| Qdrant | Vector index (semantic content) | `@qdrant/js-client-rest` via `QdrantStore` | Vectors are semantic when `EMBEDDING_MODE=local` and weights are available; pre-switch vectors are deterministic and need re-embedding | `packages/embeddings/src/{provider.ts,qdrant.ts}`, `apps/worker/src/embedding-job.ts` |\n| MinIO | Files (resumes, PDFs, screenshots) | `minio` SDK wrapped in `StorageService` | Credentials must be strong; presign TTL 5 min | `apps/api/src/common/storage.service.ts` |\n| Local filesystem (agent) | Playwright profile, screenshots, logs | `keytar`, `fs` | Screenshot/log retention bounded to 30d/10MB/14d | `apps/desktop/src/screenshot-cleanup.ts`, `log-rotation.ts` |\n\n### 3) Secrets and Credentials Handling\n\n- **Credential sources:** environment variables for boot/master secrets (`ENCRYPTION_KEY`, `SESSION_SECRET`, datastore passwords) and AES-256-GCM-encrypted DB rows for per-integration secrets (`EncryptedSecret`, `Integration`, `ProviderConfig`). Master key must be 64-char hex or 44-char base64 (`packages/secrets/src/master-key.ts`); field encryption uses HKDF subkeys with AAD context (`packages/secrets/src/field.ts`).\n- **Hardcoding checks:** `.gitleaks.toml` + `gitleaks.yml` CI + lefthook pre-commit; `startup-check.ts` refuses known-weak values (`careeros`, `minioadmin`, `changeme`, …) and <24-byte datastore creds.\n- **Rotation lifecycle:** master `ENCRYPTION_KEY` rotation is **implemented** (Wave C). `POST /me/security/rotate-key` (session + fresh re-auth via `SensitivityGateService.hasFreshReauth`) runs `MasterKeyRotationService`, which walks every `encrypted_secrets` row and every `enc:v1:`-prefixed `ENCRYPTED_FIELDS` value one transaction per row using the pure, idempotent `rotateMasterKey` primitive (`packages/secrets/src/rotation.ts`). It stops at the first row neither key can decrypt and reports `{scanned, rotated, alreadyRotated, skippedPlaintext, failed, failure}` without ever returning ciphertext; re-running resumes. On success the operator updates `ENCRYPTION_KEY` and restarts (the endpoint never writes env). OAuth tokens stored encrypted; GitHub PAT scope validation rejects over-broad/`admin:*` scopes (`github.service.ts:55`).\n\n### 4) Reliability and Failure Behavior\n\n- **Retry/backoff:** shared `packages/shared/retry.ts` — exponential with full jitter, base 500ms, factor 2, max 30s, 3 attempts; `429` honours `Retry-After`; non-429 `4xx` fails fast; circuit breaker at 5 consecutive failures per (provider, endpoint), 60s open, half-open probe (`AGENTS.md` §6).\n- **Timeout policy:** DeepSeek provider enforces `max_tokens` (default 4096) and SSRF-guarded fetches; health checks use 500ms per dependency with a 5s cache (`plan/observability.md`); agent navigation timeout 30s (`apps/desktop/src/task-runner.ts`).\n- **Circuit-breaker/fallback:** implemented (DeepSeek/OpenAI-compatible → configured backup → Ollama last-resort) in `packages/ai/src/providers/fallback.ts` + `apps/api/src/common/provider-loader.service.ts`; 5 consecutive availability failures → 60s open → half-open probe, with a `providerStatus` degraded badge. Circuit state is in-process (move to Redis for multi-replica).\n- **Egress control:** api/worker force `HTTP(S)_PROXY=http://squid:3128` with `NO_PROXY` for datastores; Squid denies by default and allows only deepseek/openai/anthropic/openrouter/github/githubusercontent/gitlab/npmjs/github-releases plus **`api.firecrawl.dev`**; denies non-80/443, CONNECT≠443, and local IPs (`infra/docker/squid/squid.conf`). Direct ATS/career-site crawl hosts are deliberately **not** wildcarded — each reviewed host needs an explicit `allowed_dsts` line (`docs/job-sources.md`). Because Node global `fetch` ignores proxy env vars, `installEgressProxy()` (`packages/shared/src/net/proxy-dispatcher.ts`) installs an undici `EnvHttpProxyAgent` at api/worker boot (`apps/api/src/main.ts:97`, `apps/worker/src/main.ts:120`) and fails closed if the proxy is configured but cannot be built (`docs/egress.md`). A manual operator smoke lives at `scripts/smoke/egress.sh` (not run in CI; the live Docker egress smoke is still outstanding).\n- **SSRF gate:** `assertPublicUrl` (DNS-resolved, redirect-revalidated, host allowlist) applies to user-supplied provider/embedding base URLs and self-hosted GitLab (`packages/shared/src/net/assert-public-url.ts`).\n\n### 5) Observability for Integrations\n\n- **Logging around external calls:** yes — `pino`, with `provider`/`model`/`prompt_id`/`prompt_hash`/`job_id`/`duration_ms` context (`plan/observability.md`).\n- **Metrics:** `prom-client` `/metrics` on api + worker, including `llm_*`, `queue_*`, `jobs_*`, `agent_*`, and auth counters. `[TODO]` worker `/metrics` wiring and GlitchTip service are not yet present in `docker-compose.yml`.\n- **Per-call LLM + injection audit are wired:** `makeLlmAuditor` (`apps/api/src/common/llm-audit.ts`) is passed into the provider via `ProviderLoaderService`, so each call writes one `LlmCall` (`llm_calls`: prompt id/hash, sensitivity, tokens — `js-tiktoken` pre-flight estimate + provider `usage` — cost split, latency, validation verdict) through a bounded drop-loudly queue and emits metrics. `InjectionAuditModule` installs wrap/scan hooks so every suspect/blocked hit also writes one `LlmInjectionLog` (`llm_injection_log`). Remaining gaps: no tracing in MVP (interface reserved); no GlitchTip compose service; worker `/metrics` not wired; tokenizer/pricing coverage still maturing (`plan/ai-safety.md` item 9).\n\n### 6) Evidence\n\n- `packages/ai/src/providers/`, `packages/ai/src/pricing.ts`, `apps/api/src/common/{llm-audit.ts,injection-log.ts}`, `packages/ai/src/tokenize.ts`\n- `packages/job-pipeline/src/adapters/`, `packages/firecrawl/src/client.ts`, `packages/email-parsers/src/senders/allowlist.ts`, `docs/job-sources.md`\n- `apps/api/src/modules/integrations/`, `apps/api/src/modules/{slack,gmail,agent,mobile}/`\n- `infra/docker/docker-compose.yml`, `infra/nginx/`, `infra/docker/Dockerfile.backup`, `infra/docker/squid/squid.conf`, `scripts/smoke/egress.sh`, `infra/slack/manifest.yml`\n- `.env.example`, `packages/secrets/src/` (incl. `rotation.ts`), `apps/api/src/modules/me/master-key-rotation.service.ts`, `packages/shared/src/net/{assert-public-url,proxy-dispatcher}.ts`\n- `packages/embeddings/src/provider.ts`, `apps/worker/src/embedding-job.ts`\n- `plan/security.md` items 4, 6, 8, 10; `plan/observability.md`; `docs/architecture.md` §2, §7, §8\n\n## Extended Sections\n\n### Deployment topology\n\n```mermaid\nflowchart LR\n    Internet((Internet)) -->|443| Nginx[\"nginx (TLS, ACME) :80/:443\"]\n\n    subgraph compose[\"Docker Compose: careeros\"]\n        Nginx --> Web[\"web :3000\"]\n        Nginx --> API[\"api :3001\"]\n        Web --> API\n        API --> Internal\n        Worker[\"worker\"] --> Internal\n        API --> Squid[\"squid :3128\"]\n        Worker --> Squid\n        Squid --> Internet\n        Internal[\"internal network\"] --> PG[(\"postgres :5432\")]\n        Internal --> Redis[(\"redis :6379\")]\n        Internal --> Qdrant[(\"qdrant :6333\")]\n        Internal --> MinIO[(\"minio :9000\")]\n        Certbot[\"certbot (renew 12h)\"] -.-> Nginx\n    end\n\n    Agent[\"desktop agent\"] -.WSS.-> Nginx\n    Mobile[\"mobile app\"] -.REST /api.-> Nginx\n```\n\n### Authentication sequence (browser session + CSRF)\n\n```mermaid\nsequenceDiagram\n    participant U as User\n    participant W as Web (Next.js)\n    participant A as API (NestJS)\n    participant S as SessionService (iron-session)\n    participant DB as Postgres\n\n    U->>W: POST sign-in (email + password)\n    W->>A: POST /auth/sign-in\n    A->>DB: load user, verify Argon2id\n    A->>DB: LoginAttempt counter (exponential lockout)\n    A->>S: seal session cookie + CSRF token\n    S-->>W: Set-Cookie __Host-careeros_session, __Host-careeros_csrf\n    W->>A: mutating request + x-csrf-token\n    A->>A: SecurityMiddleware: Sec-Fetch-Site + CSRF HMAC check\n    A->>DB: ActiveSession revocation check\n    A-->>W: 200 domain response\n    Note over A,DB: Passkey (WebAuthn) and recovery codes are alternative factors\n```\n\n### Integration contract tests\n\nEvery job-source adapter has a recorded-fixture contract test (14 `*.contract.test.ts` across `packages/job-pipeline/src/adapters/**` and `apps/api/src/modules/ats-submit/adapters/**`) and a weekly live revalidation workflow (`.github/workflows/adapter-contract.yml`). The ATS set now includes `firecrawl`, `workday`, `lever`, `smartrecruiters`, `workable`, `icims`, and `successfactors` alongside `ashby`, `greenhouse`, `adzuna`, `arbeitnow`, and `remotive`. Adzuna is fully MSW-mocked because its upstream requires paid credentials; several ATS adapters are live-validated in the weekly run.\n"},{"id":"testing","title":"Testing Patterns","md":"\n# Testing Patterns\n\nCareer OS uses a four-layer testing approach — Vitest unit, Testcontainers integration, Playwright e2e/a11y/visual, and a custom LLM-eval runner — plus contract, sandbox-security, and backup-restore side-cars. The stated philosophy is behavior coverage, not a coverage percentage (`plan/testing.md` §10).\n\n## Core Sections (Required)\n\n### 1) Test Stack and Commands\n\n- **Primary test framework:** Vitest 5.0.1 (`vitest.config.ts`, root `package.json`).\n- **Integration:** Testcontainers 10.28 (`packages/testing/src/index.ts` spins real Postgres/Redis/Qdrant/MinIO) + `msw` 2.15 for external HTTP in unit tests + `fast-check` 4.10 for property tests.\n- **E2E/a11y/visual:** Playwright ^1.48 (resolved 1.63) + `@axe-core/playwright` 4.10 (`apps/web/playwright.config.ts`).\n- **Commands:**\n\n```bash\npnpm test                 # vitest run (unit + integration)\npnpm test:unit            # excludes *.integration.test.ts and *.e2e.test.ts\npnpm test:integration     # vitest run integration.test\npnpm test:e2e             # @careeros/web Playwright (headless)\npnpm test:e2e            # via apps/web: pnpm test:e2e:ui for UI mode\npnpm test:a11y            # A11Y=1 pnpm --filter @careeros/web test:e2e\npnpm test:evals           # @careeros/ai evals (EVAL_MOCK=1 default); real run needs provider key\n```\n\n### 2) Test Layout\n\n- **Placement pattern:** unit tests are **co-located** next to source (`apps/api/src/modules/skills/skills.service.test.ts`); integration tests are `*.integration.test.ts`; e2e specs live in `apps/web/e2e/`; LLM evals live in `packages/ai/src/evals/<prompt>/`; contract tests are `*.contract.test.ts` in `packages/job-pipeline/src/adapters/`.\n- **Naming convention:** `foo.ts` + `foo.test.ts`; integration `foo.integration.test.ts`; e2e `*.spec.ts`; evals `*.eval.ts`; contracts `*.contract.test.ts`.\n- **Setup files:** root `vitest.setup.ts` seeds `ENCRYPTION_KEY` (64 hex), `DATABASE_URL`, `REDIS_URL`, `QDRANT_URL`; included via `vitest.config.ts` `setupFiles`. Playwright config lives only at `apps/web/playwright.config.ts`.\n- **Counts in the tree:** 234 unit `*.test.ts(x)` (excluding integration + contract), 7 `*.integration.test.ts`, 14 `*.contract.test.ts`, 4 `*.spec.ts` (e2e), 2 `*.eval.ts` (tracked sources via `git ls-files`). The prior cleanup's central gate recorded 1609+ Vitest tests passing / 0 failed with web lint clean (`plan/CLEANUP_TASKS.md` progress log); Waves A–C added the unit suites for the provider fallback, embeddings seam, tokenizer, injection log, master-key rotation, mobile, and market-demand/search-providers.\n\n### 3) Test Scope Matrix\n\n| Scope | Covered? | Typical target | Notes |\n|-------|----------|----------------|-------|\n| Unit | Yes | Services, parsers, aggregators, crypto, schemas, priority/XP math | Vitest; colocated; `pnpm test:unit` |\n| Integration | Yes (partial) | Prisma queries, encrypted-field opacity, append-only audit, storage, job ingestion, approvals, skill-state sync | Testcontainers gated behind `TESTCONTAINERS_E2E=1` + `isDockerAvailable`; 7 files today |\n| E2E | Yes (partial) | Setup wizard, post-setup widgets, connect-repo golden flow, security headers | `pr.yml` runs `pre-setup` on a fresh DB and mints an `E2E_STORAGE_STATE` for `post-setup`, plus the header-only `security-headers.spec.ts`; `golden-connect-repo` still skips (needs `E2E_STUB_MODE=1` + server-side stubs) |\n| LLM evals | Yes (partial) | skill-extract, knowledge-grader, question-generator, fact-check, email-classifier | `EVAL_MOCK=1` by default; nightly workflow exists but runner registration is deferred |\n| Contract | Yes | 12 job adapters (`ashby`, `greenhouse`, `adzuna` MSW, `arbeitnow`, `remotive`, `firecrawl`, `workday`, `lever`, `smartrecruiters`, `workable`, `icims`, `successfactors`) + 2 ATS-submit adapters | 14 files; weekly live revalidation via `adapter-contract.yml` |\n| Sandbox security | Yes | Memory/network/fork/wallclock/fs limits | Real Docker (`packages/sandbox/src/security.test.ts`) |\n| Backup/restore | Partial | Weekly restore round-trip | Workflow exists (`.github/workflows/restore-test.yml`); round-trip body gated on seed/manifest wiring |\n| A11y | Yes | Dashboard, skills, evidence, facts, arena, settings | axe WCAG 2.1 AA; color-contrast disabled in the post-setup spec |\n| Visual regression | No `[TODO]` | Per-screen baselines | Declared in spec; `apps/web/e2e/visual/` not present |\n\n### 4) Mocking and Isolation Strategy\n\n- **Main approach:** real services via Testcontainers for integration; `msw` handlers (`defaultHandlers` for GitHub/GitLab/DeepSeek/OpenAI/Anthropic/OpenRouter) for unit external HTTP; Playwright `page.route()` stubs for e2e provider/GitHub responses.\n- **Isolation:** `resetDb` helper, per-test transactional patterns planned; e2e uses storage-state auth (`seedStorageState`) so users sign in once; `startInfra` per test file or `beforeAll`.\n- **LLM determinism:** evals run `temperature=0`; assertions are schema/property/grounding/pass-rate, never exact strings; responses cached by prompt hash (planned).\n- **Common failure mode:** integration suites silently skip when Docker is unavailable (guarded by `TESTCONTAINERS_E2E`), so CI must set the flag — `pr.yml` runs a dedicated `test-integration` job.\n\n### 5) Coverage and Quality Signals\n\n- **Coverage tool + threshold:** none. **No coverage percentage target** (`plan/testing.md` §10). Behavior coverage is the bar: each phase checkbox needs at least one verifying test.\n- **Current reported coverage:** `[TODO]` not measured/committed.\n- **Quality gates in CI:** `pr.yml` has dedicated jobs for **lint** (`apps/web` eslint 9 is the real gate; `@careeros/api` is excluded because it has no flat config), typecheck (`pnpm -r typecheck` after an explicit `prisma generate`), unit tests, integration tests (Testcontainers, `TESTCONTAINERS_E2E=1`), and **Playwright** (pre-setup on a fresh migrated DB, then `pnpm seed:test` + minted storage state for the authenticated suite). Plus `pnpm audit --prod --audit-level=high`, image-pin check, prompt-version check, Trivy, CodeQL, gitleaks, adapter contracts (weekly), evals (nightly), restore test (weekly).\n- **Known gaps/flaky areas:** `golden-connect-repo` e2e self-skips without stub mode + server-side stubs; `@careeros/api` still has no working eslint flat config (its `lint` script is excluded from CI); only 7 integration files; no visual baselines; the live Docker egress smoke (`scripts/smoke/egress.sh`) is not in CI and remains unrun; `apps/mobile` ships no tests yet. The embedder is now real (`bge-small-en` with deterministic fallback), and T29 is resolved — `useApi` (`apps/web/src/lib/use-api.ts`) backs 19 components and `react-hooks/set-state-in-effect` is back to `error`.\n\n### 6) Evidence\n\n- `vitest.config.ts`, `vitest.setup.ts`, `apps/web/playwright.config.ts`, `apps/web/e2e/*.spec.ts` (incl. `security-headers.spec.ts`)\n- `packages/testing/src/index.ts` (Testcontainers, MSW handlers, axe, arbitraries, migration-safety)\n- `.github/workflows/pr.yml`, `nightly-evals.yml`, `adapter-contract.yml`, `restore-test.yml`\n- `packages/job-pipeline/src/adapters/**/*.contract.test.ts`, `apps/api/src/**/*.integration.test.ts`\n- `apps/web/src/lib/use-api.ts` + migrated panels, `apps/web/src/lib/security-headers.test.ts`\n- `plan/testing.md`, `CONTRIBUTING.md` §Testing conventions, `plan/CLEANUP_TASKS.md` (verified gate counts)\n- `docs/codebase/.codebase-scan.txt` (CI/CD PIPELINES, GIT RECENT COMMITS)\n\n## Extended Sections\n\n### CI pipeline (from `.github/workflows/`)\n\n| Workflow | Trigger | Gates |\n|----------|---------|-------|\n| `pr.yml` | PR + push main/master | lint (`@careeros/web` only), vitest, `pnpm -r typecheck` (after explicit `prisma generate`), `pnpm audit`, Testcontainers integration, **Playwright e2e (pre-setup + seeded post-setup + axe + security-headers)**, image pins, prompt versions |\n| `trivy.yml` | PR + push + Mon 06:00 | HIGH/CRITICAL image CVEs → SARIF |\n| `codeql.yml` | PR + push + Mon 05:00 | JS/TS security-extended SAST |\n| `gitleaks.yml` | PR + push + Mon 07:00 | secret scanning |\n| `nightly-evals.yml` | daily 02:00 | LLM eval suite; drift issue on >5% regression |\n| `adapter-contract.yml` | Mon 06:00 + dispatch | live adapter contract revalidation |\n| `restore-test.yml` | Mon 03:00 + dispatch | backup restore parity |\n| `tag-release.yml` | `v*` tags | build/push images, cosign sign, Syft SBOM, SHA256SUMS |\n| `desktop-release.yml` | `desktop-v*` tags | mac/win/linux installer builds |\n\n### E2E golden-flow coverage by phase (`plan/testing.md` §3)\n\nP0 wizard+sign-in (`pre-setup.spec.ts`), P1 connect-repo (`golden-connect-repo.spec.ts`), the wider post-setup widget/a11y spec (`post-setup.spec.ts`), and a header-only `security-headers.spec.ts` (security spec item 2). P2-P6 golden flows are specified but the current e2e tree contains only these four specs — the rest are `[TODO]`.\n"},{"id":"concerns","title":"Codebase Concerns","md":"\n# Codebase Concerns\n\nPrioritised from the scan output, config, and source inspection. Severities are relative to the product's stated threat model (`plan/security.md`, `plan/ai-safety.md`). `[TODO]` marks unknowns; `[ASK USER]` marks intent gaps.\n\n## Core Sections (Required)\n\n### 1) Top Risks (Prioritized)\n\n| Severity | Concern | Evidence | Impact | Suggested action |\n|----------|---------|----------|--------|------------------|\n| High | **No global session guard; auth is enforced per-controller via `SessionService.requireUserId`** | `apps/api/src/modules/auth/auth.module.ts` (only `ThrottlerGuard` is global), 60+ call sites | One missed call = unauthenticated data access; multi-tenant readiness is weaker than schema suggests | Add a global auth guard (allowlist public routes) before multi-user lands |\n| High | **Intent docs still describe services absent from compose: GlitchTip error tracking and `whisper.cpp` speech-to-text** | `plan/observability.md`, `plan/PLAN.md:28`, `plan/phase-2-assessment-arena.md`; neither is in `infra/docker/docker-compose.yml` | Operators following docs hit missing services; verbal/multi-turn interview and error tracking are not deployable | Implement, or mark deferred clearly (both are named deferrals) |\n| Medium | **`AppConfig` global keys not user-scoped** (multitenant TODOs) | `apps/api/src/modules/usage/usage.controller.ts:96,116,137`; `usage.service.ts:122` | Multi-user flip changes another user's config | Scope by `userId` before multi-user |\n| Medium | **Live Docker egress smoke not run**: `scripts/smoke/egress.sh` exists but is not in CI and has not been executed against the full stack | `scripts/smoke/egress.sh`; `plan/CLEANUP_TASKS.md` progress log | The egress-bypass fix is unit/static-verified but not yet proven end-to-end | Run the smoke on a host with Docker and record the result |\n| Medium | **Prompt evals are thin and unregistered**: 2 `*.eval.ts` files; the daily workflow exists but the runner registration is deferred | `packages/ai/src/evals/`, `.github/workflows/nightly-evals.yml` | LLM regressions may ship unnoticed | Register the eval runner; grow skill-extract cases toward the blueprint target (`packages/ai/src/evals/skill-extract.ts:4`) |\n| Medium | **Mobile companion is read-only with no push/offline and no tests** | `apps/mobile/README.md`, `plan/phase-7-mobile.md` | Phone users get live-only reads; regressions uncovered | Ship push/offline + a mobile smoke when the phase advances |\n| Low | **Anthropic/Azure have no adapter**; fallback/circuit-breaker state is in-process | `packages/ai/src/providers/` (DeepSeek/OpenAI-compatible/Ollama/fallback); `apps/api/src/common/provider-loader.service.ts` breaker `Map` | Those provider ids fall back (or 404) rather than dispatch; multi-replica would not share breaker state | Add adapters if needed; move breaker to Redis for multi-replica |\n| Low | **Root ESLint chain is still dormant**; the cross-cutting rules are not universally enforced and `@careeros/api` has no flat config | `.eslintrc.cjs:10-18`; `apps/web/eslint.config.mjs` (web has eslint 9); `pr.yml` excludes api lint | `no-console`, raw-`chat()` and literal-`data-testid` rules are documentation in api | Opt workspaces in or move rules to a real runner |\n| Low | **Desktop installers are unsigned at MVP** | `plan/security.md` threat model; `apps/desktop/electron-builder.yml` | OS warnings on install; trust chain is the user's browser session | Sign mac/win installers at release |\n| Low | **`docs/dev-setup.md` still names planned scripts** (`pnpm seed:dev`, `pnpm ai:probe`) | root `package.json`; `docs/dev-setup.md:70,84` | Readers may try commands that are not wired yet (now labelled \"planned\") | Implement or keep explicitly marked as planned |\n\n### 1b) Resolved during the 2026-10-02 cleanup (with the fix)\n\n| Former concern | Fix landed | Evidence |\n|----------------|-----------|----------|\n| `packages/ui/src/motion.ts` missing while the barrel re-exported it (build blocker) | File added and re-exported; `@careeros/ui` resolves | `packages/ui/src/motion.ts`, `packages/ui/src/index.ts` (T1) |\n| Two Prisma majors across workspaces (api 6 / worker 5) | Worker + api + aggregator all on `@prisma/client`/`prisma` `^6.19.3` | `apps/worker/package.json`, `apps/api/package.json`, `packages/aggregator/package.json` (T11) |\n| Egress bypass — Node global `fetch` ignored proxy env vars, so Squid did not gate app traffic | `installEgressProxy()` installs an undici `EnvHttpProxyAgent` at api/worker boot and fails closed | `packages/shared/src/net/proxy-dispatcher.ts`, `apps/api/src/main.ts:97`, `apps/worker/src/main.ts:120` (T6) |\n| `@nestjs/swagger` absent while `AGENTS.md` §6 mandated it | `@nestjs/swagger` + `zod-to-openapi` added; `/api/openapi.json` + `/api/docs` served behind an auth gate | `apps/api/src/main.ts:125-142`, `apps/api/src/openapi/` (T2/U1) |\n| api/worker containers not hardened | worker + web joined api with `read_only`, `tmpfs`, `cap_drop: ALL`, `no-new-privileges` | `infra/docker/docker-compose.yml` (T8) |\n| GitHub Actions pinned to floating tags | Every `uses:` pinned to a full commit SHA with a version comment | `.github/workflows/pr.yml` and siblings (T9) |\n| Build blockers: resume-render TSX types, `@careeros/ai`/`job-pipeline` builds, shared `./net` subpath, api missing `email-parsers` dep, clean-clone `prisma generate`, out-of-sync lockfile | All fixed; central `turbo run typecheck` reached 31/31 with all packages building | `plan/CLEANUP_TASKS.md` progress log (T16, T17
