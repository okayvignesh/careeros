<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Career OS · Product Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #111418;
    --ink-2: #33383F;
    --muted: #6B7280;
    --faint: #9CA3AF;
    --hair: #E5E7EB;
    --hair-strong: #D1D5DB;
    --accent: #2B4A8B;
    --wash: #F9FAFB;
    --paper: #FFFFFF;
    --page-bg: #F3F4F6;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html { background: var(--page-bg); }
  body {
    margin: 0; background: var(--page-bg); color: var(--ink-2);
    font-family: var(--font); font-weight: 400; line-height: 1.6;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }

  /* ---- page shells ---- */
  .pagedjs_pages { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 24px 0; }
  .pagedjs_page {
    background: var(--paper); border: 1px solid var(--hair);
    box-shadow: 0 6px 24px rgba(17,20,24,.06);
    width: 210mm; height: 297mm; position: relative; overflow: hidden;
  }
  .pagedjs_pagebox { color: var(--muted); font-family: var(--font); font-size: 8pt; }
  .pagedjs_margin-bottom-left { justify-content: flex-start; }
  .pagedjs_margin-bottom-right { justify-content: flex-end; }

  /* ---- typography ---- */
  h1, h2, h3, h4 { color: var(--ink); font-weight: 600; line-height: 1.28; letter-spacing: -.01em; break-after: avoid; }
  h1 { font-size: 19pt; margin: 0 0 8pt; }
  h2 { font-size: 13pt; margin: 16pt 0 6pt; padding-bottom: 4pt; border-bottom: 1px solid var(--hair); }
  h2.sec-title { font-size: 15.5pt; margin-top: 0; padding-bottom: 6pt; border-bottom: 1px solid var(--hair-strong); }
  h3 { font-size: 11pt; margin: 12pt 0 4pt; color: var(--ink-2); }
  p, li, td, th { font-size: 10.5pt; }
  p { margin: 6pt 0; max-width: 72ch; color: var(--ink-2); orphans: 3; widows: 3; }
  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--hair-strong); }
  strong { font-weight: 600; color: var(--ink); }
  ul, ol { padding-left: 16pt; margin: 6pt 0; }
  li { margin: 2pt 0; }
  hr { border: none; border-top: 1px solid var(--hair); margin: 16pt 0; }

  code { font-family: var(--mono); font-size: 8.8pt; background: var(--wash); border: 1px solid var(--hair); padding: .05em .3em; border-radius: 3px; }
  pre { background: #FCFCFD; border: 1px solid var(--hair); border-radius: 5px; padding: 10pt 12pt; overflow-x: auto; break-inside: avoid; margin: 10pt 0; }
  pre code { background: none; border: none; padding: 0; font-size: 8.4pt; line-height: 1.55; }
  blockquote { margin: 10pt 0; padding: 1pt 0 1pt 12pt; border-left: 2px solid var(--hair-strong); color: var(--muted); }

  table { border-collapse: collapse; width: 100%; margin: 8pt 0; font-size: 9.5pt; table-layout: auto; font-variant-numeric: tabular-nums; }
  thead { display: table-header-group; }
  tr { break-inside: avoid; }
  th { text-align: left; font-weight: 600; padding: 5.5pt 8pt; color: var(--ink); background: var(--wash); border-top: 1px solid var(--hair-strong); border-bottom: 1px solid var(--hair-strong); font-size: 8.6pt; letter-spacing: .02em; text-transform: uppercase; overflow-wrap: break-word; }
  td { padding: 5.5pt 8pt; border-bottom: 1px solid var(--hair); vertical-align: top; color: var(--ink-2); overflow-wrap: break-word; }
  td code, th code { white-space: normal; overflow-wrap: anywhere; }
  tbody tr:last-child td { border-bottom: 1px solid var(--hair-strong); }

  .mermaid { break-inside: avoid; margin: 12pt 0; text-align: center; }
  .mermaid svg { max-width: 100%; height: auto; }
  figure.diagram { break-inside: avoid; margin: 12pt 0; }

  /* ---- cover ---- */
  .cover { height: 100%; padding: 28mm 22mm 22mm; display: flex; flex-direction: column; justify-content: space-between; background: var(--paper); break-after: page; }
  .cover-top { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--hair); padding-bottom: 12pt; }
  .cover-brand { display: flex; align-items: center; gap: 10pt; }
  .cover-logo { width: 34pt; height: 34pt; object-fit: contain; }
  .cover-brand-name { font-size: 10pt; font-weight: 600; letter-spacing: .02em; color: var(--ink); }
  .cover-audience { font-size: 8pt; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .cover-main { margin-top: 10mm; }
  .cover-eyebrow { font-size: 8.5pt; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); margin-bottom: 12pt; }
  .cover-title { font-size: 36pt; font-weight: 700; line-height: 1.08; letter-spacing: -.03em; color: var(--ink); margin: 0 0 14pt; }
  .cover-rule { width: 46mm; height: 2px; background: var(--ink); margin: 0 0 14pt; }
  .cover-sub { font-size: 12pt; color: var(--muted); max-width: 108mm; line-height: 1.6; }
  .cover-foot { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12pt; border-top: 1px solid var(--hair); padding-top: 12pt; }
  .cover-foot .k { font-size: 8pt; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .cover-foot .v { font-size: 11pt; color: var(--ink); margin-top: 3pt; }

  /* ---- TOC ---- */
  .toc { padding-top: 2mm; padding-bottom: 4pt; }
  .toc h1 { font-size: 18pt; margin-bottom: 14pt; }
  .toc ol { list-style: none; padding: 0; margin: 0; }
  .toc li { margin: 0; }
  .toc a { display: flex; align-items: baseline; gap: 8pt; border: none; padding: 6pt 0; color: var(--ink-2); border-bottom: 1px solid var(--hair); }
  .toc a .t { font-size: 10.5pt; font-weight: 500; color: var(--ink); }
  .toc a .dots { flex: 1; }
  .toc a .pg { font-size: 10pt; font-weight: 600; color: var(--accent); min-width: 16pt; text-align: right; }
  .toc .toc-h3 { display: none; }

  /* ---- sections ---- */
  section.doc { break-before: auto; }
  .stack-grid + section.doc, .toc + section.doc { break-before: page; }
  section.doc > h1:first-child { padding-bottom: 6pt; border-bottom: 1px solid var(--hair-strong); }
  section.doc + section.doc { border-top: 1px solid var(--hair-strong); margin-top: 22pt; padding-top: 18pt; }

  /* ---- stack grid ---- */
  .stack-grid { break-inside: avoid; margin-top: 28pt; padding-top: 20pt; border-top: 1px solid var(--hair-strong); }
  .stack-list { list-style: none; padding: 0; margin: 12pt 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 9pt; }
  .stack-item { display: flex; align-items: center; gap: 9pt; border: 1px solid var(--hair); border-radius: 6px; padding: 8pt 10pt; break-inside: avoid; background: var(--paper); }
  .stack-icon { width: 20pt; height: 20pt; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 20pt; }
  .stack-icon img { width: 20pt; height: 20pt; object-fit: contain; }
  .stack-fallback { width: 20pt; height: 20pt; border-radius: 4px; background: var(--ink); color: #fff; font-size: 8pt; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; }
  .stack-meta { display: flex; flex-direction: column; }
  .stack-name { font-weight: 600; font-size: 10pt; color: var(--ink); }
  .stack-role { font-size: 8pt; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

  /* public doc: larger, airier */
  .audience-public p, .audience-public li, .audience-public td { font-size: 11.5pt; }
  .audience-public p { max-width: 74ch; line-height: 1.66; }
  .audience-public h1 { font-size: 26pt; }
  .audience-public h2.sec-title { font-size: 19pt; }

  .nojs { padding: 24px; font-family: var(--font); }

  @page :first {
    @bottom-left { content: none; }
    @bottom-right { content: none; }
  }

  @page {
    size: A4;
    margin: 20mm 18mm 18mm;
    @bottom-left {
      content: "Career OS · Product Overview";
      font-family: "Inter", sans-serif; font-size: 8pt; color: #9CA3AF;
    }
    @bottom-right {
      content: "Page " counter(page) " of " counter(pages);
      font-family: "Inter", sans-serif; font-size: 8pt; color: #9CA3AF;
    }
  }

  @media print {
    html, body { background: #fff; }
    .pagedjs_pages { gap: 0; padding: 0; }
    .pagedjs_page { box-shadow: none; border: none; }
  }
</style>
</head>

<script id="kb-data" type="application/json">{"mode":"public","repo":"Career OS","title":"Career OS","subtitle":"A plain-language guide to what the platform is, what it does, and how it is built.","audience":"For a general audience","date":"2026-10-03","version":"","docs":[{"id":"s-1","title":"What Career OS is","md":"## What Career OS is\n\nCareer OS is a personal career assistant that you run yourself, on your own computer or server. Think of it as a private, always-on career coach and organizer in one: it keeps a living record of your professional life, watches the job market for you, and helps you apply well, without ever inventing things about your experience.\n\nIt is built around one simple promise: it works from *evidence*, not guesswork. Everything it tells you or writes for you is tied back to real facts you have confirmed, such as your resume, your public code, and your assessment results.\n\n"},{"id":"s-2","title":"Who it is for","md":"## Who it is for\n\nCareer OS is for one person at a time: someone actively looking for a job, or preparing for their next move, who wants serious automation without handing their private career data to a large company. It suits people who are comfortable running software on their own machine and who care about privacy.\n\nIt is not a public website, not a recruiting product, and not something your employer or a third party operates for you.\n\n"},{"id":"s-3","title":"What it does","md":"## What it does\n\n- **Builds a digital twin of you.** It gathers your resume, your public code, your practice results, and what you have done in past applications, then keeps a continuously updated picture of your skills. Each skill is shown with how strong it is, how confident the system is, and how recently you used it.\n- **Practices with you.** It offers a range of exercises and assessments, tracks your progress, and suggests what to learn next based on what the job market actually wants.\n- **Watches the job market.** It collects job listings from reputable sources, cleans and de-duplicates them, checks how fresh they are, and matches them to your real skills, so you see the roles that genuinely fit. It can also discover postings on public company career sites and job boards (including Workday and other major applicant-tracking systems) using a managed web-crawling service, always respecting each site's published rules and only for public pages.\n- **Helps you apply.** It can prepare resumes and cover letters tailored to a specific job, but only by rephrasing facts you have already confirmed. Anything it cannot back up is blocked before you ever see it.\n- **Keeps you organized.** It tracks each application through every stage, reminds you what needs doing, and follows up on replies.\n- **Reaches you where you are.** It can send a daily summary and take simple commands through Slack, read job-related email to keep your application tracker up to date, and offer a **free companion mobile app** (iOS and Android) showing your daily brief, matched jobs, and pending approvals on the go.\n- **Works on desktop too.** A small companion program for your own computer lets you review devices, pair the desktop agent, and run job-site browsing from your own logged-in session.\n\n"},{"id":"s-4","title":"How people use it","md":"## How people use it\n\n1. **Set it up once.** You install it, then walk through a guided setup that connects your accounts, imports your resume, and asks you to confirm the facts it found. Nothing sensitive is accepted without your review.\n2. **Review your starting point.** The dashboard shows your skill picture, your progress, and early suggestions for what to strengthen.\n3. **Practice and improve.** You take assessments and work through suggested learning, and your profile gets more accurate over time.\n4. **Browse matched jobs.** The market view shows roles that fit your verified skills, with a clear explanation of where you are strong and where there are gaps.\n5. **Prepare and apply.** You generate a tailored resume or cover letter, review it, and approve it. Nothing is ever sent on your behalf without your explicit approval.\n6. **Track and follow up.** Your applications and replies stay in one timeline, so nothing falls through the cracks.\n\n"},{"id":"s-5","title":"How it is built (in general terms)","md":"## How it is built (in general terms)\n\nCareer OS is a self-contained application. You run a web interface that you open in your browser, backed by a secure database that stores your information, plus background helpers that fetch and organize job data. A companion mobile app (Expo/React Native, iOS and Android) reads the same data from your server, and a small desktop program can browse job sites using your own logged-in session, with your permission. For public company career pages and job boards, it uses a managed crawling service and direct adapters that honor each site's rules and rate limits; sites that forbid automated access are not crawled. It is free and open-source software (AGPL-3.0-or-later), so the whole system is inspectable and self-hostable.\n\nIt is designed to be provider-agnostic for artificial intelligence: the intelligence layer is a replaceable component, so the system can work with different AI providers instead of being tied to one. It ships with a sensible default and can fall back to a locally run model if your preferred service is unavailable.\n\n"},{"id":"s-6","title":"Trust and privacy","md":"## Trust and privacy\n\n- **You own the data.** Career OS is designed so you can export everything it holds about you, or delete it entirely, with a confirmation step. Your backup files are encrypted before they leave your machine.\n- **Nothing sends itself.** Every outgoing action, such as submitting an application or sending a message, waits for your approval and is recorded in an audit trail.\n- **No invented facts.** Generated documents may only rephrase facts you have confirmed, and a second check blocks anything it cannot trace to a source.\n- **Careful with sensitive material.** Content marked as employer-confidential is, by default, never sent to an external AI service.\n- **Quiet by default.** The system does not report back to its makers; it only talks to the services you personally connect, and everything about your data stays under your control.\n\n"},{"id":"s-7","title":"Where to go next","md":"## Where to go next\n\n- **Product and architecture detail:** see the technical knowledge base in this folder (`README.md`, `ARCHITECTURE.md`).\n- **Setup walkthrough:** see `docs/dev-setup.md` in the repository.\n- **Rules and roadmap:** see `AGENTS.md` and `plan/PLAN.md`.\n- **Security posture:** see `SECURITY.md` and `plan/security.md`.\n\n> Current state: Career OS is an early alpha, under active development. Some features described above are partially built and clearly marked as such in the technical documents. The mobile app is read-only for now (no push or offline support yet). Treat this overview as the intended product, and the engineering knowledge base as the accurate picture of what exists today.\n"}]}</script>

        mNodes[mi].classList.add('mermaid-error');
        console.warn('mermaid fail [' + mi + ']: ' + (e && e.message) + ' :: ' + mNodes[mi].textContent.slice(0, 90).replace(/\s+/g, ' '));
      }
    }
  }

  await Promise.all(Array.prototype.map.call(document.images, function (img) {
    return img.complete ? Promise.resolve() : new Promise(function (res) { img.onload = res; img.onerror = res; });
  }));

  if (window.PagedPolyfill && window.PagedPolyfill.preview) {
    try { await window.PagedPolyfill.preview(); } catch (e) { console.warn('pagedjs', e); }
    var pgs = Array.prototype.slice.call(document.querySelectorAll('.pagedjs_page'));
    pgs.forEach(function (p, i) { p.setAttribute('data-page', String(i + 1)); });
    Array.prototype.forEach.call(document.querySelectorAll('.toc a'), function (a) {
      var id = (a.getAttribute('href') || '').slice(1);
      var target = id ? document.getElementById(id) : null;
      var pg = target ? target.closest('.pagedjs_page') : null;
      var span = a.querySelector('.pg');
      if (span) span.textContent = pg ? (pg.getAttribute('data-page') || '') : '';
    });
  }
  document.body.setAttribute('data-kb-ready', '1');
})();

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
</script>
</body>
</html>
