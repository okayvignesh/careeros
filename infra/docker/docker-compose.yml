name: careeros

# ─── Wave A-infra security hardening ────────────────────────────────────────
# A-H8: two networks. `internal` holds datastores (postgres/redis/qdrant/minio)
#       with zero outbound reach. `egress` holds api+worker+squid so app code
#       can only reach the outside world through the Squid allowlist proxy.
# A-H9: no default passwords. `${VAR:?…}` forces compose to abort on missing
#       env, and startup-check.ts refuses to boot on weak/short values.
# A-M7: every image pinned by sha256 digest so a rebuild pulls the exact same
#       bits. Human-readable tag stays as a comment above each digest for
#       upgrade traceability. Digests captured via `docker buildx imagetools
#       inspect <ref>` on 2026-09-27 (see scripts/verify-image-pins.sh).

services:
  postgres:
    # postgres:16-alpine (digest via `docker buildx imagetools inspect`, 2026-09-27)
    image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (openssl rand -base64 32)}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required (see .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  redis:
    # redis:7-alpine (digest via `docker buildx imagetools inspect`, 2026-09-27)
    image: redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  qdrant:
    # qdrant/qdrant:v1.12.4 (digest via `docker buildx imagetools inspect`, 2026-09-27)
    image: qdrant/qdrant@sha256:241edb9d7778327516ef218f8c74e1bd61b5ea42cd4f193cb8d0896199705636
    restart: unless-stopped
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ['CMD-SHELL', 'bash -c ":> /dev/tcp/127.0.0.1/6333"']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  minio:
    # bitnamilegacy/minio:2024.10.29-debian-12-r1 (digest via `docker buildx
    # imagetools inspect`, 2026-09-27). Switched off `quay.io/minio/minio`
    # because that repo now requires authentication for anonymous pulls, which
    # made digest verification impossible from CI. Bitnami's image bundles the
    # same MinIO server binary and honors the same MINIO_ROOT_* env vars.
    # ponytail: swap back to upstream quay if MinIO restores anonymous read.
    image: bitnamilegacy/minio@sha256:d07cf144fe42fd6d49bc4757e5562baa92407157626e4ffebbeb02e03c716268
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required (see .env.example)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required (openssl rand -base64 32)}
      MINIO_SCHEME: http
      MINIO_API_PORT_NUMBER: '9000'
      MINIO_CONSOLE_PORT_NUMBER: '9001'
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      # /minio/health/live is MinIO's documented liveness probe and works on
      # any distribution of the server binary (no `mc` dependency).
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9000/minio/health/live || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # A-H8: Squid egress proxy. Api + worker route ALL outbound HTTP(S) through
  # this container. squid.conf enforces a deny-by-default allowlist so a
  # compromised worker cannot reach 169.254.169.254 or arbitrary hosts.
  squid:
    # ubuntu/squid:6.10-24.10_edge (digest via `docker buildx imagetools
    # inspect`, 2026-09-27)
    image: ubuntu/squid@sha256:c9f5212b147a766529c7b026e2bebed37b998d33d0066b658596af5eba7cc65c
    restart: unless-stopped
    volumes:
      - ./squid/squid.conf:/etc/squid/squid.conf:ro
    healthcheck:
      test: ['CMD-SHELL', 'squid -k check || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - egress

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-careeros}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      API_PORT: 3001
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:3000}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # A-H8: force every outbound HTTP(S) through the Squid allowlist proxy.
      # NO_PROXY exempts the private datastore names so intra-compose traffic
      # stays on the internal net without a proxy hop.
      HTTP_PROXY: http://squid:3128
      HTTPS_PROXY: http://squid:3128
      NO_PROXY: postgres,redis,minio,qdrant,localhost,127.0.0.1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      squid:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/health']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      # api needs `internal` to reach datastores AND `egress` to reach squid.
      - internal
      - egress

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_PROXY: http://squid:3128
      HTTPS_PROXY: http://squid:3128
      NO_PROXY: postgres,redis,minio,qdrant,localhost,127.0.0.1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      squid:
        condition: service_healthy
    networks:
      - internal
      - egress

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_TELEMETRY_DISABLED: 1
      API_URL: http://api:3001
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:3001}
    depends_on:
      api:
        condition: service_healthy
    networks:
      # web talks only to api; keep on egress side. If future web-side outbound
      # is required (e.g. server-side fetch to a CDN) it also routes via squid.
      - egress

networks:
  # `internal`: no ingress/egress from the outside. Datastores only.
  internal:
    driver: bridge
    internal: true
  # `egress`: reachable by app tier; squid gates all outbound.
  egress:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  miniodata:
