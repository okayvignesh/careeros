name: careeros

# ─── Wave A-infra security hardening ────────────────────────────────────────
# A-H8: two networks. `internal` holds datastores (postgres/redis/qdrant/minio)
#       with zero outbound reach. `egress` holds api+worker+squid so app code
#       can only reach the outside world through the Squid allowlist proxy.
# A-H9: no default passwords. `${VAR:?…}` forces compose to abort on missing
#       env, and startup-check.ts refuses to boot on weak/short values.
# A-M7: every image pinned by sha256 digest so a rebuild pulls the exact same
#       bits. Human-readable tag stays as a comment above each digest for
#       upgrade traceability. Digests captured via `docker buildx imagetools
#       inspect <ref>` on 2026-09-27 (see scripts/verify-image-pins.sh).

# Default log driver cap. Without this a long-running service can fill the
# host disk with uncapped JSON logs; `max-size=10m` + `max-file=5` caps
# total per-container log usage at 50MB. observability.md checklist item.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  postgres:
    # postgres:16-alpine (digest via `docker buildx imagetools inspect`, 2026-09-27)
    image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (openssl rand -base64 32)}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required (see .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  redis:
    # redis:7-alpine (digest via `docker buildx imagetools inspect`, 2026-09-27)
    image: redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  qdrant:
    # qdrant/qdrant:v1.12.4 (digest via `docker buildx imagetools inspect`, 2026-09-27)
    image: qdrant/qdrant@sha256:241edb9d7778327516ef218f8c74e1bd61b5ea42cd4f193cb8d0896199705636
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ['CMD-SHELL', 'bash -c ":> /dev/tcp/127.0.0.1/6333"']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  minio:
    # bitnamilegacy/minio:2024.10.29-debian-12-r1 (digest via `docker buildx
    # imagetools inspect`, 2026-09-27). All alternative anonymous pulls are
    # blocked: quay.io/minio 401s, docker.io/minio/minio and bitnami/minio
    # were both removed post-Broadcom.
    # ponytail: bitnamilegacy is deprecated; audit quarterly. Migration path
    # is an authenticated pull from quay.io once creds are provisioned, or a
    # switch to a self-hosted MinIO Docker Hub mirror per task #22.
    image: bitnamilegacy/minio@sha256:d07cf144fe42fd6d49bc4757e5562baa92407157626e4ffebbeb02e03c716268
    restart: unless-stopped
    # user: '0:0' lets bitnami's entrypoint chown the volume to UID 1001
    # (bitnami's minio user) on first boot; the server itself still runs as
    # 1001 per the image's built-in privilege drop. Without this, named
    # volumes start root-owned and 1001's write to `.root_user` fails.
    user: '0:0'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required (see .env.example)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required (openssl rand -base64 32)}
      MINIO_SCHEME: http
      MINIO_API_PORT_NUMBER: '9000'
      MINIO_CONSOLE_PORT_NUMBER: '9001'
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      # /minio/health/live is MinIO's documented liveness probe. bitnamilegacy
      # ships curl but not wget, so use curl.
      test: ['CMD-SHELL', 'curl -sf http://127.0.0.1:9000/minio/health/live || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # A-H8: Squid egress proxy. Api + worker route ALL outbound HTTP(S) through
  # this container. squid.conf enforces a deny-by-default allowlist so a
  # compromised worker cannot reach 169.254.169.254 or arbitrary hosts.
  squid:
    # ubuntu/squid:6.10-24.10_edge (digest via `docker buildx imagetools
    # inspect`, 2026-09-27)
    image: ubuntu/squid@sha256:c9f5212b147a766529c7b026e2bebed37b998d33d0066b658596af5eba7cc65c
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./squid/squid.conf:/etc/squid/squid.conf:ro
      # /var/log/squid needs to be writable by the container's `proxy` user
      # (uid 13 in ubuntu/squid); tmpfs so we do not persist per-request logs
      # across restarts. Mode 0777 because the tmpfs is owned by root and we
      # need proxy user to write; ubuntu/squid's cache_effective_user drops to
      # `proxy` before logfile daemon spawns.
      # Operator: `docker compose exec squid tail -f /var/log/squid/access.log`.
      - type: tmpfs
        target: /var/log/squid
        tmpfs:
          mode: 0o1777
    healthcheck:
      test: ['CMD-SHELL', 'squid -k check || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - egress

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-careeros}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      API_PORT: 3001
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:3000}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # A-H8: force every outbound HTTP(S) through the Squid allowlist proxy.
      # NO_PROXY exempts the private datastore names so intra-compose traffic
      # stays on the internal net without a proxy hop.
      HTTP_PROXY: http://squid:3128
      HTTPS_PROXY: http://squid:3128
      NO_PROXY: postgres,redis,minio,qdrant,localhost,127.0.0.1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      squid:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/health']
      interval: 10s
      timeout: 5s
      retries: 10
    # security.md item 10: non-root UID (set in Dockerfile.api), read-only
    # rootfs with tmpfs for the dirs the node runtime needs to write, drop
    # ALL Linux caps (api never binds <1024 or raises priority), seccomp
    # default profile + no-new-privileges. Dev compose override flips
    # read_only off because `pnpm dev` writes .next/.turbo/node_modules
    # caches under /app.
    # ponytail: seccomp uses docker's default profile (empty security_opt
    # entry is implicit); a custom profile at infra/docker/seccomp/api.json
    # lands when a real syscall needs blocking that the default allows.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.cache:size=64m,mode=0755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      # api needs `internal` to reach datastores AND `egress` to reach squid.
      - internal
      - egress

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_PROXY: http://squid:3128
      HTTPS_PROXY: http://squid:3128
      NO_PROXY: postgres,redis,minio,qdrant,localhost,127.0.0.1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      squid:
        condition: service_healthy
    # security.md item 10: non-root UID (set in Dockerfile.worker), read-only
    # rootfs with tmpfs for the dirs the node runtime needs to write, drop ALL
    # Linux caps (worker binds no ports <1024), no-new-privileges. Dev compose
    # override flips read_only off and runs as root for `tsx watch`.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
      - egress

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_TELEMETRY_DISABLED: 1
      API_URL: http://api:3001
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:3001}
    depends_on:
      api:
        condition: service_healthy
    # security.md item 10: non-root UID (set in Dockerfile.web), read-only
    # rootfs, drop ALL Linux caps (web binds 3000 only), no-new-privileges.
    # Next.js `next start` needs a writable `.next/cache` (fetch cache + image
    # optimizer); tmpfs roots are root-owned, so mode 1777 lets UID 1001 write.
    # Dev override flips read_only off + runs as root for `next dev`.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/apps/web/.next/cache:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      # web talks only to api; keep on egress side. If future web-side outbound
      # is required (e.g. server-side fetch to a CDN) it also routes via squid.
      - egress

  # ─── Public entrypoint: nginx TLS termination + ACME ──────────────────────
  # Only nginx publishes host ports; it is the network's sole public face
  # (security.md item 10 / AGENTS.md §5). config: infra/nginx/. Defaults keep
  # `docker compose config` valid without a real domain; local dev uses a
  # self-signed cert generated by infra/nginx/self-signed.sh, production points
  # TLS_* at the certbot volume. See infra/nginx/README.md.
  nginx:
    # nginx:alpine (digest via `docker buildx imagetools inspect`, 2026-10-02)
    image: nginx@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    restart: unless-stopped
    logging: *default-logging
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
      # Rendered into conf.d/careeros.conf by the image's envsubst entrypoint;
      # must be present in the environment or envsubst leaves the placeholder.
      TLS_CERT_PATH: ${TLS_CERT_PATH:-/etc/nginx/certs/tls.crt}
      TLS_KEY_PATH: ${TLS_KEY_PATH:-/etc/nginx/certs/tls.key}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-0}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/templates:/etc/nginx/templates:ro
      # Local self-signed certs (dev). Real certs come from the letsencrypt
      # volume below.
      - ../nginx/certs:/etc/nginx/certs:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost/healthz || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - egress

  # ACME client. Renews issued certs every 12h; inert until the first
  # `certbot certonly` (documented in infra/nginx/README.md) writes to the
  # shared `letsencrypt` volume.
  certbot:
    # certbot/certbot:v5.8.0 (digest via `docker buildx imagetools inspect`, 2026-10-02)
    image: certbot/certbot@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    restart: unless-stopped
    logging: *default-logging
    entrypoint: /bin/sh
    command:
      - -c
      - 'trap "exit 0" TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 43200 & wait $${!}; done'
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks:
      - egress

  # ─── Scheduled backups (ops profile) ─────────────────────────────────────
  # Runs scripts/backup-cron.sh nightly inside the private network, writing
  # age-encrypted artifacts to the `backupdata` volume. Opt in with:
  #   docker compose --profile ops up -d backup
  # Requires AGE_RECIPIENT in .env; the entrypoint refuses to start without it.
  # See docs/backup.md.
  backup:
    profiles: ['ops']
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backup
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Left optional in compose so the base stack (and `compose config`)
      # stays valid without a backup key; the entrypoint enforces it.
      AGE_RECIPIENT: ${AGE_RECIPIENT:-}
      BACKUP_DIR: /var/backups/careeros
      BACKUP_CRON_SCHEDULE: ${BACKUP_CRON_SCHEDULE:-17 3 * * *}
      PGHOST: postgres
      PGPORT: '5432'
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required (see .env.example)}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required (see .env.example)}
      MC_ALIAS: minio
      MC_BUCKET: ${MINIO_BUCKET:-careeros}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required (see .env.example)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required (see .env.example)}
      QDRANT_URL: http://qdrant:6333
    volumes:
      - backupdata:/var/backups/careeros
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      # Backups read datastores over the private network; no outbound needed.
      - internal

networks:
  # `internal`: no ingress/egress from the outside. Datastores only.
  internal:
    driver: bridge
    internal: true
  # `egress`: reachable by app tier; squid gates all outbound.
  egress:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  miniodata:
  # Public entrypoint certs. certbot writes; nginx reads.
  letsencrypt:
  certbot-www:
  # age-encrypted backup artifacts (backup sidecar, ops profile).
  backupdata:
