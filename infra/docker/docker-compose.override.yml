# Dev overrides: bind-mount source for hot reload.
# postgres + redis intentionally not exposed on host — api/worker/web reach them via internal network.
# For direct psql / redis-cli, use: docker compose exec postgres psql -U careeros
services:

  api:
    ports:
      - '3001:3001'
    # Dev needs a writable rootfs (pnpm dev writes .turbo + nest build cache
    # under /app) and root UID so bind-mounted source owned by the host user
    # is readable; prod hardening lives in docker-compose.yml.
    read_only: false
    user: root
    volumes:
      - ../../apps/api:/app/apps/api
      - ../../packages:/app/packages
      - /app/apps/api/node_modules
      - /app/node_modules
    command: pnpm --filter @careeros/api dev

  worker:
    # Dev needs root + writable rootfs: bind-mounted source is host-owned and
    # `tsx watch` writes caches under /app; prod hardening lives in
    # docker-compose.yml.
    read_only: false
    user: root
    volumes:
      - ../../apps/worker:/app/apps/worker
      - ../../apps/api:/app/apps/api
      - ../../packages:/app/packages
      - /app/apps/worker/node_modules
      - /app/apps/api/node_modules
      - /app/node_modules
    command: pnpm --filter @careeros/worker dev

  web:
    ports:
      - '3000:3000'
    # Dev needs root + writable rootfs: bind-mounted source is host-owned and
    # `next dev` writes .next + caches under /app; prod hardening lives in
    # docker-compose.yml.
    read_only: false
    user: root
    volumes:
      - ../../apps/web:/app/apps/web
      - ../../packages:/app/packages
      - /app/apps/web/node_modules
      - /app/node_modules
    command: pnpm --filter @careeros/web dev
