# Dev overrides: bind-mount source for hot reload.
# postgres + redis intentionally not exposed on host — api/worker/web reach them via internal network.
# For direct psql / redis-cli, use: docker compose exec postgres psql -U careeros
services:

  api:
    ports:
      - '3001:3001'
    volumes:
      - ../../apps/api:/app/apps/api
      - ../../packages:/app/packages
      - /app/apps/api/node_modules
      - /app/node_modules
    command: pnpm --filter @careeros/api dev

  worker:
    volumes:
      - ../../apps/worker:/app/apps/worker
      - ../../apps/api:/app/apps/api
      - ../../packages:/app/packages
      - /app/apps/worker/node_modules
      - /app/apps/api/node_modules
      - /app/node_modules
    command: pnpm --filter @careeros/worker dev

  web:
    ports:
      - '3000:3000'
    volumes:
      - ../../apps/web:/app/apps/web
      - ../../packages:/app/packages
      - /app/apps/web/node_modules
      - /app/node_modules
    command: pnpm --filter @careeros/web dev
