# A-H8: Squid egress proxy for the Career OS api + worker containers.
# Deny-by-default. Only the hosts listed in `allowed_dsts` may leave the
# compose network. Every request is logged with URL + client IP + verdict so
# an operator can audit what the app tier is calling.

http_port 3128

# ─── ACLs ──────────────────────────────────────────────────────────────────
# Source: only the compose `egress` bridge (RFC1918). Anything else is denied
# before we even look at the destination.
acl src_egress src 172.16.0.0/12
acl src_egress src 10.0.0.0/8
acl src_egress src 192.168.0.0/16

# Standard safety ACLs (Squid ships these; re-declare so this file is standalone).
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

# ─── Destination allowlist (deny-by-default) ───────────────────────────────
# Every domain here must trace to a documented outbound path in the
# security spec (item 6). Add hosts by editing this file only.
acl allowed_dsts dstdomain .deepseek.com
acl allowed_dsts dstdomain .openai.com
acl allowed_dsts dstdomain .anthropic.com
acl allowed_dsts dstdomain .openrouter.ai
acl allowed_dsts dstdomain .github.com
acl allowed_dsts dstdomain .githubusercontent.com
acl allowed_dsts dstdomain .gitlab.com
acl allowed_dsts dstdomain .npmjs.org
acl allowed_dsts dstdomain registry.npmjs.org
acl allowed_dsts dstdomain github-releases.githubusercontent.com
# Firecrawl (https://api.firecrawl.dev) — managed search/scrape/crawl of PUBLIC
# company career sites + ATS boards per AGENTS.md §3.4. The ban on server-side
# LinkedIn/Indeed/Naukri/Glassdoor remains: Firecrawl must not be pointed at
# those hosts.
acl allowed_dsts dstdomain .firecrawl.dev

# ─── Crawl-target policy (deny-by-default preserved) ───────────────────────
# Direct crawling of public career sites / ATS boards (Workday, Lever,
# SmartRecruiters, Workable, iCIMS, SuccessFactors) is allowed by policy but
# each target host still needs an explicit operator-added `allowed_dsts` line
# here; wildcarding the internet would break the deny-by-default posture. Prefer
# routing discovery through Firecrawl (`.firecrawl.dev` above) so this list only
# carries hosts an operator has reviewed for robots.txt/ToS. See
# docs/job-sources.md.

# ─── Rules ─────────────────────────────────────────────────────────────────
# Refuse anything that isn't 80/443. Blocks obscure ports.
http_access deny !Safe_ports
# Refuse CONNECT to anything except 443. Blocks tunneling through the proxy.
http_access deny CONNECT !SSL_ports

# Allow only egress-network sources to allowed destinations.
http_access allow src_egress allowed_dsts

# Deny everything else and log the denial with the URL that was refused.
http_access deny all

# ─── Logging ───────────────────────────────────────────────────────────────
# ponytail: writing to /dev/stdout requires /dev to be writable by squid's
# unprivileged `proxy` user, which cap-drop breaks. Route through squid's
# `daemon` helper writing to a tmpfs-backed /var/log/squid instead. Operator
# can tail via `docker compose exec squid tail -f /var/log/squid/access.log`.
# Upgrade path: add a sidecar log-forwarder that tails to stdout if
# `docker logs squid` per-request visibility becomes load-bearing.
access_log daemon:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log

# No on-disk cache. The app tier already has its own caching; a shared cache
# here would just add an exfiltration surface.
cache deny all

# ─── Hardening ─────────────────────────────────────────────────────────────
# Do not advertise via mailto, do not accept via forwarded-for chains.
visible_hostname squid.careeros.local
forwarded_for delete
via off
httpd_suppress_version_string on

# Refuse requests without a Host header (blocks some blind SSRF variants).
request_header_access Host allow all

# Refuse to be a reverse-proxy target from the internet.
acl to_local_ip dst 127.0.0.0/8
http_access deny to_local_ip
