# Career OS public reverse proxy — main config.
#
# Mounted read-only at /etc/nginx/nginx.conf. The single server block lives in
# templates/careeros.conf.template and is rendered by the official image's
# envsubst entrypoint (/docker-entrypoint.d/20-envsubst-on-templates.sh) into
# /etc/nginx/conf.d/careeros.conf using SERVER_NAME, TLS_CERT_PATH,
# TLS_KEY_PATH and HSTS_MAX_AGE from the container environment.
#
# Only nginx publishes host ports (80/443). It joins the compose `egress`
# network — the only network web:3000 and api:3001 share — so it can resolve
# both by name. Datastores stay on `internal: true` and are unreachable here.
#
# envsubst caveat: the entrypoint only replaces variables that are PRESENT in
# the container environment. nginx runtime variables ($host, $uri, $scheme,
# $http_upgrade, …) are not env vars and are left intact.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # Resume / generated-PDF uploads. Keep in sync with the api body limit.
    client_max_body_size 25m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    # WebSocket + SSE upgrade passthrough.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Headers every proxied request carries. Location blocks only override
    # what they must (e.g. SSE timeouts).
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # Explicit, not a glob: avoids clobbering/duelling with an image-baked
    # /etc/nginx/conf.d/default.conf.
    include /etc/nginx/conf.d/careeros.conf;
}
