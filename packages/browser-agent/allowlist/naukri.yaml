domain: naukri.com
allowed_paths:
  - /
  - /jobs-in-*
  - /job-listings-*
  - /mnjuser/homepage
  - /mnjuser/recruiterprofiles
forbidden_selectors:
  - "input[type=password]"
  - "form[action*=login]"
  - "button[id*=chatBtn]"
required_headers:
  - user-agent
  - accept-language
# F.3 form-fill: Naukri's classic apply form is a single server-rendered page.
# The newer "chat" apply assistant asks free-text questions this flow cannot
# answer; those runs return selector-broken and the user finishes manually.
field_selectors:
  name: "input[name*=name]"
  email: "input[name*=email]"
  phone: "input[name*=mobile]"
  resume_upload: "input[type=file]"
apply_flow:
  entry: "button#apply-button"
  steps:
    - name: form
  submit: "button#applyButton"
  success: ".apply-status-success"
submit_selector: "button#applyButton"
success_signal: ".apply-status-success"
pacing_overrides:
  per_min: 3
