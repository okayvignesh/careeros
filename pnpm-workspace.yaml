packages:
  - 'apps/*'
  - 'packages/*'

# A-H7 (multer ^2.4.0) and B-11 (postcss ^8.5.18) are pinned as direct deps in
# apps/api/package.json and apps/web/package.json, and enforced for transitive
# dependents via `pnpm.overrides` in the root package.json.
#
# Keep overrides in root package.json `pnpm.overrides`: pnpm 9.12 (the version
# pinned by `packageManager`) reads that field with no warning. It does NOT read
# an `overrides:` block from this file — workspace-level overrides are a pnpm
# >=10 feature and are silently ignored by 9.12.
