packages:
  - 'apps/*'
  - 'packages/*'

# No overrides needed: both A-H7 (multer ^2.4.0) and B-11 (postcss ^8.5.18)
# pins live as direct deps in apps/api/package.json and apps/web/package.json
# respectively, so pnpm resolves them there without an overrides block.
#
# Do NOT re-add `pnpm.overrides` to root package.json (task #14): pnpm 9.12
# ignores that field and prints a WARN on every command (commit 75b3a1f
# already dropped it once). If a new transitive pin is ever required, add it
# here under `overrides:` per https://pnpm.io/settings, not in package.json.
