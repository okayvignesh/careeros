# PR gate. Extended by C-P0.5a: test + typecheck jobs alongside the
# existing A-H7 (dep-vuln) and A-M7 (image-pin) gates.
# Owning specs: security.md item 10, testing.md phase-0 CI wiring.
name: PR

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  test:
    name: vitest (unit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Root vitest run walks every workspace via the shared config.
      # Must stay green: all 325+ tests pass or the PR is blocked.
      - name: Run vitest
        run: pnpm exec vitest run

  typecheck:
    name: tsc (all workspaces)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

  audit:
    name: pnpm audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit prod deps (fail on high/critical)
        run: pnpm audit --prod --audit-level=high

  # A-M7: every image in every compose file must be digest-pinned.
  image-pins:
    name: verify docker image pins (@sha256:...)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify pins
        run: bash scripts/verify-image-pins.sh
