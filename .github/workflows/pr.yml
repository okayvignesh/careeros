# PR gate. Extended by C-P0.5a: test + typecheck jobs alongside the
# existing A-H7 (dep-vuln) and A-M7 (image-pin) gates.
# Owning specs: security.md item 10, testing.md phase-0 CI wiring.
name: PR

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  test:
    name: vitest (unit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Root vitest run walks every workspace via the shared config.
      # Must stay green: all 325+ tests pass or the PR is blocked.
      - name: Run vitest
        run: pnpm exec vitest run

  typecheck:
    name: tsc (all workspaces)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

  audit:
    name: pnpm audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit prod deps (fail on high/critical)
        run: pnpm audit --prod --audit-level=high

  # C-P0.4d: integration suite behind Testcontainers. Opt-in — the job
  # runs on GitHub-hosted runners (Docker preinstalled) so we always exercise
  # it in CI; laptops without Docker skip cleanly via TESTCONTAINERS_E2E=1
  # + isDockerAvailable() guards inside each *.integration.test.ts.
  test-integration:
    name: vitest (integration, Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache Docker images pulled by Testcontainers
        uses: actions/cache@v4
        with:
          path: ~/.cache/testcontainers
          key: testcontainers-${{ runner.os }}-v1

      - name: Run integration tests
        env:
          TESTCONTAINERS_E2E: '1'
        run: pnpm test:integration

  # A-M7: every image in every compose file must be digest-pinned.
  image-pins:
    name: verify docker image pins (@sha256:...)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify pins
        run: bash scripts/verify-image-pins.sh

  # C-P0.2c: any change to a Prompt catalog file must bump the `version:`
  # field so audit rows + hash log rotate. Owning spec: ai-safety.md item 3.
  prompt-versions:
    name: verify prompt version bumps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history back to the PR base so the script can diff.
          fetch-depth: 0
      - name: verify version bumps
        env:
          # For pull_request events GITHUB_BASE_REF is the target branch;
          # for push events fall back to the previous commit.
          BASELINE_REF: ${{ github.base_ref && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: bash scripts/verify-prompt-versions.sh
