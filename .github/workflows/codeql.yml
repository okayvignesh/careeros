# security.md item 10: CodeQL SAST on every push + weekly scheduled scan.
# Owns ongoing vulnerability discovery in the TypeScript + GitHub Actions
# surfaces. Trivy (image scan) + gitleaks (secret scan) + pnpm audit
# (dep-vuln scan) live in sibling workflows.
name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Monday 05:00 UTC - picks up new CVEs on the main branch weekly even
    # without a push.
    - cron: '0 5 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          languages: ${{ matrix.language }}
          # Default queries + security-extended for a broader net on the
          # TypeScript surface. Actions scan uses default (there is no
          # extended set).
          queries: ${{ matrix.language == 'javascript-typescript' && 'security-extended' || '' }}

      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          category: /language:${{ matrix.language }}
